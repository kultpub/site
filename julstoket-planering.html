<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173d35">
<title>Julstöket – Kulturens planering</title>

<style>
  /*
   * JULSTÖKET – SIDANS STILAR
   * Två blanksteg per nivå. Avsnitten följer sidans vyer och dialoger.
   * Skärmanpassningar ligger i respektive avsnitt.
   */

  /* ==========================================================================
     01. GRUNDINSTÄLLNINGAR
     Färger, mått, typografi och gemensamma element.
     ========================================================================== */

  :root {
    --day-bg: #f6f7f1;
    --day-ink: #26352b;
    --day-line: #dce2d5;
    --green: #173d35;
    --green2: #285e4d;
    --paper: #f6f7f1;
    --white: #fff;
    --ink: #26352b;
    --muted: #6f786d;
    --line: #dce2d5;
    --soft: #eaf0e5;
    --red: #a24b34;
    --rose: #fcf0e7;
    --gold: #aa8039;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    color: var(--ink);
    background: var(--paper);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  button:disabled {
    cursor: not-allowed;
    opacity: .55;
  }

  button,
  a,
  input,
  select,
  textarea {
    outline-offset: 3px;
  }

  button:focus-visible,
  a:focus-visible {
    outline: 3px solid var(--gold);
  }

  button {
    color: inherit;
  }

  a {
    color: var(--green2);
  }

  h2,
  h3,
  p {
    margin: 0;
  }

  button {
    cursor: pointer;
    border: 0;
  }

  /* ==========================================================================
     02. SIDRAM OCH NAVIGERING
     Sidomeny, sidhuvud och innehållsyta.
     ========================================================================== */

  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: 275px;
    padding: 30px 18px;
    background: var(--green);
    color: white;
    display: flex;
    flex-direction: column;
  }

  .event {
    padding: 0 12px 25px;
    margin-bottom: 20px;
    border-bottom: 1px solid #ffffff29;
  }

  .event strong {
    display: block;
    font: 27px Georgia, serif;
  }

  .event span {
    display: block;
    color: #bdcfc2;
    font-size: 11px;
    margin-top: 7px;
  }

  .nav {
    display: grid;
    gap: 5px;
  }

  .nav button {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    white-space: nowrap;
    background: transparent;
    color: #d4e0d6;
    border-radius: 7px;
    text-align: left;
  }

  .nav button.active,
  .nav button:hover {
    background: #ffffff16;
    color: white;
  }

  /* Fasta kolumner: fliketiketter, siffror och informationsikoner flyttar sig aldrig. */
  .nav button[data-action="navigate"] {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 18px;
    gap: 8px;
    width: 100%;
  }

  .nav-title-wrap {
    display: grid;
    grid-template-columns: 94px 66px;
    gap: 8px;
    align-items: center;
    min-width: 0;
    white-space: nowrap;
  }

  .nav .badge {
    display: inline-flex;
    align-items: center;
    justify-content: flex-start;
    width: 66px;
    min-width: 66px;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    font-variant-numeric: tabular-nums;
    padding: 0;
    border: 0;
    background: transparent;
  }

  .nav .badge.is-empty { visibility: hidden; }

  .nav-separator {
    height: 1px;
    margin: 10px 4px 6px;
    background: #ffffff29;
  }

  .nav button[data-action="open-mobile"] {
    font-size: 13px;
  }

  .nav .menu-info-icon {
    justify-self: end;
    flex-shrink: 0;
  }

  .sidebar-bottom {
    margin-top: auto;
    padding-top: 20px;
    border-top: 1px solid #ffffff29;
  }

  .sidebar-bottom button {
    display: block;
    padding: 9px 12px;
    background: transparent;
    color: #d4e0d6;
    text-align: left;
    font-size: 12px;
  }

  .sidebar-bottom small {
    display: block;
    padding: 15px 12px 0;
    color: #9db6a5;
    font-size: 10px;
  }

  main {
    margin-left: 275px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 15px;
    min-height: 66px;
    padding: 15px 32px;
    border-bottom: 1px solid var(--line);
    background: white;
  }

  .sync {
    padding: 0;
    background: transparent;
    font-size: 11px;
    color: var(--muted);
  }

  .sync::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 7px;
    border-radius: 50%;
    background: var(--gold);
  }

  .sync.connected::before {
    background: var(--green2);
  }

  .content {
    max-width: 1800px;
    margin: auto;
    padding: 30px 32px 45px;
  }

  .mobilebrand {
    display: none;
  }

  .mobilebrand strong {
    display: block;
    font-weight: 400;
  }

  .mobilebrand .event-dates {
    display: block;
    margin-top: 7px;
    color: #bdcfc2;
    font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  @media (max-width:1200px) {
    /* Samma menymått på alla skrivbordsbredder: ingen hoptryckning vid flikbyte. */
    .sidebar {
      width: 275px;
    }

    main {
      margin-left: 275px;
    }

    .content {
      padding: 26px 24px;
    }

    .topbar {
      padding: 15px 24px;
    }
  }
  @media (max-width:760px) {
    .sidebar {
      position: static;
      width: auto;
      display: block;
      padding: 16px 18px;
    }

    .event,
    .sidebar-bottom {
      display: none;
    }

    .mobilebrand {
      display: block;
      font: 24px Georgia, serif;
      margin-bottom: 13px;
    }

    .nav {
      display: flex;
      gap: 4px;
      overflow: auto;
    }

    .nav button {
      white-space: nowrap;
      padding: 8px 9px;
      font-size: 11px;
    }

    .nav .badge {
      display: none;
    }

    .nav-separator,
    .nav button[data-action="open-mobile"] {
      display: none;
    }

    main {
      margin: 0;
    }

    .topbar {
      padding: 12px 18px;
      min-height: 48px;
    }

    .sync {
      font-size: 9px;
    }

    .content {
      padding: 25px 17px;
    }

    .sidebar-bottom {
      display: block;
      padding-top: 8px;
      border: 0;
    }

    .sidebar-bottom small {
      display: none;
    }
  }

  /* ==========================================================================
     03. GEMENSAMMA KONTROLLER
     Knappar, filter, sortering, årsval och statusmeddelanden.
     ========================================================================== */

  h1 {
    margin: 0;
  }

  .pagehead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;
  }

  h1 {
    font: 36px/1.15 Georgia, serif;
    letter-spacing: -.5px;
  }

  .subtitle {
    margin-top: 9px;
    color: var(--muted);
    font-size: 12px;
  }

  .actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 13px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: white;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }

  .btn:hover {
    background: #eff3e9;
  }

  .btn.primary {
    background: var(--green2);
    border-color: var(--green2);
    color: white;
  }

  .btn.primary:hover {
    background: var(--green);
  }

  .btn.small {
    padding: 6px 9px;
    font-size: 11px;
  }

  .btn.danger {
    color: var(--red);
  }

  .notice {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 22px;
    padding: 11px 14px;
    border: 1px solid #dfe3d2;
    border-radius: 8px;
    background: #efefe5;
    color: #68715f;
    font-size: 11px;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 15px;
  }

  .daytabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 4px;
    border-radius: 9px;
    background: #e9ede3;
  }

  .daytabs button {
    padding: 9px 14px;
    border-radius: 6px;
    text-align: left;
    font-size: 12px;
    background: var(--day-bg);
    color: var(--day-ink);
  }

  .daytabs button small {
    display: block;
    font-size: 10px;
    margin-top: 2px;
    color: inherit;
  }

  .daytabs button.active {
    box-shadow: inset 0 0 0 2px var(--day-ink);
    font-weight: 650;
  }

  .sortinfo {
    color: var(--muted);
    font-size: 11px;
  }

  .filters {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }

  .filters input[type=search] {
    flex: 1;
    min-width: 180px;
  }

  #activitySearch,
  #staffingSearch,
  #peopleSearch,
  #placesSearch {
    flex: 0 0 calc((100% - 32px)/3);
    min-width: 0;
  }

  .filters input,
  .filters select {
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: white;
    font-size: 12px;
  }

  .filters select {
    max-width: 250px;
  }

  .checklabel {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--muted);
  }

  input[type=checkbox],
  input[type=radio] {
    accent-color: var(--green2);
  }

  .push-left {
    margin-right: auto;
  }

  .hint {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.6;
  }

  .remove {
    display: grid;
    place-items: center;
    width: 25px;
    height: 25px;
    padding: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--muted);
    font-size: 21px;
  }

  .remove:hover {
    background: #eee;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%);
    max-width: 90vw;
    padding: 12px 20px;
    background: var(--green);
    color: white;
    border-radius: 8px;
    box-shadow: 0 6px 30px #173d3529;
    z-index: 100;
    font-size: 12px;
  }

  .note {
    white-space: pre-line;
    overflow-wrap: anywhere;
  }

  @media (max-width:1100px) {
    #activitySearch,
    #staffingSearch,
    #peopleSearch,
    #placesSearch {
      flex-basis: calc((100% - 16px)/2);
    }
  }
  @media (max-width:760px) {
    .pagehead {
      align-items: flex-start;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 31px;
    }

    .daytabs {
      width: 100%;
    }

    .daytabs button {
      flex: 1;
      padding: 8px 6px;
      font-size: 11px;
    }

    .daytabs button small {
      font-size: 9px;
    }

    .sortinfo {
      margin-left: auto;
      font-size: 10px;
    }

    #activitySearch,
    #staffingSearch,
    #peopleSearch,
    #placesSearch {
      flex-basis: 100%;
    }
  }
  .activity-tools {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .activity-tools #activitySearch,
  .activity-tools #staffingSearch {
    flex: 1 1 230px;
    max-width: 360px;
  }

  .day-filter {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 5px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #f3f6ef;
  }

  .day-filter button {
    border: 0;
    border-radius: 6px;
    background: transparent;
    padding: 7px 11px;
    font: inherit;
    font-size: 12px;
    color: var(--ink);
    cursor: pointer;
  }

  .day-filter button[aria-pressed=true] {
    background: var(--green);
    color: white;
  }

  .day-filter button:focus-visible,
  .sort-control select:focus-visible {
    outline: 2px solid var(--green2);
    outline-offset: 2px;
  }

  .sort-control {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }

  .sort-control select {
    min-height: 38px;
    padding: 8px 30px 8px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: white;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
  }

  @media (max-width:650px) {
    .activity-tools #activitySearch,
    .activity-tools #staffingSearch {
      flex-basis: 100%;
      max-width: none;
    }
  }
  .activity-tools:has(#activitySearch) > .sort-control {
    margin-left: auto;
  }

  .activity-view-slot {
    display: flex;
    align-items: center;
    min-height: 38px;
  }

  .activity-view-choice {
    flex-wrap: nowrap;
    white-space: nowrap;
  }

  .activity-tools:has(#staffingSearch) > .sort-control {
    margin-left: auto;
  }

  .activity-view-choice button:disabled {
    cursor: not-allowed;
    opacity: .48;
  }

  .filters:has(#activitySearch),
  .filters:has(#staffingSearch),
  .filters:has(#peopleSearch),
  .filters:has(#placesSearch) {
    min-height: 42px;
    align-items: center;
  }

  .planning-year-control {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }

  .planning-year-control select {
    min-height: 38px;
    padding: 7px 28px 7px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: white;
    color: var(--ink);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  .planning-year-control select:focus-visible {
    outline: 2px solid var(--green2);
    outline-offset: 2px;
  }

  /* ==========================================================================
     04. GEMENSAMMA KORT OCH TABELLER
     Delade kortdelar, tomma vyer och tabeller.
     ========================================================================== */

  .card-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: start;
    gap: 12px;
  }

  .card-title {
    min-width: 0;
  }

  .card-head .edit {
    margin: 0;
    align-self: start;
  }

  .empty {
    padding: 35px 20px;
    border: 1px dashed #ccd7c5;
    border-radius: 10px;
    background: white;
    text-align: center;
    color: var(--muted);
    grid-column: 1/-1;
  }

  .empty h3 {
    color: var(--ink);
    font-size: 17px;
    margin-bottom: 8px;
  }

  .empty p {
    font-size: 12px;
    margin-bottom: 15px;
  }

  .table-wrap {
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: white;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  th {
    padding: 12px 15px;
    background: #eef2e7;
    color: var(--muted);
    font-size: 10px;
    white-space: nowrap;
  }

  td {
    padding: 14px 15px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    vertical-align: top;
  }

  td small {
    display: block;
    color: var(--muted);
    font-size: 10px;
    margin-top: 4px;
  }

  td.phone {
    min-width: 145px;
  }

  td .workingtime {
    white-space: nowrap;
  }

  td a {
    text-decoration: none;
  }

  td a:hover {
    text-decoration: underline;
  }

  .muted {
    color: var(--muted);
  }

  /* ==========================================================================
     05. AKTIVITETER
     Aktivitetskort, dagar och sammanfattningar.
     ========================================================================== */

  .activity-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    align-items: stretch;
  }

  .activity-card {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 19px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: white;
  }

  .activity-card h2 {
    font-size: 16px;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }

  .activity-place {
    color: var(--green2);
    font-size: 12px;
    margin-top: 5px;
  }

  .activity-description {
    margin: 15px 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.65;
    white-space: pre-line;
    overflow-wrap: anywhere;
  }

  .periods {
    display: grid;
    gap: 7px;
    margin-top: auto;
    padding-top: 12px;
  }

  .periods-heading {
    color: var(--green2);
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .period-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--green2);
    color: white;
    font-size: 10px;
    font-weight: 700;
  }

  .period {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    padding: 8px 9px;
    border: 1px solid #e0e5d8;
    border-radius: 6px;
    background: #f4f6ef;
    font-size: 10px;
  }

  .period .weekday {
    min-width: 43px;
    color: var(--green2);
    font-weight: 600;
  }

  .period .need {
    padding-left: 8px;
    border-left: 1px solid #d6ddcd;
    color: var(--muted);
  }

  .period.day-tone-0,
  .period.day-tone-1,
  .period.day-tone-2 {
    background: var(--day-bg);
    color: var(--day-ink);
    border-color: var(--day-line);
  }

  @media (max-width:1100px) {
    .activity-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  @media (max-width:760px) {
    .activity-grid {
      grid-template-columns: minmax(0, 1fr);
    }

    .activity-card {
      padding: 17px;
    }
  }
  .activity-card[data-open-activity] {
    cursor: pointer;
    transition: border-color .18s, box-shadow .18s, transform .18s;
  }

  .activity-card[data-open-activity]:hover,
  .activity-card[data-open-activity]:focus-visible {
    border-color: var(--green2);
    box-shadow: 0 0 0 1px var(--green2), 0 10px 24px #173d3530;
    transform: translateY(-3px);
  }

  .activity-card[data-open-activity] .activity-description {
    margin: 10px 0;
  }

  .activity-day-summary {
    font-size: 12px;
    font-weight: 600;
    color: var(--green2);
  }

  .activity-title-button {
    padding: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
  }

  .activity-title-button:hover {
    color: var(--green2);
  }

  .activity-days {
    display: grid;
    gap: 10px;
    margin-top: 15px;
  }

  .activity-day {
    border: 1px solid var(--day-line);
    border-radius: 8px;
    padding: 10px;
    background: var(--day-bg);
  }

  .activity-day h3 {
    font-size: 13px;
    margin: 0 0 9px;
    color: var(--day-ink);
  }

  .activity-day h3 small {
    font-size: 10px;
    font-weight: 400;
    margin-left: 4px;
  }

  .activity-day .periods {
    margin: 0;
  }

  .activity-day .period {
    padding: 7px 0;
    background: transparent;
  }

  .pattern-information {
    border-left: 3px solid var(--green2);
    background: #f2f6ed;
    border-radius: 0 6px 6px 0;
    padding: 11px 13px;
    margin-top: 16px;
    font-size: 11px;
    line-height: 1.6;
  }

  .pattern-information strong {
    font-weight: 600;
  }

  .pattern-information p {
    margin: 5px 0 0;
    color: var(--muted);
  }

  .pattern-information small {
    display: block;
    margin-top: 5px;
    color: var(--muted);
  }

  .pattern-person-label {
    display: block;
    color: var(--green);
    font-weight: 600;
    font-size: 11px;
    margin: 0 0 7px;
  }

  .activity-day .period {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 10px;
  }

  .activity-day .period .pattern-person-label {
    grid-column: 1/-1;
    margin: 0;
  }

  #activityResults>.activity-grid {
    grid-auto-rows: auto;
    align-items: start;
  }

  .activity-card[data-open-activity] {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    height: 148px;
    min-height: 148px;
    max-height: 148px;
    align-self: start;
    padding: 12px 14px;
    border: 1px solid var(--line);
    overflow: hidden;
  }

const selectablePlanningYears = () => { let year=calendarYear(); while (isEditionLocked(year)) year++; return [year,year+1,year+2]; };

const DAYS = ["Fredag","Lördag","Söndag"];

const hours = value => {
  const minutes=Math.max(0,Math.round(value)),h=Math.floor(minutes/60),m=minutes%60;
  return [h?`${h} ${h===1?"timme":"timmar"}`:"",m?`${m} ${m===1?"minut":"minuter"}`:""].filter(Boolean).join(" och ") || "0 minuter";
};

function formatPhone(value) {
  const input=String(value || "").trim();
  const withoutHours=input.replace(/\s*\(([^()]*)\)/g,(match,note,offset) => {
    const followsNumber=/\d/.test(input.slice(0,offset));

function openClockPicker(input) {
  if (input.disabled) return;
  const control=input.closest(".clock-control"),trigger=control.querySelector(".clock-trigger");
  closeClockPicker();
  const choices=input._timeChoices || CLOCK_CHOICES;
  if (!choices.length) return;
  // Nya pauser ska inte få en förvald timme eller minut i tidsväljaren.
  const emptyPause=!input.value && input.matches(".pause-start,.pause-end");
  const wanted=input.value || choices[0];
  const selected=choices.includes(wanted)?wanted:choices.reduce((best,value) =>
    Math.abs(minute(value)-minute(wanted))<Math.abs(minute(best)-minute(wanted))?value:best);
  const [hour,minutes]=emptyPause?["",""]:selected.split(":");
  const panel=document.createElement("div");
  panel.id="clockTimepicker";
  panel.className="timepicker-popup tw-rounded-xl tw-border tw-border-solid tw-border-slate-200 tw-bg-white tw-p-3 tw-text-slate-700 tw-shadow-xl";
  panel.setAttribute("role","dialog");
  panel.setAttribute("aria-label","Välj tid: "+control.dataset.clockLabel);
  panel.setAttribute("popover","manual");
  panel.innerHTML=`<div class="tw-flex tw-items-start tw-justify-between tw-gap-3 tw-pb-3">
      <div><p class="tw-text-sm tw-font-semibold tw-text-slate-900">Välj tid</p>
        <p class="tw-mt-0.5 tw-text-xs tw-text-slate-500">${esc(control.dataset.clockLabel)}</p></div>
      <button type="button" class="closebtn" data-clock-cancel aria-label="Stäng tidsväljaren"><svg class="close-icon" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5 15 15M15 5 5 15"/></svg></button>
    </div>
    <div class="tw-grid tw-grid-cols-2 tw-gap-3">
      <div><p class="tw-mb-2 tw-text-center tw-text-xs tw-font-medium tw-text-slate-500">Timmar</p>
        <div class="timepicker-list tw-max-h-48 tw-overflow-y-auto tw-overscroll-contain tw-rounded-lg tw-border tw-border-solid tw-border-slate-200 tw-p-1" role="listbox" aria-label="Timmar" data-clock-list="hour"></div></div>
      <div><p class="tw-mb-2 tw-text-center tw-text-xs tw-font-medium tw-text-slate-500">Minuter</p>
        <div class="timepicker-list tw-max-h-48 tw-overflow-y-auto tw-overscroll-contain tw-rounded-lg tw-border tw-border-solid tw-border-slate-200 tw-p-1" role="listbox" aria-label="Minuter" data-clock-list="minute"></div></div>
    </div>
    <div class="tw-mt-3 tw-flex tw-justify-end tw-gap-2 tw-border-0 tw-border-t tw-border-solid tw-border-slate-100 tw-pt-3">
      <button type="button" data-clock-cancel class="tw-rounded-lg tw-bg-white tw-px-3 tw-py-2 tw-text-xs tw-font-medium tw-text-slate-500 hover:tw-bg-slate-100 focus-visible:tw-outline-none focus-visible:tw-ring-2 focus-visible:tw-ring-brand">Avbryt</button>
      <button type="button" data-clock-apply class="tw-rounded-lg tw-bg-brand tw-px-4 tw-py-2 tw-text-xs tw-font-semibold tw-text-white hover:tw-bg-brand-dark focus-visible:tw-outline-none focus-visible:tw-ring-2 focus-visible:tw-ring-brand focus-visible:tw-ring-offset-2 disabled:tw-opacity-50">Välj tid</button>
    </div>`;
  modal.append(panel);
  activeClock={input,trigger,panel,draft:{hour,minute:minutes}};
  trigger.setAttribute("aria-expanded","true");
  trigger.setAttribute("aria-controls",panel.id);
  if (typeof panel.showPopover==="function") panel.showPopover();
  renderClockChoices("hour");
  positionClockPicker();
  panel.addEventListener("click",event => {
    if (event.target.closest("[data-clock-cancel]")) { closeClockPicker(true); return; }
    if (event.target.closest("[data-clock-apply]")) {
      const value=activeClock.draft.hour+":"+activeClock.draft.minute;
      if (!choices.includes(value)) return;
      const changed=input.value!==value;
      input.value=value;
      refreshClockDisplay(input);
      closeClockPicker(true);
      if (changed) input.dispatchEvent(new Event("change",{bubbles:true}));
      return;
    }
    const option=event.target.closest("[data-clock-part]");
    if (!option || option.disabled) return;
    const {draft}=activeClock,part=option.dataset.clockPart;
    draft[part]=option.dataset.value;
    if (part==="hour") {
      const available=choices.filter(value => value.startsWith(draft.hour+":"));
      const wanted=draft.hour+":"+draft.minute;
      if (draft.minute && !available.includes(wanted)) draft.minute=available.reduce((best,value) =>
        Math.abs(minute(value)-minute(wanted))<Math.abs(minute(best)-minute(wanted))?value:best).slice(3);
    }
    renderClockChoices(part);
  });
  panel.addEventListener("keydown",event => {
    const option=event.target.closest("[data-clock-part]");
    if (!option || !["ArrowUp","ArrowDown","Home","End","ArrowLeft","ArrowRight"].includes(event.key)) return;
    event.preventDefault();
    const part=option.dataset.clockPart;
    if (event.key==="ArrowLeft" || event.key==="ArrowRight") {
      panel.querySelector(`[data-clock-list="${part==="hour"?"minute":"hour"}"] [aria-selected="true"]`)?.focus();
      return;
    }
    const options=[...panel.querySelectorAll(`[data-clock-list="${part}"] [role="option"]:not(:disabled)`)];
    const index=options.indexOf(option),next=event.key==="Home"?0:event.key==="End"?options.length-1:
      Math.max(0,Math.min(options.length-1,index+(event.key==="ArrowDown"?1:-1)));
    options[next].click();
  });
}

document.addEventListener("pointerdown",event => {
  if (activeClock && !activeClock.panel.contains(event.target) &&
      !activeClock.trigger.contains(event.target)) closeClockPicker();
},true);
document.addEventListener("focusin",event => {
  if (activeClock && event.target!==modal && !activeClock.panel.contains(event.target) &&
      !activeClock.trigger.contains(event.target)) closeClockPicker();
});
document.addEventListener("keydown",event => {
  if (event.key==="Enter" && activeClock) {
    event.preventDefault();event.stopImmediatePropagation();
    activeClock.panel.querySelector("[data-clock-apply]").click();
    return;
  }
  if (event.key==="Escape" && activeClock) {
    event.preventDefault();
    event.stopImmediatePropagation();
    closeClockPicker(true);
  }
},true);

},true);

function bindPassTimeRow(row,startSelector,endSelector,{choices=CLOCK_CHOICES}={}) {
  if (row._syncEndTime) { row._syncEndTime(); return; }
  const start=row.querySelector(startSelector),end=row.querySelector(endSelector);
  start._timeChoices=choices.slice(0,-1);
  row._syncEndTime=() => {
    const hasStart=/^([01]\d|2[0-3]):[0-5]\d$/.test(start.value);
    end._timeChoices=hasStart?choices.filter(value => value>start.value):choices.slice(1);
    if (hasStart && end.value && end.value<=start.value) {
      end.value="";
      refreshClockDisplay(end);
    }
    setClockDisabled(end,start.disabled || !end._timeChoices.length);
  };
  start.addEventListener("change",row._syncEndTime);
  row._syncEndTime();
}

function validRange(range) {
  const valid = v => typeof v === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(v);
  return range && valid(range.start) && valid(range.end) && range.start < range.end;
}

function eventDates(year) {
  const date = new Date(Date.UTC(year,11,24));
  date.setUTCDate(date.getUTCDate()-date.getUTCDay()-21);
  return [-2,-1,0].map(offset => {
    const d = new Date(date);
    d.setUTCDate(d.getUTCDate()+offset);
    return d.toISOString().slice(0,10);
  });
}

function dateLabel(day) {

// Ett platsregisterfält kan innehålla en Maps-länk, GPS-koordinater eller
// vanlig platstext. Sparat värde är alltid en säker HTTPS-länk till Google Maps.
function normalizeGoogleMapsLink(input) {
  const raw=String(input ?? "").trim();
  if (!raw) return "";
  const query=location=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(location);
  const coordinates=raw.match(/^([+-]?(?:\d+(?:\.\d+)?|\.\d+))\s*[,;]\s*([+-]?(?:\d+(?:\.\d+)?|\.\d+))$/);
  if (coordinates) {
    const lat=Number(coordinates[1]),lng=Number(coordinates[2]);
    if (Math.abs(lat)<=90 && Math.abs(lng)<=180) return query(lat+","+lng);
  }
  // Acceptera även en inklistrad Google Maps-adress utan https://.
  const candidate=/^(?:maps\.app\.goo\.gl|goo\.gl\/maps|(?:www\.|maps\.)?google\.[a-z.]+)\//i.test(raw)
    ? "https://"+raw : raw;
  try {
    const parsed=new URL(candidate);
    const host=parsed.hostname.toLowerCase();
    const isGoogleHost=/^(?:[a-z0-9-]+\.)*google\.(?:com(?:\.[a-z]{2})?|[a-z]{2,3}(?:\.[a-z]{2})?)$/.test(host);
    const isGoogleMaps=(isGoogleHost && (host.startsWith("maps.") || parsed.pathname.startsWith("/maps")))
      || host==="maps.app.goo.gl" || (host==="goo.gl" && parsed.pathname.startsWith("/maps"));
    if (["http:","https:"].includes(parsed.protocol) && isGoogleMaps) {
      parsed.protocol="https:";
      return parsed.href;
    }
    // Vanliga externa kartadresser med koordinatparametrar fungerar också.
    if (["http:","https:"].includes(parsed.protocol)) {
      const point=parsed.searchParams.get("ll") || parsed.searchParams.get("center")
        || parsed.searchParams.get("q") || parsed.searchParams.get("query");
      if (point) return normalizeGoogleMapsLink(point);
      const match=parsed.href.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
      if (match) return normalizeGoogleMapsLink(match[1]+","+match[2]);
    }
  } catch { /* Fri adress eller platsnamn fungerar som Google Maps-sökning. */ }
  return query(raw);
}

const HISTORICAL_EDITIONS = {};


/* Årsbanker i formatet days/passes (t.ex. Entrékassor 2025) görs om till appens eget format vid inläsning. */
function normalizeHistoricalEditions() {
  const mins = t => {
    const [h, m] = t.split(":").map(Number);
    return h * 60 + m;
  };

  const hhmm = n =>
    String(Math.floor(n / 60)).padStart(2, "0") + ":" +
    String(n % 60).padStart(2, "0");

  for (const [year, edition] of Object.entries(HISTORICAL_EDITIONS)) {
    edition.activities = edition.activities.map(a => {
      const out = {...a, sourceYear: a.sourceYear ?? Number(year)};

      if (typeof out.place === "string") {
        out.place = {name: out.place};
      }

      if (!a.days) return out;

      const requirements = [];
      const shifts = [];
      const participants = new Map();

      const addP = (id, label) => {
        if (!participants.has(id)) {
          participants.set(id, {id, label});
        }
      };

      let reqN = 0;

      for (const d of a.days) {
        const passes = (d.passes || []).map((x, i) => {
          const [start, end] = x.time.split("-");
          const pauseTimes = x.pauses || (x.pause ? [x.pause] : []);

          const pauses = pauseTimes.map(pause => {
            const [start, end] = pause.split("-");
            return {start, end};
          });

          return {i: i + 1, start, end, pauses};
        });

        if (!passes.length) continue;

        const points = [
          ...new Set(passes.flatMap(p => [mins(p.start), mins(p.end)]))
        ].sort((x, y) => x - y);

        const pieces = [];

        for (let k = 0; k < points.length - 1; k++) {
          const n = passes.filter(p =>
            mins(p.start) <= points[k] &&
            mins(p.end) >= points[k + 1]
          ).length;

          if (!n) continue;

          const last = pieces[pieces.length - 1];

          if (last && last.end === points[k] && last.count === n) {
            last.end = points[k + 1];
          } else {
            pieces.push({
              start: points[k],
              end: points[k + 1],
              count: n
            });
          }
        }

        const reqs = pieces.map(pc => ({
          id: a.id + "-req-" + (++reqN),
          day: d.day,
          start: hhmm(pc.start),
          end: hhmm(pc.end),
          count: pc.count
        }));

        requirements.push(...reqs);

        const reqAt = t =>
          reqs.find(r => r.start <= t && r.end > t) || reqs[0];

        for (const p of passes) {
          const pid = a.id + "-pt-" + p.i;
          const sid = a.id + "-d" + d.day + "-p" + p.i;

          addP(pid, "Pass " + p.i);

          shifts.push({
            id: sid,
            participantId: pid,
            requirementId: reqAt(p.start).id,
            day: d.day,
            start: p.start,
            end: p.end,
            kind: "ordinary",
            breaks: p.pauses.map((pause, index) => ({
              id: sid + "-r" + (index + 1),
              start: pause.start,
              end: pause.end
            }))
          });
        }

        const periods = (d.relief || [])
          .flatMap(r => {
            const pass = passes.find(p => p.i === r.pass);
            if (!pass) return [];

            return pass.pauses.map((pause, index) => ({
              breakId:
                a.id + "-d" + d.day + "-p" + pass.i + "-r" + (index + 1),
              participantId: a.id + "-pt-" + pass.i,
              start: pause.start,
              end: pause.end
            }));
          })
          .sort((x, y) => x.start.localeCompare(y.start));

		if (periods.length) {
		const groups = [];
		
		for (const period of periods) {
			const last = groups[groups.length - 1];
		
			if (last && period.start === last.end) {
			// Direkt efterföljande avlösningar bildar ett pass.
			last.end = period.end;
			last.periods.push(period);
			} else {
			// En lucka innebär ett nytt avlösningspass.
			groups.push({
				start: period.start,
				end: period.end,
				periods: [period]
			});
			}
		}
		
		groups.forEach((group, index) => {
			const number = index + 1;
			const participantId = a.id + "-d" + d.day + "-pt-r" + number;
		
			addP(participantId, "Avlösning " + number);
		
			shifts.push({
			id: a.id + "-d" + d.day + "-rel" + number,
			participantId,
			requirementId: reqAt(group.start).id,
			day: d.day,
			start: group.start,
			end: group.end,
			kind: "relief",
			breaks: [],
			reliefPeriods: group.periods
			});
		});
		}
      }

      const notes = a.notes || "";
      const dayNotes = {};
      for (const day of a.days) {
        if (day.notes) dayNotes[day.day] = [dayNotes[day.day],day.notes].filter(Boolean).join("\n\n");
      }

      delete out.days;

      return {
        ...out,
        notes,
        dayNotes,
        requirements,
        staffingPattern: {
          schemaVersion: 1,
          layout: "linked-shifts",
          participants: [...participants.values()],
          shifts
        },
        historicalStaffing: []
      };
    });
  }
}

normalizeHistoricalEditions();

// Tillgängliga tidigare årsplaner fylls när historikvyn öppnas.
const PLAN_EDITIONS={};
/* ---------- Upplagornas kalender: första advent, julstök och post-måndag ---------- */
// Första advent = söndagen mellan 27 november och 3 december.
function firstAdventDate(year) {
  const d=new Date(Date.UTC(year,10,27));
  d.setUTCDate(27+((7-d.getUTCDay())%7));
  return d;
}
const isoDate = d => d.toISOString().slice(0,10);
// Julstöket är fredag–söndag (första advent och de två föregående dagarna).
function julstokDates(year) {
  const sunday=firstAdventDate(year),day=n=>{const d=new Date(sunday);d.setUTCDate(d.getUTCDate()+n);return isoDate(d);};
  return {start:day(-2),end:day(0),postMonday:day(1)};
}
const todayStockholm = () => new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Stockholm",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
// En upplaga är genomförd och låst från och med post-måndagen.
const isEditionLocked = (year,today=todayStockholm()) => today>=julstokDates(year).postMonday;
// Källor för import: de tre senaste låsta upplagorna, tidigast 2025.
function lockedHistoryYears(today=todayStockholm()) {
  const years=[];
  for (let year=2025;year<=Number(today.slice(0,4));year++) if (isEditionLocked(year,today)) years.push(year);
  return years.slice(-3);
}
function historicalYears() {
  return lockedHistoryYears()
    .filter(year=>year<plan.year && historicalEdition(year).activities.length>0);
}
function historicalEdition(year) {
  return HISTORICAL_EDITIONS[String(year)] || PLAN_EDITIONS[String(year)] || {schemaVersion:1,year,coverage:"not-loaded",activities:[]};
}
function editionFromPlan(data,year) {
  if (!data || data.year!==year || !Array.isArray(data.activities) || !Array.isArray(data.places)) return null;
  const activities=data.activities.filter(a=>a && typeof a.id==="string" && typeof a.title==="string" && Array.isArray(a.requirements) && a.requirements.length).map(activity=>{
    const place=activity.placeId===null?"Allmänt":data.places.find(p=>p.id===activity.placeId)?.name;
    if (!place) throw Error(`Platsen för ${activity.title} i ${year} kunde inte hittas.`);
    return {...clone(activity),sourceYear:year,sourceKind:activity.sourceKind || "historical",type:activity.type || "event",version:activity.version || 1,
      activityKey:activity.activityKey || activity.id,place:{name:place},notes:activity.notes || "",dayNotes:clone(activity.dayNotes || {}),
      staffingPattern:clone(activity.staffingPattern || {schemaVersion:1,layout:"linked-shifts",participants:[],shifts:[]}),historicalStaffing:clone((data.assignments || []).filter(shift=>shift.activityId===activity.id).map(shift=>{
        const person=(data.people || []).find(person=>person.id===shift.personId);
        return {...shift,personDirectoryId:person?.directoryId || person?.id || ""};
      }))};
  });
  return {schemaVersion:1,year,coverage:"plan",activities};
}
async function refreshHistoricalSources() {
  if (!cloud) throw Error("Logga in för att hämta tidigare årsplaner.");
  for (const key of Object.keys(PLAN_EDITIONS)) delete PLAN_EDITIONS[key];
  const active=cloud,year=plan.year;
  const years=lockedHistoryYears().filter(value=>value<year && !HISTORICAL_EDITIONS[String(value)]);
  const snapshots=await Promise.all(years.map(value=>active.fs.getDoc(active.fs.doc(active.db,"julstokPlans",String(value)))));
  if (cloud!==active || plan.year!==year) throw Error("Planeringsåret har ändrats. Öppna importen igen.");
  years.forEach((value,index)=>{
    if (snapshots[index].exists()) {
      const edition=editionFromPlan(snapshots[index].data(),value);
      if (edition) PLAN_EDITIONS[String(value)]=edition;
    }
  });
}

function alreadyImported(source, data = plan) {
  return data.activities.some(a => 
    a.origin?.year === source.sourceYear && a.origin?.activityId === source.id
  );
}

function availableHistoricalActivities(year) {
  return historicalEdition(year).activities.filter(a => !alreadyImported(a));
}

function numberWord(number) {
  return ["noll","en","två","tre","fyra","fem","sex","sju","åtta","nio","tio","elva","tolv"][number] || String(number);
}

function patternDayPeople(activity,day) {
  const pattern=activity?.staffingPattern;
  if (!pattern) return [];
  const people=pattern.participants.filter(person => pattern.shifts.some(shift => shift.day===day && shift.participantId===person.id))
    .map(person => ({participantId:person.id,role:pattern.shifts.filter(shift => shift.day===day && shift.participantId===person.id)
      .every(shift => shift.kind==="relief")?"relief":"ordinary"}));
  const relievers=people.filter(person => person.role==="relief").length;
  let ordinary=0,relief=0;
  return people.map(person => {
    const number=person.role==="relief"?++relief:++ordinary;
    return {...person,label:person.role==="relief"?(relievers===1?"Avlösning":"Avlösning "+number):"Pass "+number};
  });
}

const PERSON_COLORS=["#2a7f4f","#d0661b","#7b4bb3","#c2386b","#8b5e3c","#4d5a6b"],RELIEF_COLOR="#2a6bb0";
function personColor(label) {
  if (/^Avlösning/i.test(label || "")) return RELIEF_COLOR;
  const number=Number((String(label || "").match(/^Pass (\d+)/) || [])[1]);
  return number?PERSON_COLORS[(number-1)%PERSON_COLORS.length]:"";
}

function patternPersonLabel(activity,day,participantId) {
  return patternDayPeople(activity,day).find(person => person.participantId===participantId)?.label || "Pass";
}

function dailyStaffingCounts(activity) {
  if (!activity) return [];
  const days=[...new Set((activity.staffingPattern?.shifts.length?activity.staffingPattern.shifts:activity.requirements || []).map(item => item.day))].sort();
  return days.map(day => {
    const people=patternDayPeople(activity,day);
    const ordinary=people.length?people.filter(person => person.role==="ordinary").length:
      Math.max(0,...(activity.requirements || []).filter(range => range.day===day).map(range => range.count));
    const relief=people.filter(person => person.role==="relief").length;
    return {day,ordinary,relief,total:ordinary+relief};
  });
}

function dailyStaffingDescription(activity) {
  const days=dailyStaffingCounts(activity);
  if (!days.length) return "";
  const parts=days.map(day => `${day.total} pass ${DAYS[day.day].toLocaleLowerCase("sv-SE")}`);
  return (parts.length===1?parts[0]:parts.length===2?parts.join(" och "):parts.slice(0,-1).join(", ")+" och "+parts.at(-1))+".";
}

function dailyStaffingSentence(activity) {
  const description=dailyStaffingDescription(activity);
  return description?"Normalt "+description:"";
}

function activityDialogSubtitle(activity) {
  const days=dailyStaffingCounts(activity).map(({day}) => DAYS[day].toLocaleLowerCase("sv-SE"));
  const dayList=days.length>1?days.slice(0,-1).join(", ")+" och "+days[days.length-1]:days[0];
  const daySummary=dayList?"Gäller normalt "+dayList:"";
  const first=[activity?.title || "Ny aktivitet",placeName(activity?.placeId ?? null),daySummary].filter(Boolean).join(" · ");
  const staffing=dailyStaffingSentence(activity);
  return staffing?first+"\n"+staffing:first;
}

function normalizePatternNumbers(activity) {
  const pattern=activity.staffingPattern;
  for (const person of pattern?.participants || []) {
    const source=pattern.shifts.find(shift => shift.participantId===person.id);
    if (source) person.label=patternPersonLabel(activity,source.day,person.id);
  }
  activity.recommendedPeoplePerDay=Math.max(0,...dailyStaffingCounts(activity).map(day => day.total));
  delete activity.recommendedDistinctPeople;
}

function patternTimelineRows(activity) {
  const pattern=activity.staffingPattern,rows=[];
  if (!pattern) return rows;
  for (const shift of pattern.shifts) {
    // Ofärdiga arbetstider ska inte hindra övriga pass från att ritas.
    if (!validRange(shift)) continue;
    const people=patternDayPeople(activity,shift.day),index=people.findIndex(person => person.participantId===shift.participantId);
    const base={shiftId:shift.id,participantId:shift.participantId,personNumber:index+1,
      personLabel:people[index]?.label || "Pass",day:shift.day};
    let cursor=shift.start,previous="start",workNumber=0;
    const pauses=[...shift.breaks].sort((a,b) => a.start.localeCompare(b.start));
    const addWork=(end,next) => {
      if (cursor>=end) return;
      workNumber++;
      rows.push({...base,id:shift.id+":work:"+previous+":"+next,start:cursor,end,
        kind:shift.kind==="relief"?"relief":"work",event:shift.kind==="relief"?"Avlösning":"Arbete"});
    };
    for (const pause of pauses) {
      addWork(pause.start,pause.id);
      rows.push({...base,id:shift.id+":pause:"+pause.id,start:pause.start,end:pause.end,
        kind:"pause",event:"Paus",breakId:pause.id});
      cursor=pause.end;previous=pause.id;
    }
    addWork(shift.end,"end");
  }
  return rows.sort((a,b) => a.day-b.day || a.start.localeCompare(b.start) || a.end.localeCompare(b.end) || a.personNumber-b.personNumber);
}

function patternInformation(activity,full=false,showTimeline=true) {
  if (!activity?.staffingPattern) return "";
  return `<div class="pattern-information"><strong>${esc(dailyStaffingSentence(activity))}</strong>
    ${full?'<p>Passnumreringen börjar om varje dag. Du väljer medarbetare för varje pass under Bemanning. Två direkt efterföljande pass inom samma aktivitet måste bemannas av olika medarbetare.</p>':""}
    ${full && showTimeline && activity.staffingPattern.layout==="linked-shifts"?`<details><summary>Visa tider, pauser och avlösning</summary>${patternDayTimelines(activity)}</details>`:""}
    ${full && activity.origin?`<small>Hämtad från Julstöket ${activity.origin.year}.</small>`:""}</div>`;
}

function patternShiftTimeline(activity,shift) {
  return patternTimelineRows(activity).filter(row => row.shiftId===shift.id)
    .map(row => `${esc(row.start)}–${esc(row.end)} · ${esc(row.event)}`).join("<br>");
}

function patternDayTimelines(activity) {
  const rows=patternTimelineRows(activity),days=[...new Set(rows.map(row => row.day))];
  return `<div class="history-shift-days">${days.map(day => `<section><h4>${DAYS[day]}</h4>
    <table class="pattern-timetable"><thead><tr><th scope="col">Tid</th><th scope="col">Händelse</th><th scope="col">Person</th></tr></thead>
    <tbody>${rows.filter(row => row.day===day).map(row => `<tr data-kind="${row.kind}"><td class="timeline-time">${row.start}–${row.end}</td>
      <td>${row.event}</td><td class="timeline-person">${row.personLabel}</td></tr>`).join("")}</tbody></table></section>`).join("")}</div>`;
}


function requirementParticipantLabels(activity,range) {
  if (!activity?.staffingPattern || !range?.id) return [];
  const pattern=activity.staffingPattern;
  const ids=[...new Set(pattern.shifts.filter(s => s.day===range.day && overlaps(s,range)).map(s => s.participantId))];
  return ids.map(id => patternPersonLabel(activity,range.day,id));
}

function requirementPatternLabel(activity,range) {
  const labels=requirementParticipantLabels(activity,range);
  return labels.length?`<span class="pattern-person-label">${labels.map(esc).join(" · ")}</span>`:"";

function historicalDaySummary(activity) {
  return [...new Set(activity.requirements.map(r => r.day))].sort().map(day => {
    const ranges=activity.requirements.filter(r => r.day===day);
    return `${DAYS[day]} ${ranges.reduce((v,r) => r.start<v?r.start:v,"23:59")}–${ranges.reduce((v,r) => r.end>v?r.end:v,"00:00")}`;
  }).join(" · ");
}

// Historiska pass kan ligga omlagda i varandra (t.ex. hela dagen + delpass). Planen tillåter inga
// överlappande behovstider, så vi slår ihop dem till sammanhängande perioder med högsta personbehovet.
// Originalet bevaras oförändrat i historicalSnapshot.
function mergeOverlappingRequirements(reqs,{preserveBoundaries=false}={}) {
  const out=[];
  for (const day of [...new Set(reqs.map(r => r.day))].sort((a,b) => a-b)) {
    const rs=reqs.filter(r => r.day===day);
    const points=[...new Set(rs.flatMap(r => [minute(r.start),minute(r.end)]))].sort((a,b) => a-b);
    const segments=[];
    for (let i=0;i<points.length-1;i++) {
      const a=points[i],b=points[i+1];
      const covering=rs.filter(r => minute(r.start)<=a && minute(r.end)>=b);
      if (!covering.length) continue;
      const count=Math.max(...covering.map(r => r.count));
      const last=segments[segments.length-1];
      if (!preserveBoundaries && last && last.end===a && last.count===count) last.end=b;
      else segments.push({start:a,end:b,count});
    }
    for (const seg of segments) out.push({day,start:time(seg.start),end:time(seg.end),count:seg.count});
  }
  return out;
}

// Reservlösning när årsbanken saknar uttryckliga personpass: bevara varje
// tidsperiod. Samma bemanningsbehov betyder inte att samma person fortsätter.
// joinAdjacent används endast för att känna igen den äldre importens resultat.
function passesFromRequirements(requirements,{joinAdjacent=false}={}) {
  const participants=[],shifts=[];
  for (const day of [...new Set(requirements.map(r => r.day))].sort((a,b) => a-b)) {
    const lanes=[];let number=0;
    for (const req of requirements.filter(r => r.day===day).sort((a,b) => a.start.localeCompare(b.start))) {
      for (let slot=0;slot<req.count;slot++) {
        const open=lanes[slot];
        if (joinAdjacent && open && open.end===req.start) {open.end=req.end;continue;}
        const participant={id:uid(),label:"Pass "+(++number)};
        const shift={id:uid(),participantId:participant.id,requirementId:req.id,day,start:req.start,end:req.end,kind:"ordinary",breaks:[]};
        participants.push(participant);shifts.push(shift);lanes[slot]=shift;
      }
    }
  }
  return {participants,shifts};
}

function historicalPassSetup(source) {
  const pattern=clone(source.staffingPattern || {schemaVersion:1,layout:"linked-shifts",participants:[],shifts:[]});
  const requirements=mergeOverlappingRequirements(source.requirements,{preserveBoundaries:!pattern.shifts.length})
    .map(range => ({...range,id:uid()}));
  const ids=new Map(source.requirements.map(range => [range.id,
    requirements.find(item => item.day===range.day && item.start<=range.start && item.end>=range.end)?.id]));
  const breakIds=new Map(pattern.shifts.flatMap(shift => shift.breaks).map(pause => [pause.id,uid()]));
  pattern.shifts=pattern.shifts.map(shift => ({...shift,id:uid(),requirementId:ids.get(shift.requirementId),
    breaks:shift.breaks.map(pause => ({...pause,id:breakIds.get(pause.id)})),
    ...(shift.reliefPeriods?{reliefPeriods:shift.reliefPeriods.map(period => ({...period,breakId:breakIds.get(period.breakId)}))}:{})}));
  if (!pattern.shifts.length) Object.assign(pattern,passesFromRequirements(requirements));
  return {requirements,staffingPattern:pattern};
}

function restoreHistoricalPassBoundaries(data) {
  const rangesKey=ranges => JSON.stringify(ranges.map(({day,start,end,count}) => ({day,start,end,count}))
    .sort((a,b) => a.day-b.day || a.start.localeCompare(b.start) || a.end.localeCompare(b.end) || (a.count || 0)-(b.count || 0)));
  for (const activity of data.activities) {
    const origin=activity.origin,snapshot=activity.historicalSnapshot,pattern=activity.staffingPattern;
    if (origin?.kind!=="historical-import" || origin.passImportVersion>=2 || !snapshot?.requirements ||
        snapshot.staffingPattern?.shifts.length || !pattern?.shifts.length) continue;
    const source=historicalEdition(origin.year).activities.find(item => item.id===origin.activityId);
    if (!source) continue;
    // Återställ endast oförändrade, obemannade importer. Egna tider och valda
    // medarbetare får aldrig skrivas över av en uppdatering av årsbanken.
    if (data.assignments.some(shift => shift.activityId===activity.id) ||
        [...(activity.staffingChoices?.defaults || []),...(activity.staffingChoices?.overrides || [])].some(value => value.personId) ||
        pattern.shifts.some(shift => shift.kind!=="ordinary" || shift.breaks.length || shift.reliefPeriods?.length) ||
        new Set(pattern.shifts.map(shift => shift.participantId)).size!==pattern.shifts.length ||
        pattern.participants.length!==pattern.shifts.length) continue;
    const previous=mergeOverlappingRequirements(snapshot.requirements);
    if (rangesKey(activity.requirements)!==rangesKey(previous) ||
        rangesKey(pattern.shifts)!==rangesKey(passesFromRequirements(previous,{joinAdjacent:true}).shifts)) continue;
    Object.assign(activity,historicalPassSetup(source));
    delete activity.staffingChoices;
    origin.passImportVersion=2;
  }
}

function definedImportFields(value) {
  if (Array.isArray(value)) return value.map(item=>{
    if (item===undefined) throw Error("Importen innehåller en ofullständig lista.");
    return definedImportFields(item);
  });
  if (value && Object.getPrototypeOf(value)===Object.prototype) return Object.fromEntries(Object.entries(value)
    .filter(([,item])=>item!==undefined).map(([key,item])=>[key,definedImportFields(item)]));
  return value;
}

function buildHistoricalImport(data, source, sourceYear, importedAt = new Date().toISOString()) {
  // Försök hämta sourceYear från objektet, eller extrahera från ID:t (t.ex. "hist-2025-61" -> 2025) om det saknas
  let extractedYear = source.sourceYear;
  if (!extractedYear && source.id) {
    const match = source.id.match(/\b(20\d{2})\b/);
    if (match) extractedYear = parseInt(match[1], 10);
  }

  if (extractedYear !== sourceYear) throw Error("Aktivitetens källår stämmer inte.");
  if (alreadyImported(source, data)) throw Error(source.title + " finns redan i planen.");
  
  const importedPlaceName=canonicalPlaceName(source.place.name);
  let place = null;
  if (!isGeneralPlaceName(importedPlaceName)) {
    place = data.places.find(p => p.name.trim().toLocaleLowerCase("sv-SE") === importedPlaceName.toLocaleLowerCase("sv-SE"));
    if (!place) { place = { id: uid(), name: importedPlaceName }; data.places.push(place); }
  }
  
  const historical = source.historicalOriginal || source;
  const {requirements,staffingPattern:pattern}=historicalPassSetup(source);

  const activity = definedImportFields({
    id: uid(),
    activityKey: source.activityKey,
    title: source.title,
    type: source.type,
    sourceKind: source.sourceKind,
    placeId: place?.id ?? null,
    notes: source.notes,
    dayNotes: clone(source.dayNotes || {}),
    requirements,
    staffingPattern: pattern,
    recommendedPeoplePerDay: Math.max(0, ...dailyStaffingCounts({staffingPattern:pattern}).map(day => day.total)),
    origin: { kind: "historical-import", year: sourceYear, activityId: source.id, sourceVersion: source.version, importedAt, passImportVersion:2 },
    historicalSnapshot: {
      schemaVersion: 1,
      year: sourceYear,
      activityId: historical.id,
      activityKey: historical.activityKey,
      sourceVersion: historical.version,
      title: historical.title,
      place: clone(historical.place),
      notes: historical.notes,
      dayNotes: clone(historical.dayNotes || {}),
      requirements: clone(historical.requirements),
      staffingPattern: clone(historical.staffingPattern),
      historicalStaffing: clone(historical.historicalStaffing),
      normalization: clone(historical.normalization || [])
    }
  });

  data.activities.push(activity);
  return activity;
}

function importPreviousStaffing(data,source,activity,report) {
  const previous=source.historicalStaffing || [];
  if (!previous.length) {report.withoutHistory++;return;}
  const oldRows=patternTimelineRows(source),newRows=patternTimelineRows(activity);
  const oldShifts=source.staffingPattern?.shifts || [],newShifts=activity.staffingPattern.shifts;
  const rowMap=new Map();
  oldShifts.forEach((shift,index)=>{
    const before=oldRows.filter(row=>row.shiftId===shift.id);
    const after=newRows.filter(row=>row.shiftId===newShifts[index]?.id);
    before.forEach((row,i)=>{if(after[i] && row.day===after[i].day && row.start===after[i].start && row.end===after[i].end && row.kind===after[i].kind) rowMap.set(row.id,after[i].id);});
  });
  let choices=[];
  for (const old of previous) {
    const key=old.personDirectoryId || old.directoryId || old.personId;
    const matches=key?data.people.filter(person=>(person.directoryId || person.id)===key || person.id===key):[];
    if (matches.length!==1) {report.missing++;continue;}
    const person=matches[0];
    const selected=oldRows.filter(row=>row.shiftId===old.patternShiftId && row.day===old.day &&
      (old.patternRowIds?.length?old.patternRowIds.includes(row.id):row.start>=old.start && row.end<=old.end));
    if (!selected.length || selected.some(row=>!rowMap.has(row.id))) {report.unmapped++;continue;}
    const next=choices.concat(selected.map(row=>({rowId:rowMap.get(row.id),personId:person.id})));
    const candidate=patternRowAssignments(activity,next,data.assignments);
    const trial={...data,assignments:candidate};
    try {
      validatePlan(clone(trial),{allowedHandovers:new Set(staffingHandovers(data).map(item=>item.key))});
    } catch(error) {report.conflicts++;continue;}
    choices=next;data.assignments=candidate;report.imported++;
  }
}

async function importHistoricalActivities(year,ids) {

function validateStaffingPattern(activity) {
  const pattern=activity.staffingPattern;
  if (!pattern) return;
  if (pattern.schemaVersion!==1 || !Array.isArray(pattern.participants) || !Array.isArray(pattern.shifts)) throw Error("Bemanningsupplägget har fel format.");
  const participants=new Set(),shifts=new Set(),pauses=new Map();
  for (const p of pattern.participants) {
    if (!safeId(p.id) || participants.has(p.id) || typeof p.label!=="string" || !p.label.trim()) throw Error("Ogiltig passetikett i bemanningsupplägget.");
    participants.add(p.id);
  }
  for (const shift of pattern.shifts) {
    const requirement=activity.requirements.find(r => r.id===shift.requirementId);
    if (!safeId(shift.id) || shifts.has(shift.id) || !participants.has(shift.participantId) ||
        !requirement || shift.day!==requirement.day || !validRange(shift) ||
        !["ordinary","relief"].includes(shift.kind) || !Array.isArray(shift.breaks)) throw Error("Kontrollera bemanningsuppläggets dagar och arbetspass.");
    let cursor=shift.start;
    for (const range of activity.requirements.filter(r => r.day===shift.day).sort((a,b) => a.start.localeCompare(b.start))) {
      if (range.start<=cursor && range.end>cursor) cursor=range.end;
    }
    if (cursor<shift.end) throw Error("Ett planerat arbetspass ligger utanför aktivitetens behovstider.");
    shifts.add(shift.id);
    for (const pause of shift.breaks) {
      if (!safeId(pause.id) || pauses.has(pause.id) || !validRange(pause) || pause.start<shift.start || pause.end>shift.end) throw Error("Kontrollera pauserna i bemanningsupplägget.");
      if (shift.breaks.some(other => other!==pause && overlaps(other,pause))) throw Error("Pauserna i ett planerat arbetspass får inte överlappa.");
      pauses.set(pause.id,{pause,shift});
    }
    if (pattern.shifts.some(other => other!==shift && other.participantId===shift.participantId && other.day===shift.day && overlaps(other,shift))) throw Error("Samma passetikett har överlappande arbetspass.");
  }
  for (const shift of pattern.shifts) {
    if (shift.reliefPeriods===undefined) continue;
    if (shift.kind!=="relief" || !Array.isArray(shift.reliefPeriods)) throw Error("Kontrollera avlösningspassets kopplingar.");
    for (const period of shift.reliefPeriods) {
      const target=pauses.get(period.breakId);
      if (!validRange(period) || period.start<shift.start || period.end>shift.end ||
          !target || target.shift.day!==shift.day || target.shift.participantId!==period.participantId ||
          shift.participantId===period.participantId || target.pause.start!==period.start || target.pause.end!==period.end ||
          shift.reliefPeriods.some(other => other!==period && overlaps(other,period))) throw Error("En avlösning stämmer inte med den kopplade pausen.");
    }
  }
}

function synchronizeStaffingPattern(old,activity) {
  if (!old?.staffingPattern) return;
  const previous=old.staffingPattern;

  // Bevara sammanhängande arbetspass med lunch och avlösning.
  // Ett arbetspass kan sträcka sig över flera behovsperioder.
  if (previous.layout==="linked-shifts") {
    const pattern=clone(previous);
    const byId=new Map(activity.requirements.map(r => [r.id,r]));
    const remap=(day,value,edge) => {
      const before=old.requirements.find(r => r.day===day && r[edge]===value && byId.has(r.id));
      return before?byId.get(before.id)[edge]:value;
    };
    pattern.shifts=pattern.shifts.flatMap(shift => {
      const anchor=byId.get(shift.requirementId);
      const day=anchor?.day ?? shift.day;
      const ranges=activity.requirements.filter(r => r.day===day).sort((a,b) => a.start.localeCompare(b.start));
      if (!ranges.length) return [];
      const start=[remap(shift.day,shift.start,"start"),ranges[0].start].sort().at(-1);
      const end=[remap(shift.day,shift.end,"end"),ranges.at(-1).end].sort()[0];
      if (start>=end) return [];
      const requirement=ranges.find(r => r.start<=start && r.end>start);
      if (!requirement) throw Error("Ett arbetspass börjar utanför aktivitetens behovstider.");
      return [{...shift,day,start,end,requirementId:requirement.id,
        breaks:shift.breaks.filter(p => p.start>=start && p.end<=end)}];
    });
    const pauses=new Map(pattern.shifts.flatMap(shift => shift.breaks.map(pause => [pause.id,{pause,shift}])));
    for (const shift of pattern.shifts) {
      if (shift.reliefPeriods) shift.reliefPeriods=shift.reliefPeriods.filter(period => pauses.has(period.breakId)).map(period => {
        const target=pauses.get(period.breakId);
        return {...period,start:target.pause.start,end:target.pause.end};
      });
    }
    const active=new Set(pattern.shifts.map(s => s.participantId));
    pattern.participants=pattern.participants.filter(p => active.has(p.id));
    activity.staffingPattern=pattern;
    return;
  }
  const retained=new Set(activity.requirements.map(r => r.id));
  const pattern={schemaVersion:1,participants:clone(previous.participants),shifts:[]};
  const candidates=previous.shifts.filter(s => retained.has(s.requirementId));
  const usedIds=new Set(candidates.map(s => s.participantId));
  pattern.participants=pattern.participants.filter(p => usedIds.has(p.id));
  function addParticipant() {
    const used=new Set(pattern.participants.map(p => p.label));
    let n=1,label;
    do {label="Pass "+n++;} while(used.has(label));
    const participant={id:uid(),label};pattern.participants.push(participant);return participant.id;
  }
  for (const range of activity.requirements) {
    const existing=candidates.filter(s => s.requirementId===range.id);
    for (let i=0;i<range.count;i++) {
      const shift=existing[i];
      pattern.shifts.push(shift?{...clone(shift),day:range.day,start:range.start,end:range.end}:
        {id:uid(),participantId:addParticipant(),requirementId:range.id,day:range.day,start:range.start,end:range.end,kind:"ordinary",breaks:[]});
    }
  }
  const active=new Set(pattern.shifts.map(s => s.participantId));
  pattern.participants=pattern.participants.filter(p => active.has(p.id));
  activity.staffingPattern=pattern;
}

function synchronizePatternAssignments(data,activity) {
  if (!activity.staffingPattern) return;
  const activeSources=new Set(activity.staffingPattern.shifts.map(shift => shift.id));
  data.assignments=data.assignments.filter(shift => shift.activityId!==activity.id || !shift.patternShiftId || activeSources.has(shift.patternShiftId));
  if (activity.staffingChoices) {
    validateTimelineChoices(activity,data.people);
    const draft=createTimelineDraft(activity,data.assignments,data.people);
    const choices=patternTimelineRows(activity).map(row => ({rowId:row.id,personId:timelineChoiceValue(draft,row).personId}));
    data.assignments=patternRowAssignments(activity,choices,data.assignments);
    return;
  }
  const shifts=new Map(activity.staffingPattern.shifts.map(s => [s.id,s]));
  data.assignments=data.assignments.filter(s => s.activityId!==activity.id || !s.patternShiftId || shifts.has(s.patternShiftId)).map(shift => {
    if (shift.activityId!==activity.id || !shift.patternShiftId) return shift;
    const updated=shifts.get(shift.patternShiftId);
    const breaks=activity.staffingPattern.layout==="linked-shifts"?
      updated.breaks.map((pause,index) => ({...pause,id:shift.breaks[index]?.id || uid()})):shift.breaks;
    return {...shift,day:updated.day,start:updated.start,end:updated.end,breaks,
      ...(updated.reliefPeriods?{coveragePeriods:updated.reliefPeriods.map(period => ({start:period.start,end:period.end}))}:{})};
  });
}

function timelineChoiceValue(draft,row) {
  return draft.overrides[row.id] || draft.defaults[row.participantId] || {personId:"",text:""};
}

function createTimelineDraft(activity,assignments=plan.assignments,people=plan.people) {
  const rows=patternTimelineRows(activity),draft={defaults:{},overrides:{}};
  const personValue=id => ({personId:id || "",text:people.find(p => p.id===id)?.name || ""});
  const stored=activity.staffingChoices;
  if (stored?.schemaVersion===1) {
    for (const value of stored.defaults) {
      const candidates=rows.filter(row => row.participantId===value.participantId);
      if (!candidates.length) continue;
      draft.defaults[value.participantId]={...personValue(value.personId),locked:Boolean(value.personId),
        sourceRowId:candidates.some(row => row.id===value.sourceRowId)?value.sourceRowId:candidates[0].id};
    }
    for (const value of stored.overrides) {
      if (rows.some(row => row.id===value.rowId)) draft.overrides[value.rowId]=personValue(value.personId);
    }
    return draft;
  }
  const existing=new Map(rows.map(row => {
    const assignment=assignments.find(shift => shift.activityId===activity.id && shift.patternShiftId===row.shiftId &&
      (shift.patternRowIds?.includes(row.id) || (shift.day===row.day && shift.start<=row.start && shift.end>=row.end)));
    return [row.id,assignment?.personId || ""];
  }));
  for (const person of activity.staffingPattern.participants) {
    const group=rows.filter(row => row.participantId===person.id);
    const first=group.find(row => existing.get(row.id));
    if (!first) continue;
    const personId=existing.get(first.id);
    draft.defaults[person.id]={...personValue(personId),sourceRowId:first.id,locked:true};
    for (const row of group) {
      if (existing.get(row.id)!==personId) draft.overrides[row.id]=personValue(existing.get(row.id));
    }
  }
  return draft;
}

function updateTimelineDraft(draft,row,value,commitChoice=false) {
  const entry={personId:value.personId || "",text:value.text || ""};
  const shared=draft.defaults[row.participantId];
  if (!shared) {
    if (!entry.personId && !entry.text) return;
    draft.defaults[row.participantId]={...entry,sourceRowId:row.id,locked:commitChoice && Boolean(entry.personId)};
    delete draft.overrides[row.id];
  } else if (!shared.locked && shared.sourceRowId===row.id) {
    Object.assign(shared,entry);
    if (commitChoice && entry.personId) shared.locked=true;
    delete draft.overrides[row.id];
  } else if (shared.personId===entry.personId && shared.text===entry.text) {
    delete draft.overrides[row.id];
  } else {
    draft.overrides[row.id]=entry;
  }
}

function serializeTimelineDraft(activity,draft) {
  const rows=patternTimelineRows(activity);
  const unresolved=rows.find(row => {const choice=timelineChoiceValue(draft,row);return choice.text.trim() && !choice.personId;});
  if (unresolved) throw Error(`${DAYS[unresolved.day]} ${unresolved.start}–${unresolved.end}, ${unresolved.personLabel}: välj en registrerad medarbetare från förslagen.`);
  return {schemaVersion:1,
    defaults:Object.entries(draft.defaults).map(([participantId,value]) => ({participantId,personId:value.personId,sourceRowId:value.sourceRowId})),
    overrides:Object.entries(draft.overrides).map(([rowId,value]) => ({rowId,personId:value.personId}))};
}

function patternRowAssignments(activity,choices,currentAssignments) {
  const rows=patternTimelineRows(activity),pattern=activity.staffingPattern;
  const ids=new Set(pattern.shifts.map(shift => shift.id));
  const retained=currentAssignments.filter(shift => shift.activityId!==activity.id || !ids.has(shift.patternShiftId));
  const selected=new Map(choices.map(choice => [choice.rowId,choice.personId]));
  for (const source of pattern.shifts) {
    const sourceRows=rows.filter(row => row.shiftId===source.id).sort((a,b) => a.start.localeCompare(b.start));
    const blocks=[];
    for (const row of sourceRows) {
      const personId=selected.get(row.id);
      if (!personId) continue;
      let block=blocks.at(-1);
      if (!block || block.personId!==personId || block.end!==row.start) {
        block={personId,start:row.start,end:row.end,rows:[],breaks:[]};blocks.push(block);
      }
      block.end=row.end;block.rows.push(row.id);
      if (row.kind==="pause") block.breaks.push({...source.breaks.find(pause => pause.id===row.breakId)});
    }
    for (const block of blocks) {
      const old=currentAssignments.find(shift => shift.activityId===activity.id && shift.patternShiftId===source.id &&
        shift.personId===block.personId && shift.start===block.start && shift.end===block.end);
      const assignment={id:old?.id || uid(),activityId:activity.id,personId:block.personId,day:source.day,
        start:block.start,end:block.end,kind:source.kind,note:old?.note || "",
        breaks:block.breaks.map((pause,index) => ({...pause,id:old?.breaks[index]?.id || uid()})),
        patternShiftId:source.id,patternParticipantId:source.participantId,patternRowIds:block.rows};
      if (source.reliefPeriods?.length) {
        assignment.coveragePeriods=source.reliefPeriods.filter(period => overlaps(period,block)).map(period => ({
          start:period.start>block.start?period.start:block.start,end:period.end<block.end?period.end:block.end}));
      }
      retained.push(assignment);
    }
  }
  return retained;
}

function patternPersonPosition(activity, day, participantId) {
  const people = patternDayPeople(activity, day);
  const ordered = [
    ...people.filter(person => person.role === "ordinary"),
    ...people.filter(person => person.role === "relief")
  ];
  const index = ordered.findIndex(person => person.participantId === participantId);
  return index < 0 ? ordered.length : index;
}

function patternGroups(activity) {
  const groups=[];
  for (const shift of [...activity.staffingPattern.shifts].sort((a,b) => a.day-b.day || a.start.localeCompare(b.start))) {
    let group=groups.find(item => item.day===shift.day && item.participantId===shift.participantId);
    if (!group) {group={day:shift.day,participantId:shift.participantId,shifts:[]};groups.push(group);}
    group.shifts.push(shift);
  }
  return groups.sort((a, b) =>
    a.day - b.day ||
    patternPersonPosition(activity, a.day, a.participantId) -
    patternPersonPosition(activity, b.day, b.participantId)
  );
}

function patternAssignments(activity,choices,currentAssignments) {
  return patternRowAssignments(activity,patternTimelineRows(activity).map(row => ({rowId:row.id,
    personId:choices.find(choice => choice.day===row.day && choice.participantId===row.participantId)?.personId || ""})),currentAssignments);
}

function personDayKey(value) {
  return `${value.day}:${value.participantId}`;
}

function createPersonDayDraft(activity,assignments=plan.assignments,people=plan.people) {
  const timeline=createTimelineDraft(activity,assignments,people),rows=patternTimelineRows(activity);
  return new Map(patternGroups(activity).map(group => {
    const ids=[...new Set(rows.filter(row => personDayKey(row)===personDayKey(group))
      .map(row => timelineChoiceValue(timeline,row).personId).filter(Boolean))];
    const personId=ids.length===1?ids[0]:"";
    return [personDayKey(group),{personId,text:people.find(person => person.id===personId)?.name || "",
      mixed:ids.length>1,previousNames:ids.map(id => people.find(person => person.id===id)?.name || "").filter(Boolean)}];
  }));
}

function serializePersonDayDraft(activity,draft) {
  for (const group of patternGroups(activity)) {
    const value=draft.get(personDayKey(group));
    const label=patternPersonLabel(activity,group.day,group.participantId);
    if (value?.mixed) throw Error(`${DAYS[group.day]}, ${label}: välj vem som ska utföra hela arbetet. Tidigare bemanning innehåller flera namn.`);
    if (value?.text.trim() && !value.personId) throw Error(`${DAYS[group.day]}, ${label}: välj en registrerad medarbetare från förslagen.`);
  }
  // Varje dags val sparas uttryckligen, även tomma val. Ett nytt namn ska aldrig fylla en annan dag.
  return {schemaVersion:1,scope:"person-day",defaults:[],overrides:patternTimelineRows(activity).map(row => ({
    rowId:row.id,personId:draft.get(personDayKey(row))?.personId || ""}))};
}
