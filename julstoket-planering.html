}

// Koppla pauser till deras bemannade avlösningar. För kopplade pass används
// pausens ID i passmodellen; en obemannad avlösning ger aldrig något namn.
function personSchedulePauses(activity,shift) {
  const source=activity?.staffingPattern?.shifts?.find(item=>item.id===shift.patternShiftId);
  const fromAssignments=shift.breaks || [];
  const pauses=[...fromAssignments];

  // Kompatibilitet med pass där pausen finns i modellen men ännu inte
  // kopierats till den faktiska bemanningsposten.
  for (const pause of source?.breaks || []) {
    if (!validRange(pause) || pause.start<shift.start || pause.end>shift.end) continue;
    if (shift.patternRowIds?.length && !shift.patternRowIds.includes(source.id+":pause:"+pause.id)) continue;
    if (!pauses.some(item=>item.start===pause.start && item.end===pause.end)) pauses.push({...pause});
  }

  return pauses.filter(validRange).sort((a,b)=>a.start.localeCompare(b.start)).map(pause=>{
    const sourcePause=source?.breaks.find(item=>item.id===pause.id ||
      (item.start===pause.start && item.end===pause.end));
    const linkedReliefs=(activity?.staffingPattern?.shifts || []).filter(item=>
      item.kind==="relief" && item.day===shift.day &&
      (item.reliefPeriods || []).some(period=>period.breakId===(sourcePause?.id || pause.id)));
    const hasExplicitLinks=Boolean(activity?.staffingPattern?.shifts?.some(item=>
      item.kind==="relief" && item.day===shift.day && (item.reliefPeriods || []).length));

    const assigned=plan.assignments.filter(item=>
      item.activityId===shift.activityId && item.day===shift.day && item.kind==="relief" &&
      item.personId && item.personId!==shift.personId && validRange(item) &&
      item.start<pause.end && item.end>pause.start &&
      (linkedReliefs.length
        ? linkedReliefs.some(sourceRelief=>sourceRelief.id===item.patternShiftId)
        : !hasExplicitLinks && (item.coveragePeriods?.length
          ? item.coveragePeriods.some(range=>range.start<pause.end && range.end>pause.start)
          : item.start<=pause.start && item.end>=pause.end)));
    const names=[...new Set(assigned.map(item=>plan.people.find(person=>person.id===item.personId)?.name).filter(Boolean))];
    return {pause,names};
  });
}

function personSchedule(id) {
  const person=plan.people.find(p => p.id===id);
  if (!person) return;

  const scheduleHTML=DAYS.map((name,day) => {
    const working=person.availability.filter(r => r.day===day)
      .sort((a,b) => a.start.localeCompare(b.start));
    const shifts=plan.assignments.filter(s => s.personId===id && s.day===day)
      .sort((a,b) => a.start.localeCompare(b.start));

    // Visa inte dagar där personen varken har arbetstid eller tilldelade pass.
    if (!working.length && !shifts.length) return "";

    const workLabel=working.length
      ? working.map(r => r.start+"–"+r.end).join(", ")
      : "ej registrerad";

    return `<div class="formsection person-schedule-day">
      <h3>${name} <span class="hint">${dateLabel(day)}, arbetstid ${workLabel}</span></h3>
      ${shifts.map(shift => {
        const activity=plan.activities.find(item=>item.id===shift.activityId);
        const pauseRows=personSchedulePauses(activity,shift);
        const place=activity?esc(placeName(activity.placeId)):"";
        return `<div class="scheduleitem"><div class="scheduleitem-main">
          <strong>${esc(shift.start)}–${esc(shift.end)} · ${activity
            ? `<button type="button" class="schedule-activity-link" data-action="staff-person-activity" data-id="${esc(activity.id)}" data-day="${day}">${esc(activity.title)}</button>`
            : esc(activityName(shift.activityId))}</strong>
          ${place?`<small>${place}</small>`:""}
          ${pauseRows.length?`<div class="schedule-pause-list">${pauseRows.map(({pause,names})=>
            `<div class="schedule-pause">${esc(pause.type || "Paus")} ${esc(pause.start)}–${esc(pause.end)}${names.length
              ? ` <span class="schedule-pause-reliever">· Avlösare: ${esc(names.join(", "))}</span>`:""}</div>`).join("")}</div>`:""}
        </div></div>`;
      }).join("") || `<p class="hint" style="margin-top:9px">Inga pass tilldelade.</p>`}
    </div>`;
  }).filter(Boolean).join("");

  showDialog(
    person.name,
    "Arbetstider, uppgifter och pauser under hela helgen.",
    scheduleHTML || '<p class="hint">Inga arbetstider eller pass registrerade.</p>',
    button("Redigera person","edit-person",id)+button("Klart","close","","primary")
  );
}

function weekendReportHTML(data) {
  const dates=eventDates(data.year);
  const dateText=day => new Date(dates[day]+"T12:00:00")
    .toLocaleDateString("sv-SE",{day:"numeric",month:"long"});
  const weekend=new Date(dates[0]+"T12:00:00").getDate()+"–"+dateText(2)+" "+data.year;
  const person=id => data.people.find(p => p.id===id)?.name || "Okänd person";
  const place=id => id===null ? "Allmänt" : data.places.find(p => p.id===id)?.name || "Okänd plats";
  const prose=text => esc(text).replace(/\r?\n/g,"<br>");
  const paragraph=(label,content,color="#26352b") =>
    `<p style="margin:0 0 6pt;color:${color};"><strong>${label}</strong> ${content}</p>`;
  const list=items => `<ul style="margin:0 0 9pt;padding-left:20pt;">${items.map(item =>
    `<li style="margin:0 0 4pt;">${item}</li>`).join("")}</ul>`;
  const label=text => `<p style="margin:9pt 0 4pt;font-weight:bold;">${text}</p>`;
  const dayHTML=DAYS.map((dayName,day) => {
    const entries=[];
    for (const activity of data.activities) {
      const ranges=activity.requirements.filter(r => r.day===day)
        .sort((a,b) => a.start.localeCompare(b.start));
      let current=null;
      for (const range of ranges) {
        if (current && current.end===range.start) {
          current.end=range.end;
          current.ranges.push(range);
        } else {
          current={activity,start:range.start,end:range.end,ranges:[range]};
          entries.push(current);
        }
      }
    }
    entries.sort((a,b) => a.start.localeCompare(b.start) ||
      a.activity.title.localeCompare(b.activity.title,"sv") ||
      place(a.activity.placeId).localeCompare(place(b.activity.placeId),"sv"));

    const activitiesHTML=entries.map(entry => {
      const {activity,start,end,ranges}=entry;
      const clip=range => ({start:range.start<start?start:range.start,end:range.end>end?end:range.end});
      const shifts=data.assignments.filter(s => s.activityId===activity.id && s.day===day && overlaps(s,entry))
        .sort((a,b) => a.start.localeCompare(b.start) || person(a.personId).localeCompare(person(b.personId),"sv"));
      const ordinary=shifts.filter(s => s.kind!=="relief");
      const relief=shifts.filter(s => s.kind==="relief");
      const pauses=shifts.flatMap(shift => (shift.breaks || []).filter(p => overlaps(p,entry))
        .map(pause => ({...clip(pause),type:pause.type || "Rast",personId:shift.personId})))
        .sort((a,b) => a.start.localeCompare(b.start) || person(a.personId).localeCompare(person(b.personId),"sv"));
      const missing=gaps(activity.id,day,data).filter(gap => overlaps(gap,entry))
        .map(gap => ({...gap,...clip(gap)}));
      let required=0,covered=0;
      for (const segment of coverage(activity.id,day,data).filter(s => overlaps(s,entry))) {
        const clipped=clip(segment),length=duration(clipped.start,clipped.end);
        required+=segment.need*length;
        covered+=Math.min(segment.staff,segment.need)*length;
      }
      const fully=required>0 && covered===required;
      const percent=required?covered/required*100:0;
      const percentLabel=String(Math.round(percent));
      const status=fully?"Fullt bemannad – alla timmar i passet är bemannade.":
        covered?percentLabel+" % av passet är bemannat.":"Obemannad – inga timmar i passet är bemannade.";
      const shiftItem=shift => {
        const range=clip(shift);
        return `<strong>${range.start}–${range.end} · ${esc(person(shift.personId))}</strong>`+
          (shift.note?`<br><span style="color:#586354;">${prose(shift.note)}</span>`:"");
      };

      return `<section style="margin:0 0 19pt;">
        <h3 style="margin:12pt 0 7pt;font-family:Calibri,Arial,sans-serif;font-size:14pt;line-height:1.3;color:#173d35;page-break-after:avoid;">
          ${start}–${end} · ${esc(activity.title)}</h3>
        ${activity.placeId===null ? paragraph("","Allmänt.") : paragraph("Plats:",esc(place(activity.placeId)))}
        ${paragraph("Tider och bemanningsbehov:",ranges.map(r =>
          `${r.start}–${r.end}: ${r.count} ${r.count===1?"person":"personer"}`).join("; ")+".")}
        ${instructionForDay(activity,day)?paragraph("Instruktioner:",prose(instructionForDay(activity,day))):""}
        ${paragraph("Bemanningsläge:",esc(status),fully?"#26763e":covered?"#825c19":"#a53e2e")}
        ${label("Ordinarie bemanning")}
        ${ordinary.length?list(ordinary.map(shiftItem)):paragraph("","Ingen ordinarie bemanning registrerad.")}
        ${pauses.length?label("Raster och lunch")+list(pauses.map(p =>
          `<strong>${p.start}–${p.end}</strong> · ${esc(person(p.personId))}: ${esc(p.type)}.`)):""}
        ${relief.length?label("Avlösning")+list(relief.map(shiftItem)):""}
        ${missing.length?label("Återstår att bemanna")+list(missing.map(gap =>
          `<strong>${gap.start}–${gap.end}</strong> · saknar ${gap.missing} ${gap.missing===1?"person":"personer"}.`)):""}
      </section>`;
    }).join("");

    return `<section style="margin:0;">
      <h2 style="margin:${day===0?23:48}pt 0 12pt;mso-margin-top-alt:${day===0?23:48}pt;padding-bottom:7pt;border-bottom:2pt solid #285e4d;font-family:Georgia,serif;font-size:20pt;line-height:1.25;color:#173d35;page-break-after:avoid;">
        ${dayName} ${dateText(day)}</h2>
      ${activitiesHTML || '<p style="margin:0 0 12pt;">Inga aktiviteter är registrerade för dagen.</p>'}
    </section>`;
  }).join("");

  return `<article id="weekendReport" class="weekend-report" style="font-family:Calibri,Arial,sans-serif;font-size:11pt;line-height:1.4;color:#26352b;">
    <h1 style="margin:0 0 5pt;font-family:Georgia,serif;font-size:28pt;line-height:1.2;color:#173d35;">Julstöket</h1>
    <p style="margin:0 0 12pt;font-size:13pt;color:#586354;">${weekend}</p>
    <p style="margin:0 0 6pt;font-size:14pt;font-weight:bold;">Program och bemanning</p>
    ${data.assignments.some(s => s.example)?'<p style="margin:0 0 14pt;font-size:10pt;color:#825c19;">Exempelplan: markerad exempelbemanning är inte fastställd bemanning.</p>':""}
    ${dayHTML}
  </article>`;
}

function showWeekendReport() {
  showDialog("Skriv ut helgschema","Fredag–söndag · program, bemanning, raster och avlösning.",
    `<p class="report-help">Kopiera schemat med formatering och klistra in det direkt i Word.
      Välj ”Behåll källformatering” i Word om du får frågan.</p>`+weekendReportHTML(clone(plan)),
    button("Stäng","close","","push-left")+
    button("Markera texten","select-report")+
    button("Kopiera till Word","copy-report","","primary")+
    `<p id="reportCopyStatus" class="report-copy-status" role="status" aria-live="polite"></p>`);
  modal.classList.add("report-modal");
}

function selectWeekendReport() {
  const report=$("weekendReport");
  if (!report) return;
  const range=document.createRange();
  range.selectNodeContents(report);
  const selection=window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
  return report;
}

function reportCopyFeedback(message) {
  const status=$("reportCopyStatus");
  if (status) status.textContent=message;
}

async function copyWeekendReport() {
  const report=$("weekendReport");
  if (!report) return;
  const html=report.outerHTML;
  const plain=report.innerText;
  try {
    if (navigator.clipboard?.write && globalThis.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html":new Blob([html],{type:"text/html"}),
        "text/plain":new Blob([plain],{type:"text/plain"})
      })]);
      reportCopyFeedback("Schemat är kopierat med formatering.");
      return;
    }
  } catch {}

  selectWeekendReport();
  const onCopy=event => {
    if (!event.clipboardData) return;
    event.clipboardData.setData("text/html",html);
    event.clipboardData.setData("text/plain",plain);
    event.preventDefault();
  };
  document.addEventListener("copy",onCopy);
  let copied=false;
  try { copied=document.execCommand("copy"); } catch {}
  finally { document.removeEventListener("copy",onCopy); }
  reportCopyFeedback(copied?"Schemat är kopierat med formatering.":"Texten är markerad. Kopiera med Ctrl+C eller ⌘C.");
}

function download(content,type,name) {
  const url=URL.createObjectURL(new Blob([content],{type}));
  const anchor=document.createElement("a");
  anchor.href=url;
  anchor.download=name;
  document.body.append(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url),1000);
}

/* ---------- Slim JSON (Firebase-format): aktiviteter, personer, bemanning ---------- */
// bemanning: pass-id eller avlösnings-id -> person-id. Tider, plats och text finns bara i aktiviteten.
function slimActivity(a,plats) {
  const pass={},shifts=a.staffingPattern?.shifts||[];
  if (a.days) {
    for (const d of a.days) (d.passes||[]).forEach((x,i) => {
      const [start,slut]=x.time.split("-"),id=a.id+"-d"+d.day+"-p"+(i+1),o={dag:d.day,start,slut};
      if (x.pause) { const [ps,pe]=x.pause.split("-"); o.avlosningar={[id+"-r1"]:{start:ps,slut:pe}}; }
      pass[id]=o;
    });
  } else if (shifts.length) {
    for (const sh of shifts.filter(x => x.kind!=="relief")) {
      const o={dag:sh.day,start:sh.start,slut:sh.end};
      if (sh.breaks?.length) { o.avlosningar={}; for (const b of sh.breaks) o.avlosningar[b.id]={start:b.start,slut:b.end}; }
      pass[sh.id]=o;
    }
  } else {
    for (const r of a.requirements||[]) for (let i=1;i<=(r.count||1);i++) pass[r.id+"-"+i]={dag:r.day,start:r.start,slut:r.end};
  }
  const dayNotes=a.dayNotes || Object.fromEntries((a.days || []).filter(d => d.notes).map(d => [d.day,d.notes]));
  return {namn:a.title,plats:plats||null,instruktion:a.notes || "",daginstruktioner:dayNotes,pass};
}

function toSlim(p) {
  const out={aktiviteter:{},personer:{},bemanning:{}},lost=[];
  const placeOf=id => (p.places.find(x => x.id===id)||{}).name||null;
  for (const a of p.activities) {
    const o=out.aktiviteter[a.id]=slimActivity(a,placeOf(a.placeId)),pass=o.pass,shifts=a.staffingPattern?.shifts||[];
    for (const s of p.assignments.filter(x => x.activityId===a.id)) {
      const src=shifts.find(x => x.id===s.patternShiftId);
      if (src?.kind==="relief") { for (const r of src.reliefPeriods||[]) out.bemanning[r.breakId]=s.personId; }
      else if (src && pass[src.id]) out.bemanning[src.id]=s.personId;
      else {
        const m=Object.keys(pass).find(k => !out.bemanning[k] && pass[k].dag===s.day && pass[k].start===s.start && pass[k].slut===s.end);
        if (m) out.bemanning[m]=s.personId; else lost.push(s.id);
      }
    }
  }
  for (const x of p.people) out.personer[x.id]={namn:x.name,tel:x.phone||""};
  // Årsbankerna (t.ex. 2025): samma slimformat, utan bemanning.
  for (const [year,ed] of Object.entries(HISTORICAL_EDITIONS)) {
    if (!ed.activities?.length) continue;
    out.historik=out.historik||{};
    out.historik[year]={};
    for (const a of ed.activities) out.historik[year][a.id]=slimActivity(a,typeof a.place==="string"?a.place:a.place?.name);
  }
  return {slim:out,lost};
}

function exportSlimJSON() {
  const {slim,lost}=toSlim(plan);
  download(JSON.stringify(slim,null,2),"application/json","julstoket-"+plan.year+"-slim.json");
  if (lost.length) showError(Error(lost.length+" bemanningspass kunde inte kopplas till något pass och finns inte med i slim-filen."));
}

function exportCSV() {
  const rows=[
    ["Dag","Datum","Person","Från","Till","Aktivitet","Plats","Typ","Raster","Anteckning"],
    ...[...plan.assignments].sort((a,b) => a.day-b.day || a.start.localeCompare(b.start)).map(s => [
      DAYS[s.day],eventDates(plan.year)[s.day],personName(s.personId),
      s.start,s.end,activityName(s.activityId),
      placeName(plan.activities.find(a => a.id===s.activityId).placeId),

      s.breaks.map(b => b.type+" "+b.start+"–"+b.end).join(", "),
      s.note || ""
    ])
  ];

  const cell=value => {
    let text=String(value);
    if (/^[=+@\-\t\r]/.test(text)) text="'"+text;
    return '"'+text.replace(/"/g,'""')+'"';
  };

  download("\ufeff"+rows.map(row => row.map(cell).join(";")).join("\r\n"),
    "text/csv;charset=utf-8","julstoket-"+plan.year+"-bemanning.csv");
}

function subscribeCloudPlan(ref) {
  if (unsubscribe) unsubscribe();
  const active=cloud;
  unsubscribe=active.fs.onSnapshot(ref,snapshot=>{
    if (cloud!==active || cloud.ref!==ref || !snapshot.exists()) return;
    try {
      const incoming=validatePlan(snapshot.data(),{normalizeRequirements:true,allowExistingHandovers:true});
      if (incoming.year!==plan.year) return;
      if (incoming.revision>plan.revision) {
        reconcilePlaces(incoming);
        if (saving) pendingCloud=incoming;
        else {plan=incoming;render();toast("Planen har uppdaterats av en annan användare.");}
      }
      cloudStatus="";updateSync();
    } catch(error) {cloudStatus="Den sparade planen kunde inte läsas.";updateSync();}
  },()=>{cloudStatus="Anslutningen till årsplanen bröts. Ladda om sidan.";updateSync();});
}

function guideTargets(step) {
  return (step.targets || (step.target?[step.target]:[])).map(selector=>document.querySelector(selector)).filter(Boolean);
}
let guideState=null;
function showHelp() {
  if (guideState) return;
  hideMenuTooltip();
  hideGanttTooltip();
  const dialog=document.createElement("dialog");
  dialog.id="guide";
  dialog.setAttribute("aria-labelledby","guideTitle");
  dialog.setAttribute("aria-describedby","guideText");
  guideState={dialog,index:0,saved:{...ui,activityDays:[...ui.activityDays]},focus:document.activeElement,scroll:window.scrollY};
  document.body.append(dialog);
  dialog.addEventListener("cancel",event=>{event.preventDefault();endGuide();});
  dialog.addEventListener("click",event=>{
    const action=event.target.closest("[data-guide]")?.dataset.guide;
    if (!action) return;
    event.stopPropagation();
    if (action==="close" || (action==="next" && guideState.index===GUIDE_STEPS.length-1)) endGuide();
    else { guideState.index+=action==="back"?-1:1; renderGuide(); }
  });
  window.addEventListener("resize",positionGuide);
  window.addEventListener("scroll",positionGuide,true);
  dialog.showModal();
  renderGuide();
}
function endGuide() {
  if (!guideState) return;
  const state=guideState;
  guideState=null;
  window.removeEventListener("resize",positionGuide);
  window.removeEventListener("scroll",positionGuide,true);
  state.dialog.close();state.dialog.remove();
  Object.assign(ui,state.saved);render();
  window.scrollTo(0,state.scroll);
  if (state.focus?.isConnected) state.focus.focus({preventScroll:true});
  else document.querySelector('[data-action="help"]')?.focus({preventScroll:true});
}
function renderGuide() {
  const {dialog,index}=guideState,step=GUIDE_STEPS[index];
  if (step.view) {
    ui.view=step.view;
    ui.query="";
    ui.activityDays=step.singleDay?[1]:[];ui.showActivityGantt=Boolean(step.singleDay);
    render();
  }
  dialog.innerHTML=`${guideTargets(step).map(()=>'<div class="guide-highlight" hidden></div>').join("")}
    <svg class="guide-arrow" aria-hidden="true"><defs><marker id="guideArrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#f4d570" stroke-width="2"/></marker></defs>${guideTargets(step).map(()=>'<line stroke="#f4d570" stroke-width="3" marker-end="url(#guideArrowHead)"/>').join("")}</svg>
    <section class="guide-card"><button type="button" class="guide-close" data-guide="close" aria-label="Avsluta guiden">×</button>
      <h2 id="guideTitle">Så fungerar det</h2><p id="guideText">${step.text}</p>
      <div class="guide-progress" role="status">Steg ${index+1} av ${GUIDE_STEPS.length} · ${GUIDE_STEPS.length-1-index} steg kvar</div>
      <div class="guide-controls">${index?'<button type="button" class="btn" data-guide="back">Föregående</button>':""}<button type="button" class="btn primary" data-guide="next">${index===GUIDE_STEPS.length-1?"Avsluta":"Nästa"}</button></div></section>`;
  const target=guideTargets(step)[0];
  target?.scrollIntoView({block:"nearest",inline:"nearest",behavior:"instant"});
  positionGuide();
  dialog.querySelector('[data-guide="next"]').focus({preventScroll:true});
}
function positionGuide() {
  if (!guideState) return;
  const {dialog,index}=guideState,step=GUIDE_STEPS[index];
  const card=dialog.querySelector(".guide-card");
  if (!card) return;
  const targets=guideTargets(step),target=targets[0];
  const rings=[...dialog.querySelectorAll(".guide-highlight")],arrow=dialog.querySelector(".guide-arrow");
  const w=window.innerWidth,h=window.innerHeight,cw=card.offsetWidth,ch=card.offsetHeight;
  let x=(w-cw)/2,y=(h-ch)/2;
  rings.forEach((ring,index)=>{
    const element=targets[index];ring.hidden=!element;
    if (!element) return;
    const box=element.getBoundingClientRect();
    Object.assign(ring.style,{left:(box.left-4)+"px",top:(box.top-4)+"px",width:(box.width+8)+"px",height:(box.height+8)+"px"});
  });
  arrow.style.display=target?"block":"none";
  if (target) {
    const boxes=targets.map(element=>element.getBoundingClientRect());
    const r={left:Math.min(...boxes.map(box=>box.left)),top:Math.min(...boxes.map(box=>box.top)),right:Math.max(...boxes.map(box=>box.right)),bottom:Math.max(...boxes.map(box=>box.bottom))};
    r.width=r.right-r.left;r.height=r.bottom-r.top;
    if (w-r.right>=cw+56) {x=r.right+48;y=r.top+(r.height-ch)/2;}
    else if (r.left>=cw+56) {x=r.left-cw-48;y=r.top+(r.height-ch)/2;}
    else if (h-r.bottom>=ch+56) {x=r.left+(r.width-cw)/2;y=r.bottom+48;}
    else {x=r.left+(r.width-cw)/2;y=r.top-ch-48;}
    x=Math.max(16,Math.min(w-cw-16,x));y=Math.max(16,Math.min(h-ch-16,y));
    const lines=[...arrow.querySelectorAll("line")];
    boxes.forEach((box,index)=>{
      const line=lines[index];if (!line) return;
      const cx=x+cw/2,cy=y+ch/2,tx=box.left+box.width/2,ty=box.top+box.height/2;
      const dx=tx-cx,dy=ty-cy;
      const startScale=1/Math.max(Math.abs(dx)/(cw/2),Math.abs(dy)/(ch/2),1);
      const endScale=1/Math.max(Math.abs(dx)/(box.width/2+12),Math.abs(dy)/(box.height/2+12),1);
      for (const [key,value] of Object.entries({x1:cx+dx*startScale,y1:cy+dy*startScale,x2:tx-dx*endScale,y2:ty-dy*endScale})) line.setAttribute(key,value);
    });
  }
  card.style.left=x+"px";card.style.top=y+"px";
}

  dialog.addEventListener("click",event => {if (event.target.closest("[data-confirm-cancel]") && !busy) dialog.close();});

async function deleteActivityDay(id,day) {
  const activity=plan.activities.find(item => item.id===id);
  if (!activity) throw Error("Aktiviteten finns inte längre.");
  if (activityDays(activity).length<2 || !activity.requirements.some(range => range.day===day)) {
    throw Error("Den valda dagen kan inte tas bort.");
  }
  await commit(data => {
    const current=data.activities.find(item => item.id===id);
    if (!current) throw Error("Aktiviteten finns inte längre.");
    current.requirements=current.requirements.filter(range => range.day!==day);
    if (current.staffingPattern) {
      current.staffingPattern.shifts=current.staffingPattern.shifts.filter(shift => shift.day!==day);
      const participantIds=new Set(current.staffingPattern.shifts.map(shift => shift.participantId));
      current.staffingPattern.participants=current.staffingPattern.participants.filter(person => participantIds.has(person.id));
      if (current.staffingChoices) {
        current.staffingChoices.defaults=current.staffingChoices.defaults.filter(choice => participantIds.has(choice.participantId));
        const rowIds=new Set(patternTimelineRows(current).map(row => row.id));
        current.staffingChoices.overrides=current.staffingChoices.overrides.filter(choice => rowIds.has(choice.rowId));
      }
    }
    data.assignments=data.assignments.filter(shift => shift.activityId!==id || shift.day!==day);
  },DAYS[day]+" har tagits bort från aktiviteten.");
  closeDialog();
}

/* En gemensam tooltip följer med in i dialogens översta lager. */
let ganttTooltipTarget=null;

function hideGanttTooltip() {
  const tip=$("ganttTooltip");
  if (ganttTooltipTarget) ganttTooltipTarget.removeAttribute("aria-describedby");
  ganttTooltipTarget=null;
  if (!tip) return;
  if (typeof tip.hidePopover==="function") tip.hidePopover();
  tip.hidden=true;
}

function releaseGanttTooltip() {
  hideGanttTooltip();
  const tip=$("ganttTooltip");
  if (tip) document.body.append(tip);
}

function showGanttTooltip(target,pointerX) {
  if (modal.open && !modal.contains(target)) return;
  hideGanttTooltip();
  hideMenuTooltip();
  const tip=$("ganttTooltip"),parent=modal.contains(target)?modal:document.body;
  if (tip.parentElement!==parent) parent.append(tip);
  const data=target.dataset;
  const heading=data.ganttKind==="need"?data.ganttEvent:data.ganttPerson;
  const event=data.ganttKind==="need"?"Bemanningsbehov":data.ganttEvent;
  tip.innerHTML=`<span class="gantt-tooltip-context">${esc(data.ganttDay)} · ${esc(event)}</span>
    <strong>${esc(heading)}</strong>
    ${data.ganttName?`<span class="gantt-tooltip-name">${esc(data.ganttName)}</span>`:""}
    <span class="gantt-tooltip-time">${esc(data.ganttStart)}–${esc(data.ganttEnd)}</span>
    ${data.ganttDetails?`<span class="gantt-tooltip-details">${esc(data.ganttDetails)}</span>`:""}`;
  tip.hidden=false;
  if (typeof tip.showPopover==="function") tip.showPopover();
  ganttTooltipTarget=target;
  target.setAttribute("aria-describedby","ganttTooltip");
  const rect=target.getBoundingClientRect(),box=tip.getBoundingClientRect();
  const anchor=Number.isFinite(pointerX)?Math.max(rect.left,Math.min(rect.right,pointerX)):rect.left+rect.width/2;
  const left=Math.max(12,Math.min(anchor-box.width/2,innerWidth-box.width-12));
  const above=rect.top>=box.height+16;
  const top=above?rect.top-box.height-10:Math.min(innerHeight-box.height-12,rect.bottom+10);
  tip.style.left=left+"px";
  tip.style.top=Math.max(12,top)+"px";
  tip.dataset.placement=above?"above":"below";
  tip.style.setProperty("--gantt-tip-arrow",Math.max(12,Math.min(box.width-12,anchor-left))+"px");
}

document.addEventListener("pointerover",event => {

document.addEventListener("pointerout",event => {

document.addEventListener("focusout",event => {

document.addEventListener("scroll",hideGanttTooltip,true);

/* ---------- Menyhjälp ---------- */

let menuTooltipTarget=null;
let menuTooltipTimer;

function hideMenuTooltip() {
  clearTimeout(menuTooltipTimer);
  if (menuTooltipTarget) menuTooltipTarget.removeAttribute("aria-describedby");
  menuTooltipTarget=null;
  const tip=$("menuTooltip");
  if (!tip) return;
  if (typeof tip.hidePopover==="function") tip.hidePopover();
  tip.hidden=true;
}

function showMenuTooltip(target) {
  const inDialog=modal.contains(target);
  if (modal.open && !inDialog) return;
  clearTimeout(menuTooltipTimer);
  if (menuTooltipTarget && menuTooltipTarget!==target) {
    menuTooltipTarget.removeAttribute("aria-describedby");
  }
  menuTooltipTarget=target;
  const tip=$("menuTooltip");
  const parent=inDialog ? modal : document.body;
  if (typeof tip.hidePopover==="function" && tip.matches(":popover-open")) tip.hidePopover();
  if (tip.parentElement!==parent) parent.append(tip);
  tip.classList.toggle("compact-tooltip",target.classList.contains("field-info") &&
    ["Ange starttid","Ange sluttid"].includes(target.dataset.menuTip));
  const plain=target.dataset.menuTipPlain!==undefined;
  if (plain) tip.textContent=target.dataset.menuTip;
  else tip.innerHTML=esc(target.dataset.menuTip).replace(/&lt;(\/?)(em|strong)&gt;/g,"<$1$2>");
  tip.style.whiteSpace=plain?"pre-line":"";
  tip.style.maxWidth=plain?"min(380px,calc(100vw - 24px))":"";
  tip.hidden=false;
  if (typeof tip.showPopover==="function") tip.showPopover();
  target.setAttribute("aria-describedby","menuTooltip");
  const info=target.classList.contains("location-info"),below=target.dataset.tooltipPlacement==="below";
  tip.dataset.kind=below?"shortcut":info?"info":"menu";
  const rect=target.getBoundingClientRect();
  const box=tip.getBoundingClientRect();
  const right=rect.right+14;
  const beside=!below && !info && right+box.width<=innerWidth-16;
  const anchorLeft=below?rect.left+rect.width/2-box.width/2:rect.left;
  const left=beside ? right : Math.max(16,Math.min(anchorLeft,innerWidth-box.width-16));
  const preferredTop=beside ? rect.top+(rect.height-box.height)/2 : rect.bottom+10;
  const top=Math.max(12,Math.min(preferredTop,innerHeight-box.height-12));
  tip.style.left=left+"px";
  tip.style.top=top+"px";
  tip.dataset.placement=beside ? "right" : "below";
  tip.style.setProperty("--tip-arrow-x",Math.max(16,Math.min(rect.left+rect.width/2-left,box.width-16))+"px");
  tip.style.setProperty("--tip-arrow",Math.max(14,Math.min(rect.top+rect.height/2-top-5,box.height-24))+"px");
}

function delayMenuTooltipHide() {
  clearTimeout(menuTooltipTimer);
  menuTooltipTimer=setTimeout(hideMenuTooltip,180);
}

document.addEventListener("pointerover",event => {
  if (event.pointerType==="touch") return;
  const target=event.target.closest(".location-info[data-menu-tip],.staff-activity-control[data-menu-tip],.instruction-control[data-menu-tip]");
  if (target) showMenuTooltip(target);
  else if (event.target.closest("#menuTooltip")) clearTimeout(menuTooltipTimer);
});
document.addEventListener("pointerout",event => {
  const target=event.target.closest(".sidebar button[data-menu-tip],.location-info[data-menu-tip],.staff-activity-control[data-menu-tip],.instruction-control[data-menu-tip],#menuTooltip");
  if (target && !target.contains(event.relatedTarget)) delayMenuTooltipHide();
});
let scrolledSincePointerDown=false;
document.addEventListener("pointerdown",() => { scrolledSincePointerDown=false; },true);
document.addEventListener("scroll",() => { scrolledSincePointerDown=true; },true);

function onScrollbar(event) {
  if (scrolledSincePointerDown) return true;
  const el=event.target;
  if (!(el instanceof HTMLElement) || el===document.documentElement) return false;
  return (el.scrollHeight>el.clientHeight && event.offsetX>=el.clientWidth) ||
    (el.scrollWidth>el.clientWidth && event.offsetY>=el.clientHeight);
}

document.addEventListener("focusin",event => {
  const picker=$("actPlacePicker");
  if (picker && event.target!==modal && !picker.contains(event.target)) closePlaceOptions();
  const target=event.target.closest(".sidebar button[data-menu-tip],.location-info[data-menu-tip],.staff-activity-control[data-menu-tip],.instruction-control[data-menu-tip]");
  if (target) showMenuTooltip(target);
});
document.addEventListener("focusout",event => {
  if (menuTooltipTarget && menuTooltipTarget.contains(event.target)) hideMenuTooltip();
});
document.addEventListener("keydown",event => {
  if (event.key==="Escape") hideMenuTooltip();
  const picker=$("actPlacePicker");
  if (!picker || !picker.contains(event.target)) return;
  const list=$("actPlaceOptions"),trigger=$("actPlaceTrigger");
  if (event.key==="Escape" && !list.hidden) {
    event.preventDefault();
    closePlaceOptions(true);
    return;
  }
  if (!["ArrowDown","ArrowUp","Home","End"].includes(event.key)) return;
  event.preventDefault();
  if (list.hidden) { openPlaceOptions(); return; }
  const options=[...list.querySelectorAll('[role="option"]')];
  const index=options.indexOf(document.activeElement);
  const next=event.key==="Home" ? 0 : event.key==="End" ? options.length-1 :
    (index+(event.key==="ArrowDown"?1:-1)+options.length)%options.length;
  options[next]?.focus();
});
document.addEventListener("scroll",() => {
  const focused=document.activeElement?.closest(".sidebar button[data-menu-tip],.location-info[data-menu-tip],.staff-activity-control[data-menu-tip],.instruction-control[data-menu-tip]");
  const hovered=menuTooltipTarget?.matches(":hover") ? menuTooltipTarget : null;
  if (hovered || focused) showMenuTooltip(hovered || focused);
  else hideMenuTooltip();
},true);
window.addEventListener("resize",hideMenuTooltip);

/* ---------- Händelser ---------- */

document.addEventListener("click",async event => {
  const picker=$("actPlacePicker");
  if (picker && !picker.contains(event.target) && !onScrollbar(event)) closePlaceOptions();
  const clockTrigger=event.target.closest(".clock-trigger");
  if (clockTrigger) {
    const input=clockTrigger.closest(".clock-control").querySelector(".clock-value");
    if (activeClock?.input===input) closeClockPicker(true);
    else openClockPicker(input);
    return;
  }
  const target=event.target.closest("button[data-action]");
  if (!target) {
    // Länken har ett eget beteende; klicket får inte öppna platskortets modal.
    if (event.target.closest(".place-maps-link")) return;
    const card=event.target.closest("[data-open-activity],[data-open-staffing],[data-open-person],[data-open-place]");
    if (card && !event.target.closest(".location-info")) {
      if (card.dataset.openStaffing) assignActivity(card.dataset.openStaffing);
      else if (card.dataset.openActivity) editActivity(card.dataset.openActivity);
      else if (card.dataset.openPerson) personSchedule(card.dataset.openPerson);
      else showPlaceOverview(card.dataset.openPlace);
    }
    return;
  }

  const action=target.dataset.action;
  const id=target.dataset.id;
  if (target.closest(".sidebar")) hideMenuTooltip();

  try {
    if (action==="retry-firebase") {await initializeFirebase();return;}
    if (!cloud) return;
    if (action==="directory-import") {showPeopleDirectory("import");return;}
    if (action==="directory-manage") {showPeopleDirectory("manage");return;}
    if (action==="directory-new") {editDirectoryPerson();return;}
    if (action==="directory-edit") {editDirectoryPerson(id);return;}
    if (action==="directory-delete") {deleteDirectoryPerson(id);return;}
    if (action==="toggle-place-options") {
      if ($("actPlaceOptions").hidden) openPlaceOptions();
      else closePlaceOptions();
    }
    if (action==="choose-place") chooseActivityPlace(id);
    if (action==="edit-instructions") editActivityInstructions();
    if (action==="navigate") navigate(id);
    if (action==="open-mobile") {openMobileVersion();return;}
    
    if (action==="close") closeDialog();
    if (action==="help") showHelp();
    if (action==="copy-report") await copyWeekendReport();
    if (action==="select-report") selectWeekendReport();
	
    if (action==="people-day-filter") {
      ui.peopleDay=id==="all"?null:Number(id);
      if (ui.peopleDay===null) ui.showPeopleGantt=false;
      render();
      document.querySelector(`[data-action="people-day-filter"][data-id="${id}"]`)?.focus();
    }
    if (action==="people-view") {
      if (ui.peopleDay===null) return;
      ui.showPeopleGantt=id==="gantt";
      render();
      document.querySelector(`[data-action="people-view"][data-id="${id}"]`)?.focus();
    }
    if (action==="activity-day-filter") {
      ui.activityDays=id==="all"?[]:[Number(id)];
      render();
      document.querySelector(`[data-action="activity-day-filter"][data-id="${id}"]`)?.focus();
    }
    if (action==="activity-view") {
      ui.showActivityGantt=id==="gantt";
      render();
      document.querySelector(`[data-action="activity-view"][data-id="${id}"]`)?.focus();
    }
    if (action==="staffing-gap-filter") {
      ui.onlyGaps=id==="gaps";
      document.querySelectorAll('[data-action="staffing-gap-filter"]').forEach(item =>
        item.setAttribute("aria-pressed",String(item.dataset.id===(ui.onlyGaps?"gaps":"all"))));
      $("staffingCards").innerHTML=staffingCards();
    }
    if (action==="staffing-day-filter") {
      ui.staffingDays=id==="all"?[]:[Number(id)];
      document.querySelectorAll('[data-action="staffing-day-filter"]').forEach(item => item.setAttribute("aria-pressed",String(item.dataset.id==="all"?!ui.staffingDays.length:ui.staffingDays.includes(Number(item.dataset.id)))));
      $("staffingCards").innerHTML=staffingCards();
      const badge=document.querySelector('[data-action="navigate"][data-id="staffing"] .badge');
      if (badge) badge.textContent=navigationStaffingPercentage();
    }
    if (action==="history-bank") {ui.historyQuery="";await refreshHistoricalSources();showHistoryBank();}
	if (action==="clear-activities") clearActivities();
    if (action==="clear-people") clearPeople();
    if (action==="history-year") showHistoryBank(Number(id));
    if (action==="history-deselect-all") {
      modal.querySelectorAll('input[name="historySelection"]:checked').forEach(box => { box.checked=false; });
      updateHistorySelection();
    }
    if (action==="history-select-all") {
      modal.querySelectorAll('.history-activity:not([hidden]) input[name="historySelection"]:not(:disabled)').forEach(box => { box.checked=true; });
      updateHistorySelection();
    }
    if (action==="history-import-one") await importHistoricalActivities(Number(target.dataset.year),[id]);
    if (action==="history-import-all") await importHistoricalActivities(Number(target.dataset.year),[...modal.querySelectorAll('.history-activity:not([hidden]) input[name="historySelection"]:not(:disabled)')].map(box => box.value));
    if (action==="edit-activity") {
      // Läs vald dag innan den gamla modalen ersätts.
      const tab=target.closest(".edit-activity-control")
        ? modal.querySelector('.pass-day-tab[role="tab"][aria-selected="true"]')
        : null;
      const requestedDay=target.dataset.day;
      editActivity(id,/^[012]$/.test(requestedDay || "")?Number(requestedDay):
        (tab?Number(tab.dataset.day):null));
    }
    if (action==="edit-person") editPerson(id);
    if (action==="bulk-hours") editBulkAvailability();
    if (action==="manage-activity-places") manageActivityPlaces();
    if (action==="return-activity") returnToActivityPlaces();
    if (action==="manage-edit-place") {activityPlaceScreen="edit";editPlace(id);}
    if (action==="edit-place") editPlace(id);
    if (action==="person-schedule") personSchedule(id);
    if (action==="staff-person-activity") {
      // Behåll arbetsdagen från personöversikten när bemanningsmodalen öppnas.
      const requestedDay=target.dataset.day;
      assignActivity(id,/^[012]$/.test(requestedDay || "")?Number(requestedDay):undefined);
    }
    if (action==="shift") showShift(id);
    if (action==="staff-activity") {
      if (target.disabled) return;
      // I redigeringsmodalen hålls aktiv dag i passredigerarens tillstånd.
      const day=$("modalForm")?._activityEditor?.activeDay;
      closeDialog();
      assignActivity(id,day);
    }
    if (action==="delete-activity-options") deleteActivityOptions(id);
    if (action==="delete-activity-day") await deleteActivityDay(id,Number(target.dataset.day));
    if (action==="delete-activity-all") await deleteActivityEntirely(id);

    if (action==="add-requirement") {
      const day=Number(target.dataset.day);
      const rows=modal.querySelector(`[data-requirement-day="${day}"] .req-day-rows`);
      const previousEnd=rows.lastElementChild?.querySelector(".req-end").value || "";
      rows.insertAdjacentHTML("beforeend",requirementRow({day,start:previousEnd}));
      syncRequirementGroups();
      rows.lastElementChild.scrollIntoView({block:"nearest"});
      rows.lastElementChild.querySelector(".clock-trigger").focus({preventScroll:true});
    }
    if (action==="copy-day-periods") copyDayPeriods(Number($("copySourceDay").value),Number($("copyTargetDay").value));
    if (action==="confirm-copy-periods") copyDayPeriods(Number(target.dataset.day),Number(target.dataset.targetDay),true);
    if (action==="cancel-copy-passes") $("copyPassConfirm").innerHTML="";
    if (action==="remove-requirement") {
      target.closest("[data-requirement-id]").remove();
      syncRequirementGroups();
    }

    if (action==="assign") {
      assignActivity(id);
    }
    if (action==="edit-shift") {
      const shift = plan.assignments.find(s => s.id === id);
      if (shift) assignActivity(shift.activityId, shift.day);
    }
    if (action==="edit-break") addBreak(id);

    if (action==="relief") {
      const shift=plan.assignments.find(s => s.id===id);
      const pause=shift?.breaks.find(b => b.id===target.dataset.break);
      if (pause) assignActivity(
        shift.activityId,shift.day,pause.start,pause.end,"","relief",
        "Avlöser "+personName(shift.personId)+" för "+(pause.type || "rast").toLowerCase()
      );
    }

    if (action==="remove-break") {
      const breakId=target.dataset.break;
      await commit(data => {
        const shift=data.assignments.find(s => s.id===id);
        if (!shift) throw Error("Passet finns inte längre.");
        shift.breaks=shift.breaks.filter(b => b.id!==breakId);
      },"Rasten har tagits bort. Eventuell avlösning ligger kvar som ett eget pass.");
      showShift(id);
    }

    if (action.startsWith("delete-")) deleteItem(action.slice(7),id);
    if (action==="export-json") exportJSON();
    if (action==="export-slim") exportSlimJSON();
    if (action==="export-csv") exportCSV();
    if (action==="import") importJSON();
    
    
    if (action==="disconnect") await disconnectFirebase();
  } catch (error) {
    showError(error);
  }
});

document.addEventListener("keydown",event => {
  const card=event.target.closest("[data-open-staffing],[data-open-person],[data-open-place]");
  if (!card || event.target!==card || (event.key!=="Enter" && event.key!==" ")) return;
  event.preventDefault();
  if (card.dataset.openStaffing) assignActivity(card.dataset.openStaffing);
  else if (card.dataset.openPerson) personSchedule(card.dataset.openPerson);
  else showPlaceOverview(card.dataset.openPlace);
});

document.addEventListener("input",event => {
  const target=event.target;

  if (target.id==="historySearch") {
    ui.historyQuery=target.value;
    filterHistoryActivities();
  }
  if (target.id==="activitySearch") {
    ui.query=target.value;
    $("activityResults").innerHTML=activityResults();
  }
  if (target.id==="staffingSearch") {
    ui.query=target.value;
    $("staffingCards").innerHTML=staffingCards();
  }
  if (target.id==="peopleSearch") {
    ui.peopleQuery=target.value;
    $("peopleResults").innerHTML=peopleResults();
  }
  if (target.id==="placesSearch") {
    ui.placesQuery=target.value;
    $("placeCards").innerHTML=placeCards();
  }
});

document.addEventListener("change",async event => {
  const target=event.target;
  if (target.classList.contains("plan-year-select")) {
    target.disabled=true;
    try { await switchPlanningYear(Number(target.value)); }
    catch(error) { target.value=String(plan.year); toast(error.message || "Kunde inte byta planeringsår."); }
    finally { target.disabled=false; }
    return;
  }

  if (target.id==="activitySort") {
    ui.activitySort=target.value;
    $("activityResults").innerHTML=activityResults();
  }
  if (target.id==="peopleSort") {
    ui.peopleSort=target.value;
    $("peopleResults").innerHTML=peopleResults();
  }
  if (target.id==="staffingSort") {
    ui.staffingSort=target.value;
    $("staffingCards").innerHTML=staffingCards();
  }
  if (target.id==="historySort") {
    ui.historySort=target.value;
    const list=modal.querySelector(".history-list"),edition=historicalEdition(ui.bankYear);
    const cards=new Map([...list.children].map(card => [card.dataset.historyActivity,card]));
    for (const activity of sortActivities(edition.activities,ui.historySort)) list.append(cards.get(activity.id));
  }
  if (target.name==="historySelection") updateHistorySelection();
  if (target.id==="copySourceDay") { updateCopyPeriodTools(); $("copyPassConfirm").innerHTML=""; }
  if (target.id==="copyTargetDay") $("copyPassConfirm").innerHTML="";
  if (target.id==="personPhone") target.value=formatPhone(target.value);
  if (target.classList.contains("av-check")) {
    const row=target.closest(".avrow");
    row.querySelectorAll(".av-start,.av-end").forEach(input => setClockDisabled(input,!target.checked));
    row._syncEndTime?.();
  }
});

modal.addEventListener("close",() => {releaseGanttTooltip();closeClockPicker();});

modal.addEventListener("click",event => {
  if (event.target!==modal) return;
  if (activeClock) {
    const picker=activeClock.panel.getBoundingClientRect();
    if (event.clientX>=picker.left && event.clientX<=picker.right &&
        event.clientY>=picker.top && event.clientY<=picker.bottom) return;
  }
  const rect=modal.getBoundingClientRect();
  if (event.clientX<rect.left || event.clientX>rect.right ||
      event.clientY<rect.top || event.clientY>rect.bottom) closeDialog();
});

render();
await initializeFirebase();
</script>
