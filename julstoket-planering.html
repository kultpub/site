        personId => change(personId,plan.people.find(person => person.id===personId)?.name || ""),change,
        personId=>groupCandidateReason(activity,group,draft,personId));
      const container=$(id),input=container.querySelector(".person-type-input");
      container._setPersonValue(value.personId,value.text);
      input.setAttribute("aria-label",`${DAYS[group.day]}, ${label}, namn`);
      if (value.mixed) input.setAttribute("aria-describedby","staffingMixed-"+index);
    });
    showConflicts();
  });
}

function validateTimelineChoices(activity,people) {
  const choices=activity.staffingChoices;
  if (!choices) return;
  if (!activity.staffingPattern || choices.schemaVersion!==1 || !Array.isArray(choices.defaults) || !Array.isArray(choices.overrides)) throw Error("Namnvalen har fel format.");
  const rows=patternTimelineRows(activity),defaults=new Set(),overrides=new Set();
  choices.defaults=choices.defaults.filter(value => activity.staffingPattern.participants.some(person => person.id===value.participantId));
  choices.overrides=choices.overrides.filter(value => rows.some(row => row.id===value.rowId));
  for (const value of choices.defaults) {
    if (defaults.has(value.participantId) || typeof value.personId!=="string") throw Error("Kontrollera namnvalen för de numrerade passen.");
    defaults.add(value.participantId);
    if (!rows.some(row => row.id===value.sourceRowId && row.participantId===value.participantId)) value.sourceRowId=rows.find(row => row.participantId===value.participantId)?.id || "";
    if (value.personId && !people.some(person => person.id===value.personId)) value.personId="";
  }
  for (const value of choices.overrides) {
    if (overrides.has(value.rowId) || typeof value.personId!=="string") throw Error("Kontrollera radernas namnval.");
    overrides.add(value.rowId);
    if (value.personId && !people.some(person => person.id===value.personId)) value.personId="";
  }
}

/* ---------- Kontroll av arbetstider och bemanning ---------- */

function activeSegments(shift) {
  let result=(shift.coveragePeriods || [{start:shift.start,end:shift.end}]).map(period => ({
    start:Math.max(minute(shift.start),minute(period.start)),end:Math.min(minute(shift.end),minute(period.end))
  })).filter(period => period.start<period.end);

  for (const pause of shift.breaks || []) {
    const start=minute(pause.start),end=minute(pause.end);
    result=result.flatMap(segment => {
      if (start>=segment.end || end<=segment.start) return [segment];
      return [
        {start:segment.start,end:Math.max(segment.start,start)},
        {start:Math.min(segment.end,end),end:segment.end}
      ].filter(part => part.start<part.end);
    });
  }

  return result;
}

function assignmentParticipantId(data,shift) {
  const activity=data.activities.find(activity => activity.id===shift.activityId);
  return activity?.staffingPattern?.shifts.find(source => source.id===shift.patternShiftId)?.participantId ||
    shift.patternParticipantId || shift.id;
}

function assignmentPassId(shift) {
  return shift.patternShiftId || shift.patternParticipantId || shift.id;
}

function adjacentStaffingHandover(data,left,right) {
  if (left.id===right.id || left.personId!==right.personId || left.day!==right.day || left.activityId!==right.activityId ||
      assignmentPassId(left)===assignmentPassId(right) ||
      // Två avlösningar kant i kant får bemannas av samma person. Regeln gäller när minst ett av dem är ett pass.
      (left.kind==="relief" && right.kind==="relief")) return null;
  const before=left.end===right.start?left:right.end===left.start?right:null;
  if (!before) return null;
  const after=before===left?right:left;
  return {before,after,time:before.end,key:JSON.stringify([before.activityId,before.day,before.personId,
    assignmentPassId(before),assignmentPassId(after),before.end])};
}

function staffingHandovers(data) {
  const found=new Map();
  for (let i=0;i<data.assignments.length;i++) {
    for (let j=i+1;j<data.assignments.length;j++) {
      const handover=adjacentStaffingHandover(data,data.assignments[i],data.assignments[j]);
      if (handover) found.set(handover.key,handover);
    }
  }
  return [...found.values()];
}

function staffingHandoverReason(data,handover) {
  const {before,after,time}=handover,activity=data.activities.find(activity => activity.id===before.activityId);
  const label=shift => activity?.staffingPattern?patternPersonLabel(activity,shift.day,assignmentParticipantId(data,shift)):"Passet";
  return `${activity?.title || "Aktiviteten"}, ${DAYS[before.day].toLocaleLowerCase("sv-SE")}: ${label(before)} ${before.start}–${before.end} och ${label(after)} ${after.start}–${after.end} möts kl. ${time}. De måste bemannas av olika personer.`;
}

function personReason(data,personId,day,start,end,ignoreId="",{allowExistingHandovers=false,allowedHandovers=null}={}) {
  const person=data.people.find(person => person.id===personId);
  if (!person) return "Personen finns inte.";
  if (!person.availability.length) return "Arbetstider är inte registrerade.";
  if (!person.availability.some(range => range.day===day && range.start<=start && range.end>=end)) return "Utanför registrerad arbetstid.";

  // Hela bokningen är upptagen, även pauser och luckor mellan avlösningsperioder.
  const booked=data.assignments.filter(shift => shift.personId===personId && shift.day===day && shift.id!==ignoreId);
  const clash=booked.find(shift => overlaps(shift,{start,end}));
  if (clash) {
    const pause=(clash.breaks || []).find(pause => overlaps(pause,{start,end}));
    const activity=data.activities.find(activity => activity.id===clash.activityId)?.title || "annat arbete";
    return (`Redan bokad på ${activity} ${DAYS[day].toLocaleLowerCase("sv-SE")} ${clash.start}–${clash.end}. Krock ${start>clash.start?start:clash.start}–${end<clash.end?end:clash.end}. `+
      (pause?`Pausen ${pause.start}–${pause.end} är också bokad tid.`:"")).trimEnd();
  }

  if (!allowExistingHandovers) {
    const saved=data.assignments.find(shift => shift.id===ignoreId);
    if (saved) {
      const candidate={...saved,personId,day,start,end};
      const handover=booked.map(other => adjacentStaffingHandover(data,candidate,other))
        .find(handover => handover && !allowedHandovers?.has(handover.key));
      if (handover) return staffingHandoverReason(data,handover);
    }
  }
  return "";
}

function planningDuration(minutes) {
  const whole=Math.floor(minutes/60),rest=minutes%60;
  return rest ? (whole?whole+" h ":"")+rest+" min" : whole+" h";
}

function personPlanning(data,personId,day,ignoreId="") {
  const person=data.people.find(p => p.id===personId);
  const working=(person?.availability || []).filter(r => r.day===day)
    .sort((a,b) => a.start.localeCompare(b.start));
  const shifts=data.assignments.filter(s =>
    s.personId===personId && s.day===day && s.id!==ignoreId
  ).sort((a,b) => a.start.localeCompare(b.start));
  let free=working.map(r => ({start:minute(r.start),end:minute(r.end)}));

  for (const shift of shifts) {
    const start=minute(shift.start),end=minute(shift.end);
    free=free.flatMap(range => {
      if (start>=range.end || end<=range.start) return [range];
      return [
        {start:range.start,end:Math.max(range.start,start)},
        {start:Math.min(range.end,end),end:range.end}
      ].filter(r => r.start<r.end);
    });
  }

  const merged=[];
  for (const range of free) {
    const previous=merged.at(-1);
    if (previous && previous.end===range.start) previous.end=range.end;
    else merged.push({...range});
  }
  const total=working.reduce((sum,r) => sum+duration(r.start,r.end),0);
  const remaining=merged.reduce((sum,r) => sum+r.end-r.start,0);
  return {
    working,shifts,total,remaining,booked:total-remaining,
    free:merged.map(r => ({start:time(r.start),end:time(r.end)}))
  };
}

/* ---------- Pauser: valfritt avlösningsbehov ---------- */
function coversInterval(ranges,start,end) {
  let cursor=start;
  for (const range of ranges.slice().sort((a,b)=>a.start.localeCompare(b.start))) {
    if (range.start<=cursor && range.end>cursor) cursor=range.end;
  }
  return cursor>=end;
}
function shiftWorkRanges(shift) {
  return activeSegments(shift).map(range=>({start:time(range.start),end:time(range.end)}));
}
function pauseReliefContext(activity,owner,pause) {
  const shifts=activity.staffingPattern?.shifts || [];
  const others=shifts.filter(shift=>shift.day===owner.day && shift.kind!=="relief" &&
    shift.participantId!==owner.participantId && validRange(shift) && overlaps(shift,pause));
  const eligible=coversInterval(others.flatMap(shiftWorkRanges),pause.start,pause.end);
  const relief=shifts.filter(shift=>shift.day===owner.day && shift.kind==="relief");
  const reliefRanges=relief.flatMap(shift=>{
    const work=shiftWorkRanges(shift);
    if (!shift.reliefPeriods?.length) return work;
    return shift.reliefPeriods.filter(period=>period.breakId===pause.id).flatMap(period=>work.map(range=>({
      start:range.start>period.start?range.start:period.start,end:range.end<period.end?range.end:period.end
    })).filter(validRange));
  });
  const covered=coversInterval(reliefRanges,pause.start,pause.end);
  const signature=JSON.stringify([owner.day,owner.start,owner.end,pause.start,pause.end,
    others.map(shift=>[shift.id,shift.start,shift.end,(shift.breaks || []).map(p=>[p.start,p.end])]).sort((a,b)=>a[0].localeCompare(b[0]))]);
  const choice=pause.reliefChoice?.signature===signature && typeof pause.reliefChoice.required==="boolean"?pause.reliefChoice.required:null;
  return {eligible,covered,signature,choice};
}
function unansweredPauses(activity) {
  return (activity.staffingPattern?.shifts || []).filter(shift=>shift.kind!=="relief").flatMap(owner=>
    owner.breaks.filter(pause=>validRange(pause) && validRange(owner) &&
      pause.start>=owner.start && pause.end<=owner.end)
      .map(pause=>({owner,pause,...pauseReliefContext(activity,owner,pause)})))
    .filter(item=>!item.covered && item.choice===null);
}
function choosePauseRelief(activity,owner,pause,required) {
  pause.reliefChoice={signature:pauseReliefContext(activity,owner,pause).signature,required};
  if (!required) return;
  const pattern=activity.staffingPattern,participantId=uid();
  pattern.participants.push({id:participantId,label:"Avlösning"});
  pattern.shifts.push({id:uid(),participantId,requirementId:owner.requirementId,
    day:owner.day,start:pause.start,end:pause.end,kind:"relief",breaks:[],
    reliefPeriods:[{breakId:pause.id,participantId:owner.participantId,start:pause.start,end:pause.end}]});
}
// Håll kopplade avlösningspass synkroniserade när en paus ändrar tid.
// Ändra även fälten i formuläret; annars skriver nästa förhandsvisning
// tillbaka deras gamla tider i modellen.
function synchronizePauseReliefTimes(editor,pattern) {
  const before=editor.model;
  for (const owner of pattern.shifts.filter(shift=>shift.kind!=="relief")) {
    const oldOwner=before.shifts.find(shift=>shift.id===owner.id);
    for (const pause of owner.breaks) {
      const oldPause=oldOwner?.breaks.find(item=>item.id===pause.id);
      if (!oldPause || oldPause.start===pause.start && oldPause.end===pause.end) continue;
      for (const relief of pattern.shifts.filter(shift=>shift.kind==="relief" &&
        (shift.reliefPeriods || []).some(period=>period.breakId===pause.id))) {
        for (const period of relief.reliefPeriods) {
          if (period.breakId===pause.id) { period.start=pause.start;period.end=pause.end; }
        }
        if (relief.reliefPeriods.length===1) {
          relief.start=pause.start;relief.end=pause.end;
        } else {
          const starts=relief.reliefPeriods.map(period=>period.start);
          const ends=relief.reliefPeriods.map(period=>period.end);
          relief.start=starts.reduce((a,b)=>a<b?a:b);
          relief.end=ends.reduce((a,b)=>a>b?a:b);
        }
        const row=modal.querySelector(`[data-editor-shift="${relief.id}"]`);
        for (const [selector,value] of [[".pass-start",relief.start],[".pass-end",relief.end]]) {
          const input=row?.querySelector(selector);
          if (input) { input.value=value;refreshClockDisplay(input); }
        }
      }
    }
  }
  // Ett tidigare Ja/Nej gäller även när pausen finjusteras.
  const activity={staffingPattern:pattern};
  for (const owner of pattern.shifts.filter(shift=>shift.kind!=="relief")) {
    for (const pause of owner.breaks) {
      if (typeof pause.reliefChoice?.required==="boolean" && validRange(pause)) {
        pause.reliefChoice.signature=pauseReliefContext(activity,owner,pause).signature;
      }
    }
  }
  editor.model=pattern;
}

function renderPauseQuestions(editor) {
  const host=$("pauseReliefQuestions");if (!host) return;
  const activity={staffingPattern:readPassEditorModel(editor)};
  const pending=unansweredPauses(activity);
  host.innerHTML=pending.map(({owner,pause})=>`<section class="pause-question">
    <p><strong>${esc(DAYS[owner.day])} · ${esc(patternPersonLabel(activity,owner.day,owner.participantId))}</strong></p>
    <p>Behövs avlösare för tiden ${esc(pause.start)}–${esc(pause.end)}?</p>
    <div class="actions"><button type="button" class="btn small" data-pause-choice="yes" data-owner="${esc(owner.id)}" data-pause="${esc(pause.id)}">Ja</button>
    <button type="button" class="btn small" data-pause-choice="no" data-owner="${esc(owner.id)}" data-pause="${esc(pause.id)}">Nej</button></div></section>`).join("");
  host.hidden=!pending.length;
  host.querySelectorAll("[data-pause-choice]").forEach(button=>button.onclick=()=>{
    try {
    const activity=readActivityDraft(editor.original,editor.original.id || uid());
    const owner=activity.staffingPattern.shifts.find(shift=>shift.id===button.dataset.owner);
    const pause=owner.breaks.find(item=>item.id===button.dataset.pause);
    choosePauseRelief(activity,owner,pause,button.dataset.pauseChoice==="yes");
    editor.model=activity.staffingPattern;renderPassEditor(editor);refreshActivityGanttPreview();
    } catch(error) {showError(error);}
  });
}
async function reviewPauseRelief(activity) {
  for (const item of unansweredPauses(activity)) {
    const required=await new Promise(resolve=>{
      const dialog=document.createElement("dialog");dialog.className="pause-review-modal";
      dialog.setAttribute("aria-labelledby","pauseReviewTitle");
      dialog.innerHTML=`<div class="dialog-head"><h2 id="pauseReviewTitle">Avlösning under paus</h2></div>
        <div class="dialog-body"><p>${esc(DAYS[item.owner.day])} · ${esc(patternPersonLabel(activity,item.owner.day,item.owner.participantId))}</p>
        <p>Behövs avlösare för tiden ${esc(item.pause.start)}–${esc(item.pause.end)}?</p></div>
        <div class="dialog-foot"><button type="button" class="btn" data-answer="cancel">Avbryt</button><button type="button" class="btn" data-answer="no">Nej</button><button type="button" class="btn primary" data-answer="yes">Ja</button></div>`;
      const finish=value=>{dialog.close();dialog.remove();resolve(value);};
      dialog.addEventListener("click",event=>{const answer=event.target.closest("[data-answer]")?.dataset.answer;if(answer)finish(answer==="cancel"?null:answer==="yes");});
      dialog.addEventListener("cancel",event=>{event.preventDefault();finish(null);});
      document.body.append(dialog);dialog.showModal();dialog.querySelector('[data-answer="yes"]').focus();
    });
    if (required===null) return false;
    choosePauseRelief(activity,item.owner,item.pause,required);
  }
  activity.recommendedPeoplePerDay=Math.max(0,...dailyStaffingCounts(activity).map(day=>day.total));
  return true;
}

function coverage(activityId,day,data=plan) {
  const activity=data.activities.find(a => a.id===activityId);
  if (!activity) return [];

  const requirements=activity.requirements.filter(r => r.day===day);
  const segments=data.assignments
    .filter(s => s.activityId===activityId && s.day===day)
    .flatMap(s => activeSegments(s).map(r => ({...r,personId:s.personId})));

  const points=[...new Set([
    ...requirements.flatMap(r => [minute(r.start),minute(r.end)]),
    ...segments.flatMap(r => [r.start,r.end])
  ])].sort((a,b) => a-b);

  const result=[];

  for (let i=0;i<points.length-1;i++) {
    const start=points[i],end=points[i+1];
    const baseNeed=requirements.find(r =>
      minute(r.start)<=start && minute(r.end)>=end
    )?.count || 0;

    if (!baseNeed) continue;
    // Ett uttryckligt Nej tillåter paus utan ersättare, även vid ensamarbete.
    // Före svar krävs fortfarande en annan arbetande person för automatisk täckning.
    const assigned=data.assignments.filter(shift=>shift.activityId===activityId && shift.day===day);
    const waived=new Set();
    for (const owner of activity.staffingPattern?.shifts || []) {
      if (owner.day!==day || owner.kind==="relief") continue;
      for (const pause of owner.breaks) {
        if (minute(pause.start)>start || minute(pause.end)<end) continue;
        const context=pauseReliefContext(activity,owner,pause);
        if (context.covered || context.choice===true || (context.choice!==false && !context.eligible)) continue;
        const own=assigned.find(shift=>shift.patternShiftId===owner.id && minute(shift.start)<=start && minute(shift.end)>=end);
        if (!own) continue;
        const other=assigned.some(shift=>shift.kind!=="relief" && shift.personId!==own.personId &&
          activeSegments(shift).some(range=>range.start<=start && range.end>=end));
        if (context.choice===false || other) waived.add(owner.id);
      }
    }
    const need=Math.max(0,baseNeed-waived.size);
    const staff=new Set(segments.filter(r =>
      r.start<=start && r.end>=end
    ).map(r => r.personId)).size;

    result.push({
      start:time(start),end:time(end),need,staff,
      missing:Math.max(0,need-staff)
    });
  }

  return result;
}

function gaps(activityId,day,data=plan) {
  const result=[];

  for (const segment of coverage(activityId,day,data).filter(r => r.missing)) {
    const previous=result.at(-1);
    if (previous && previous.end===segment.start &&
        previous.missing===segment.missing) {
      previous.end=segment.end;
    } else {
      result.push({...segment});
    }
  }

  return result;
}

function totals(day) {
  let required=0,covered=0,missing=0,gapCount=0;

  for (const activity of plan.activities) {
    for (const c of coverage(activity.id,day)) {
      const length=duration(c.start,c.end);
      required+=c.need*length;
      covered+=Math.min(c.staff,c.need)*length;
      missing+=c.missing*length;
    }
    gapCount+=gaps(activity.id,day).length;
  }

  return {
    required,covered,missing,gapCount,
    percent:required ? Math.round(covered/required*100) : 0
  };
}



function validatePlan(data,{normalizeRequirements=false,allowExistingHandovers=false,allowedHandovers=null}={}) {
  if (!data || data.schemaVersion!==1 ||
      !Number.isInteger(data.year) || data.year<2020 || data.year>2100) {
    throw Error("Planen har fel format eller årtal.");
  }

  const ids=new Set();
  for (const key of ["people","places","activities","assignments"]) {
    if (!Array.isArray(data[key])) throw Error("Planen saknar "+key+".");
    for (const item of data[key]) {
      if (!item || !safeId(item.id) || ids.has(item.id)) {
        throw Error("Ogiltiga eller dubbla id:n.");
      }
      ids.add(item.id);
    }
  }

  const validDay = d => Number.isInteger(d) && d>=0 && d<=2;

  for (const place of data.places) {
    if (typeof place.name!=="string" || !place.name.trim()) {
      throw Error("Platsnamn saknas.");
    }
  }

  normalizeActivityPlaces(data);
  for (const activity of data.activities) {
    const origin=activity.origin;
    if (activity.dayNotes || origin?.kind!=="historical-import") continue;
    const source=historicalEdition(origin.year).activities.find(item => item.id===origin.activityId);
    if (!source?.dayNotes || !Object.keys(source.dayNotes).length) continue;
    const oldMerged=[source.notes || "",...new Set(Object.values(source.dayNotes).filter(Boolean))].filter(Boolean).join("\n\n");
    if (activity.notes===oldMerged) {
      activity.notes=source.notes || "";
      activity.dayNotes=clone(source.dayNotes);
    }
  }
  restoreHistoricalPassBoundaries(data);

  for (const person of data.people) {
    if (typeof person.name!=="string" || !person.name.trim() ||
        !Array.isArray(person.availability)) {
      throw Error("Namn eller arbetstider saknas för en person.");
    }
    person.phone=formatPhone(person.phone);
    for (const range of person.availability) {
      if (!validDay(range.day) || !validRange(range)) {
        throw Error("Kontrollera arbetstiderna för "+person.name+".");
      }
      if (person.availability.some(other =>
        other!==range && other.day===range.day && overlaps(range,other)
      )) throw Error("Överlappande arbetstider för "+person.name+".");
    }
  }

  const requirementIds=new Set();
  const breakIds=new Set();

  for (const activity of data.activities) {
    if (typeof activity.title!=="string" || !activity.title.trim() ||
        (activity.placeId!==null && !data.places.some(p => p.id===activity.placeId)) ||
        !Array.isArray(activity.requirements) || !activity.requirements.length) {
      throw Error("Aktiviteten måste ha namn, tider och en plats eller valet Allmänt.");
    }

    for (const range of activity.requirements) {
      if (!safeId(range.id) || requirementIds.has(range.id)) {
        throw Error("Ogiltiga eller dubbla tidsperioder.");
      }
      requirementIds.add(range.id);

      if (!validDay(range.day) || !validRange(range) ||
          !Number.isInteger(range.count) || range.count<1 || range.count>50) {
        throw Error("Kontrollera tider och personer för "+activity.title+".");
      }
      if (activity.requirements.some(other =>
        other!==range && other.day===range.day && overlaps(range,other)
      )) throw Error("Behovstiderna överlappar för "+activity.title+".");
    }

    normalizePatternNumbers(activity);
    validateStaffingPattern(activity);
    validateTimelineChoices(activity,data.people);
    // Separata tidsperioder bevaras, även vid samma personbehov.

  }

  for (const shift of data.assignments) {
    const activity=data.activities.find(a => a.id===shift.activityId);

    if (!activity || !validDay(shift.day) || !validRange(shift) ||
        !["ordinary","relief"].includes(shift.kind) || !Array.isArray(shift.breaks)) {
      throw Error("Ett pass har ogiltiga uppgifter.");
    }

    if (shift.kind==="relief" && shift.coveragePeriods===undefined) {
      const source=activity.staffingPattern?.shifts.find(item => item.id===shift.patternShiftId);
      if (source?.reliefPeriods) shift.coveragePeriods=source.reliefPeriods.filter(period => overlaps(period,shift)).map(period => ({
        start:period.start>shift.start?period.start:shift.start,end:period.end<shift.end?period.end:shift.end}));
    }
    if (shift.coveragePeriods!==undefined) {
      if (!Array.isArray(shift.coveragePeriods)) throw Error("Passets bemanningsperioder har fel format.");
      for (const period of shift.coveragePeriods) {
        if (!validRange(period) || period.start<shift.start || period.end>shift.end ||
            shift.coveragePeriods.some(other => other!==period && overlaps(period,other))) throw Error("Kontrollera avlösningens bemanningsperioder.");
      }
    }
    let cursor=shift.start;
    const requirements=activity.requirements
      .filter(r => r.day===shift.day)
      .sort((a,b) => a.start.localeCompare(b.start));

    for (const range of requirements) {
      if (range.start<=cursor && range.end>cursor) cursor=range.end;
    }
    if (cursor<shift.end) {
      throw Error("Passet ligger utanför aktivitetens behovstider.");
    }

    const reason=personReason(
      data,shift.personId,shift.day,shift.start,shift.end,shift.id,{allowExistingHandovers,allowedHandovers}
    );
    if (reason) {
      throw Error(
        (data.people.find(p => p.id===shift.personId)?.name || "Person")+": "+reason
      );
    }

    for (const pause of shift.breaks) {
      if (!safeId(pause.id) || breakIds.has(pause.id)) {
        throw Error("Ogiltiga eller dubbla raster.");
      }
      breakIds.add(pause.id);

      if (!validRange(pause) || pause.start<shift.start || pause.end>shift.end) {
        throw Error("Rasten måste ligga inom passet.");
      }
      if (shift.breaks.some(other => other!==pause && overlaps(pause,other))) {
        throw Error("Raster får inte överlappa.");
      }
    }
  }

  if (new Blob([JSON.stringify(data)]).size>850000) {
    throw Error("Planen är för stor för detta utkast.");
  }

  return data;
}

async function commit(change,message="Ändringen är sparad.",{registerPerson=null}={}) {
  if (!cloud || !cloud.auth.currentUser) throw Error("Logga in för att spara.");
  if (saving || switchingYear) throw Error("En ändring pågår redan. Försök igen.");
  const active=cloud,ref=active.ref,revision=plan.revision || 0;
  saving=true;updateSync("Sparar…");
  try {
    const next=clone(plan);
    change(next);
    if (next.year!==plan.year || next.year<2026) throw Error("Historiska årsoriginal kan inte redigeras.");
    if (!selectablePlanningYears().includes(next.year)) throw Error(`Julstöket ${next.year} är genomfört och låst. Det kan inte längre planeras.`);
    next.revision=revision+1;
    validatePlan(next,{allowedHandovers:new Set(staffingHandovers(plan).map(handover=>handover.key))});
    await active.fs.runTransaction(active.db,async transaction=>{
      const snapshot=await transaction.get(ref);
      if ((!snapshot.exists() && revision!==0) || (snapshot.exists() && (snapshot.data().revision || 0)!==revision)) {
        throw Error("Planen har ändrats av någon annan. Ladda om planen och gör ändringen igen.");
      }
      if (registerPerson) {
        const personRef=active.fs.doc(active.db,"julstokPeople",registerPerson.id);
        const existing=await transaction.get(personRef);
        if (existing.exists()) throw Error("Personen finns redan i registret.");
        transaction.set(personRef,{name:registerPerson.name,phone:registerPerson.phone});
      }
      transaction.set(ref,next);
    });
    if (cloud!==active) return;
    plan=reconcilePlaces(next);cloudStatus="";render();toast(message);
  } catch(error) {
    if (cloud===active) {cloudStatus="Ändringen kunde inte sparas. Kontrollera anslutningen och försök igen.";updateSync();}
    throw error;
  } finally {
    saving=false;
    if (cloud===active && pendingCloud) {
      if (pendingCloud.revision>plan.revision) {plan=reconcilePlaces(pendingCloud);render();}
      pendingCloud=null;
    }
    updateSync();
  }
}

// Bemanningsgraden räknas i personminuter (behov × tid) över valt dagurval.
// Den ska inte påverkas av textsökning eller filtret ”Bara luckor”.
function navigationStaffingPercentage() {
  const selectedDays=ui.staffingDays.length ? ui.staffingDays : [0,1,2];
  let required=0,covered=0;
  for (const activity of plan.activities) {
    for (const day of selectedDays) {
      for (const segment of coverage(activity.id,day)) {
        const minutes=duration(segment.start,segment.end);
        required+=segment.need*minutes;
        covered+=Math.min(segment.staff,segment.need)*minutes;
      }
    }
  }
  if (!required || !covered) return "0 %";
  if (covered>=required) return "100 %";
  return Math.round(100*covered/required)+" %";
}

// Flikantalet följer dagvalet, oberoende av textsökning, och visas bara i aktiv vy.

  if (view==="people") return plan.people.filter(person=>
    ui.peopleDay===null || person.availability.some(range=>range.day===ui.peopleDay)).length;
  if (view==="staffing") return navigationStaffingPercentage();
  return "";
}

function visibleRequirements(activity) {
  return [...activity.requirements].sort((a,b) => a.day-b.day || a.start.localeCompare(b.start));
}

function activityDays(activity) {
  return [...new Set(visibleRequirements(activity).map(r => r.day))];
}

function activityDayTimeLabel(activity, day) {
  const source = activity.staffingPattern?.shifts?.length ? activity.staffingPattern.shifts : visibleRequirements(activity);
  const ranges = source.filter(item => item.day===day && item.start && item.end)
    .sort((a,b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
  if (!ranges.length) return "";
  return `${ranges[0].start}–${ranges[ranges.length-1].end}`;
}

function sortActivities(activities, order="start", selectedDays=[]) {
  const timeValue=(activity, field) => {
    const all=activity.staffingPattern?.shifts?.length ? activity.staffingPattern.shifts : (activity.requirements || []);
    const ranges=all.filter(item => (!selectedDays.length || selectedDays.includes(item.day)) && item[field]);
    if (!ranges.length) return null;
    const times=ranges.map(item => item[field]).sort();
    return field==="start" ? times[0] : times[times.length-1];
  };
  const placeText=activity => typeof activity.place==="string" ? activity.place :
    (activity.place?.name || placeName(activity.placeId) || "");
  const nameCompare=(a,b) => a.title.localeCompare(b.title,"sv-SE") ||
    placeText(a).localeCompare(placeText(b),"sv-SE");
  return [...activities].sort((a,b) => {
    if (order==="place-az" || order==="place-za") {
      const comparison=placeText(a).localeCompare(placeText(b),"sv-SE");
      return (order==="place-za" ? -comparison : comparison) || nameCompare(a,b);
    }
    if (order==="az") return nameCompare(a,b);
    if (order==="za") return -nameCompare(a,b);
    const field=order==="end"?"end":"start",av=timeValue(a,field),bv=timeValue(b,field);
    if (av===null || bv===null) return av===bv?nameCompare(a,b):av===null?1:-1;
    return (field==="end" ? bv.localeCompare(av) : av.localeCompare(bv)) || nameCompare(a,b);
  });
}

// Dagsöversikten visar endast varje aktivitets tidigaste start och senaste slut.
function activityOverviewGantt(activities, day) {
  const rows=activities.map(activity => {
    const ranges=[...(activity.requirements || []),...(activity.staffingPattern?.shifts || [])]
      .filter(range => range.day===day && validRange(range));
    if (!ranges.length) return null;
    return {activity,start:Math.min(...ranges.map(range => minute(range.start))),
      end:Math.max(...ranges.map(range => minute(range.end)))};
  }).filter(Boolean);
  if (!rows.length) return `<div class="empty"><h3>Inga aktiviteter att visa</h3><p>Prova en annan sökning eller dag.</p></div>`;
  const start=7*60, end=22*60;
  const outside=rows.some(row => row.start<start || row.end>end);
  const span=Math.max(60,end-start),ticks=[];
  for (let value=start;value<=start+span;value+=60) ticks.push(value);
  const colors=["#327c59","#356f9a","#b46e31","#8c5d9c","#b65364","#668245"];
  return `<section class="overview-gantt" aria-label="Gantt-schema för ${DAYS[day]}">
    <div class="overview-heading"><h2>${DAYS[day]} ${dateLabel(day)}</h2>${outside?'<p class="gantt-outside-note" role="note">Tider före 07:00 eller efter 22:00 visas inte fullt ut i schemat.</p>':""}</div>
    <div class="overview-scroll" role="region" aria-label="Gantt-schema för dagens aktiviteter">
      <div class="overview-chart" style="--overview-hour-width:${60/span*100}%">
        <div class="overview-row overview-axis-row"><div class="overview-label">Aktivitet</div><div class="overview-plot"><div class="overview-axis">${ticks.map((value,index) => {
          const edge=index===0 || index===ticks.length-1;
          const visibleAt=step => edge || (value%step===0 && value-start>=step && end-value>=step);
          return `<span class="overview-tick" data-edge="${edge}" data-medium="${visibleAt(120)}" data-narrow="${visibleAt(240)}" style="left:${(value-start)/span*100}%"><span>${time(value)}</span></span>`;
        }).join("")}</div></div></div>
        ${rows.map(({activity,start:rowStart,end:rowEnd},index) => {
          const label=`${activity.title}, ${time(rowStart)}–${time(rowEnd)}`;
          const clippedStart=Math.max(start,rowStart),clippedEnd=Math.min(end,rowEnd);
          return `<div class="overview-row"><div class="overview-label overview-activity-label"><button type="button" class="overview-activity-name" data-action="edit-activity" data-id="${esc(activity.id)}">${esc(activity.title)}</button><button type="button" class="location-info overview-place-info" data-menu-tip="${esc(placeName(activity.placeId))}" data-menu-tip-plain data-tooltip-placement="below" aria-label="Plats: ${esc(placeName(activity.placeId))}">i</button></div>
            <div class="overview-plot"><div class="overview-track">${clippedEnd>clippedStart?`<span class="overview-bar" role="img" aria-label="${esc(label)}" title="${esc(label)}" style="left:${(clippedStart-start)/span*100}%;width:${(clippedEnd-clippedStart)/span*100}%;background:${colors[index%colors.length]}"></span>`:""}</div></div></div>`;
        }).join("")}
      </div>
    </div>
  </section>`;
}

function activityGanttLanes(activity,day,{data=plan,choiceForRow=null}={}) {
  const assigned=data.assignments.filter(shift => shift.activityId===activity.id && shift.day===day);
  const nameOf=shift => shift.ganttName ?? data.people.find(person => person.id===shift.personId)?.name ?? "";
  const lanes=[],used=new Set();
  if (activity.staffingPattern) {
    const rows=patternTimelineRows(activity).filter(row => row.day===day);
    for (const source of activity.staffingPattern.shifts.filter(shift => shift.day===day)) {
      const sourceRows=rows.filter(row => row.shiftId===source.id);
      const personLabel=patternPersonLabel(activity,day,source.participantId);
      let lane=lanes.find(item => item.id===source.participantId);
      if (!lane) {lane={id:source.participantId,label:personLabel,events:[]};lanes.push(lane);}
      const details=(source.reliefPeriods || []).map(period => {
        const target=patternPersonLabel(activity,day,period.participantId);
        return `Avlöser ${target} ${period.start}–${period.end}`;
      }).join(". ");
      if (choiceForRow) {
        lane.events.push(...sourceRows.map(row => ({...row,name:choiceForRow(row),details:row.kind==="relief"?details:""})));
        continue;
      }
      const shifts=assigned.filter(shift => shift.patternShiftId===source.id);
      // Visa obemannade mallrader och de verkliga passens aktuella tider och pauser.
      lane.events.push(...sourceRows.filter(row => !shifts.some(shift => shift.patternRowIds?.includes(row.id) ||
        shift.start<=row.start && shift.end>=row.end)).map(row => ({...row,name:"",details:row.kind==="relief"?details:""})));
      for (const shift of shifts) {
        used.add(shift.id);
        const actual={staffingPattern:{participants:activity.staffingPattern.participants,shifts:[{...shift,participantId:source.participantId}]}};
        lane.events.push(...patternTimelineRows(actual).map(row => {
          const template=sourceRows.find(item => item.kind===row.kind && overlaps(item,row));
          return {...row,personLabel:lane.label,event:template?.event || row.event,name:nameOf(shift),details:row.kind==="relief"?details:""};
        }));
      }
    }
  }
  // Även aktiviteter utan historisk mall och manuellt tillagda pass visas.
  const remaining=assigned.filter(item => !used.has(item.id) && !choiceForRow);
  let number=lanes.filter(lane => /^Pass\b/.test(lane.label)).length;
  let reliefNumber=lanes.filter(lane => /^Avlösning\b/.test(lane.label)).length;
  for (const shift of remaining) {
    const id=shift.ganttLaneId || shift.id;
    let lane=lanes.find(item => item.id===id);
    if (!lane) {
      const label=shift.ganttLabel || (shift.kind==="relief"?"Avlösning "+(++reliefNumber):"Pass "+(++number));
      lane={id,label,events:[]};lanes.push(lane);
    }
    const actual={staffingPattern:{participants:[{id,label:lane.label}],shifts:[{...shift,participantId:id}]}};
    lane.events.push(...patternTimelineRows(actual).map(row => ({...row,personLabel:lane.label,name:nameOf(shift),details:""})));
  }
  const reliefLanes=lanes.filter(lane => /^Avlösning\b/.test(lane.label));
  reliefLanes.forEach((lane,index) => {
    lane.label=reliefLanes.length===1?"Avlösning":"Avlösning "+(index+1);
    lane.events.forEach(event => {event.personLabel=lane.label;});
  });
  lanes.forEach(lane => lane.events.sort((a,b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end)));
  return lanes.sort((a, b) =>
    patternPersonPosition(activity, day, a.id) -
    patternPersonPosition(activity, day, b.id)
  );
}

}

function renderActivityGantt(activities,{data=plan,choiceForRow=null,editable=true,titleId="ganttTitle",preview=false,onlyDay=null}={}) {
  const groups=activities.map(activity => ({activity,days:activityDays(activity).filter(day => onlyDay===null || day===onlyDay).map(day => ({day,
    requirements:visibleRequirements(activity).filter(range => range.day===day),
    lanes:activityGanttLanes(activity,day,{data,choiceForRow})}))}));
  const periods=groups.flatMap(group => group.days.flatMap(day => [...day.requirements,...day.lanes.flatMap(lane => lane.events)]));
  const valid=periods.filter(validRange);
  if (!valid.length && !preview) return `<p class="hint gantt-empty">Lägg till dagar och giltiga tider för att visa Gantt-schemat.</p>`;
  const start=preview?7*60:Math.floor(Math.min(...valid.map(range => minute(range.start)))/60)*60;
  const end=preview?22*60:Math.ceil(Math.max(...valid.map(range => minute(range.end)))/60)*60;
  const outside=preview && valid.some(range => minute(range.start)<start || minute(range.end)>end);
  const span=Math.max(60,end-start),ticks=[];
  for (let value=start;value<=start+span;value+=60) ticks.push(value);
  return `<section class="gantt gantt-parallel${preview?" gantt-preview":""}" aria-labelledby="${titleId}">
    <div class="gantt-heading"><h${preview?"3":"2"} id="${titleId}">Gantt-schema${preview?"":onlyDay===null?" · samtliga dagar":" · "+DAYS[onlyDay]}</h${preview?"3":"2"}>
      <p>${preview?"Arbete, pauser och avlösning. Schemat följer dina ändringar direkt.":

function createActivityPassEditor(old) {
  const model=clone(old?.staffingPattern || {schemaVersion:1,layout:"linked-shifts",participants:[],shifts:[]});
  const links=[];
  if (!old?.staffingPattern && old) {
    const assigned=plan.assignments.filter(shift => shift.activityId===old.id),used=new Set();
    const add=(range,assignment=null) => {
      const participant={id:uid(),label:"Pass "+(model.participants.length+1)};
      const shift={id:uid(),participantId:participant.id,requirementId:range.id,day:range.day,
        start:assignment?.start || range.start,end:assignment?.end || range.end,kind:assignment?.kind || "ordinary",
        breaks:clone(assignment?.breaks || [])};
      model.participants.push(participant);model.shifts.push(shift);
      if (assignment) {links.push({assignmentId:assignment.id,shiftId:shift.id,participantId:participant.id});used.add(assignment.id);}
    };
    for (const range of visibleRequirements(old)) {
      const shifts=assigned.filter(shift => shift.kind!=="relief" && shift.day===range.day && overlaps(shift,range));
      for (let slot=0;slot<range.count;slot++) {
        const shift=shifts[slot];
        if (!shift || !used.has(shift.id)) add(range,shift);
      }
    }
    for (const shift of assigned.filter(item => !used.has(item.id))) {
      add(old.requirements.find(range => range.day===shift.day && overlaps(range,shift)) || {...shift,id:uid()},shift);
    }
  }
  model.layout="linked-shifts";
  const original={...clone(old || {}),staffingPattern:clone(model)};
  return {model,links,original,pendingDays:new Set(),
    activeDay:[...new Set(model.shifts.map(shift => shift.day))].sort((a,b) => a-b)[0]};
}

  }
}

      const windows=validRange(shift)?timePickerWindows([shift],others):[];

function bindPassEditor(editor) {
  const form=$("modalForm");
  form._activityEditor=editor;
  const changed=event => {
    if (!event.target.closest("#activityPassEditor")) return;
    if (event.target.matches(".pause-start")) {
      // Först när användaren har valt ett komplett startklockslag föreslås +30 min.
      const start=event.target,end=event.target.closest("[data-editor-break]")?.querySelector(".pause-end");
      if (end && /^([01]\d|2[0-3]):[0-5]\d$/.test(start.value)) {
        end.value=time(minute(start.value)+30);
        refreshClockDisplay(end);
      }
    }
    if (event.target.matches(".pause-start,.pause-end")) {
      synchronizePauseReliefTimes(editor,readPassEditorModel(editor));
    }
    syncPassEditorClocks();
    renderPauseQuestions(editor);
  };
  form.addEventListener("change",changed);
  form.addEventListener("click",event => {
    const button=event.target.closest("[data-pass-edit]");
    if (!button) return;
    if (button.dataset.passEdit==="remove-day") {
      event.preventDefault();confirmRemoveActivityDay(editor,Number(button.dataset.day));return;
    }
    if (button.dataset.passEdit==="show-day") {
      const nextDay=Number(button.dataset.day),currentDay=editor.activeDay;
      editor.model=readPassEditorModel(editor);
      let removedEmptyDay=false;
      if (editor.pendingDays.has(currentDay)) {
        const shifts=editor.model.shifts.filter(shift => shift.day===currentDay);
        const hasTimes=shifts.some(shift => shift.start || shift.end ||
          shift.breaks.some(pause => pause.start || pause.end));
        if (!hasTimes) {
          editor.model.shifts=editor.model.shifts.filter(shift => shift.day!==currentDay);
          editor.model.participants=editor.model.participants.filter(person =>
            editor.model.shifts.some(shift => shift.participantId===person.id));
          editor.model.participants.forEach((person,index) => {person.label="Pass "+(index+1);});
          removedEmptyDay=true;
        }
        editor.pendingDays.delete(currentDay);
      }
      editor.activeDay=nextDay;
      syncActivityInstruction();
      if (removedEmptyDay) {
        renderPassEditor(editor);
        refreshActivityGanttPreview();
        return;
      }
      modal.querySelectorAll(".pass-day-tab[role=tab]").forEach(tab => tab.setAttribute("aria-selected",String(tab===button)));
      modal.querySelectorAll("[data-pass-day]").forEach(panel => {panel.hidden=Number(panel.dataset.passDay)!==editor.activeDay;});
      modal.querySelectorAll(".pass-copy[data-copy-day]").forEach(box => {box.hidden=Number(box.dataset.copyDay)!==editor.activeDay;});
      refreshActivityGanttPreview();
      return;
    }
    try {
      editor.model=readPassEditorModel(editor);
      const card=button.closest("[data-editor-shift]"),source=editor.model.shifts.find(shift => shift.id===card?.dataset.editorShift);
      const action=button.dataset.passEdit;
      let focusSelector="";
      if (action==="cancel-copy") {button.closest(".pass-copy-confirm").innerHTML="";return;}
      if (action==="copy-day" || action==="confirm-copy") {
        const day=Number(button.dataset.day),group=button.closest(".pass-copy");
        const target=Number(button.dataset.target ?? group.querySelector(".pass-copy-day").value);
        const sources=editor.model.shifts.filter(shift => shift.day===day);
        if (sources.some(shift => !validRange(shift) || shift.breaks.some(pause => !validRange(pause)))) throw Error("Fyll i arbetets och pausernas tider innan du kopierar dem.");
        if (action==="copy-day" && editor.model.shifts.some(shift => shift.day===target)) {
          group.querySelector(".pass-copy-confirm").innerHTML=`<p>Arbetstider och bemanning för ${dayLower(target)} ersätts när du sparar aktiviteten.</p>
            <button type="button" class="btn small" data-pass-edit="confirm-copy" data-day="${day}" data-target="${target}">Ersätt arbetstiderna</button>
            <button type="button" class="btn small" data-pass-edit="cancel-copy">Avbryt</button>`;
          return;
        }
        const people=new Map(),copies=sources.map(source => {
          if (!people.has(source.participantId)) people.set(source.participantId,{id:uid(),label:""});
          const copy={...clone(source),id:uid(),day:target,participantId:people.get(source.participantId).id,
            breaks:source.breaks.map(pause => ({...clone(pause),id:uid()}))};
          delete copy.reliefPeriods;return copy;
        });
        editor.model.shifts=editor.model.shifts.filter(shift => shift.day!==target).concat(copies);
        editor.model.participants=editor.model.participants.filter(person => editor.model.shifts.some(shift => shift.participantId===person.id)).concat([...people.values()]);
        const order=[...new Set([...editor.model.shifts].sort((a,b) => a.day-b.day || a.start.localeCompare(b.start) || a.end.localeCompare(b.end)).map(shift => shift.participantId))];
        editor.model.participants.sort((a,b) => order.indexOf(a.id)-order.indexOf(b.id));
        editor.model.participants.forEach((person,index) => {person.label="Pass "+(index+1);});
        editor.activeDay=target;
      }
      if (action==="add-day" || action==="add-shift" || action==="add-relief") {
        const day=Number(button.dataset.day),previous=editor.model.shifts.filter(shift => shift.day===day).sort((a,b) => a.end.localeCompare(b.end)).at(-1);
        editor.activeDay=day;
        if (action==="add-day") editor.pendingDays.add(day);
        const person={id:uid(),label:"Pass "+(editor.model.participants.length+1)};
        const shift={id:uid(),participantId:person.id,requirementId:"",day,start:action==="add-relief"?"":previous?.end || "",end:"",kind:action==="add-relief"?"relief":"ordinary",breaks:[]};
        editor.model.participants.push(person);editor.model.shifts.push(shift);
        focusSelector=`[data-editor-shift="${shift.id}"] .pass-start`;
      }
      if (action==="remove-shift") {
        editor.model.shifts=editor.model.shifts.filter(shift => shift!==source);
        editor.model.participants=editor.model.participants.filter(person => editor.model.shifts.some(shift => shift.participantId===person.id));
        editor.model.participants.forEach((person,index) => {person.label="Pass "+(index+1);});
      }
      if (action==="add-break") {
        if (source.breaks.length>=2) return;
        if (!validRange(source)) throw Error("Välj arbetets start- och sluttid innan du lägger till en paus.");
        const windows=timePickerWindows([source],source.breaks.filter(validRange));
        if (!windows.length) throw Error("Det finns ingen ledig tid för en paus under arbetstiden.");
        // Inga påhittade tider: användaren väljer först starttid själv.
        const pause={id:uid(),type:"Paus",start:"",end:""};
        source.breaks.push(pause);focusSelector=`[data-editor-break="${pause.id}"] .pause-start`;
      }
      if (action==="remove-break") source.breaks=source.breaks.filter(pause => pause.id!==button.closest("[data-editor-break]").dataset.editorBreak);
      renderPassEditor(editor);refreshActivityGanttPreview();
      if (focusSelector) modal.querySelector(focusSelector)?.closest(".clock-control").querySelector(".clock-trigger").focus({preventScroll:true});
    } catch (error) {showError(error);}
  });
  renderPassEditor(editor);
}

function requirementsFromPasses(pattern,previous=[]) {
  const ranges=[];
  for (const day of [...new Set(pattern.shifts.map(shift => shift.day))].sort()) {
    const shifts=pattern.shifts.filter(shift => shift.day===day),edges=[...new Set(shifts.flatMap(shift => [shift.start,shift.end]))].sort();
    for (let index=1;index<edges.length;index++) {
      const start=edges[index-1],end=edges[index],active=shifts.filter(shift => shift.start<=start && shift.end>=end);
      const ordinary=active.filter(shift => shift.kind!=="relief").length,count=ordinary || active.length;
      if (!count) continue;
      const last=ranges.at(-1);
      if (last?.day===day && last.end===start && last.count===count) last.end=end;
      else ranges.push({day,start,end,count});
    }
  }
  const used=new Set();
  return ranges.map(range => {
    const old=previous.find(item => !used.has(item.id) && item.day===range.day && item.start===range.start && item.end===range.end) ||
      previous.find(item => !used.has(item.id) && item.day===range.day && overlaps(item,range));
    const id=old?.id || uid();used.add(id);return {...range,id};
  });
}

function rebasePassChoices(editor,activity,data) {
  const original=editor.original;
  mapEditorAssignments(editor,data);
  if (original.staffingChoices?.scope==="person-day") {
    const choices=createPersonDayDraft(original,data.assignments,data.people);
    activity.staffingChoices=serializePersonDayDraft(activity,choices);
    return;
  }
  const draft=createTimelineDraft(original,data.assignments,data.people),before=patternTimelineRows(original),after=patternTimelineRows(activity);
  const stored={schemaVersion:1,defaults:[],overrides:[]};
  for (const person of activity.staffingPattern.participants) {
    const value=draft.defaults[person.id];
    if (value) stored.defaults.push({participantId:person.id,personId:value.personId,
      sourceRowId:after.find(row => row.id===value.sourceRowId)?.id || after.find(row => row.participantId===person.id)?.id || ""});
  }
  for (const row of after) {
    let candidates=before.filter(old => old.shiftId===row.shiftId && old.kind===row.kind && overlaps(old,row));
    const exact=candidates.find(old => old.id===row.id);
    if (exact) candidates=[exact];
    else if (!candidates.length && row.kind==="pause") candidates=before.filter(old => old.shiftId===row.shiftId && overlaps(old,row));
    const values=[...new Set(candidates.map(old => timelineChoiceValue(draft,old).personId).filter(Boolean))];
    if (values.length>1) throw Error("Den nya tidsperioden för "+row.personLabel+" omfattar flera valda medarbetare. Ge dessa rader samma namn i Bemanning innan du slår ihop dem.");
    const chosen=candidates.sort((a,b) => Math.min(minute(b.end),minute(row.end))-Math.max(minute(b.start),minute(row.start))-
      (Math.min(minute(a.end),minute(row.end))-Math.max(minute(a.start),minute(row.start))))[0];
    const value=chosen?timelineChoiceValue(draft,chosen):null;
    const shared=stored.defaults.find(item => item.participantId===row.participantId)?.personId || "";
    if (value && value.personId!==shared) stored.overrides.push({rowId:row.id,personId:value.personId});
  }
  activity.staffingChoices=stored;
}

function readActivityDraft(old,id,{preview=false}={}) {
  const editor=$("modalForm")._activityEditor,pattern=readPassEditorModel(editor);
  if (preview) {
    // Rita arbetet även när en paus håller på att ändras. Endast färdiga,
    // giltiga pauser tas med; originalet och valideringen vid sparande behålls.
    for (const shift of pattern.shifts) {
      let previousEnd=shift.start;
      shift.breaks=shift.breaks.filter(pause => validRange(pause) &&
        pause.start>=shift.start && pause.end<=shift.end)
        .sort((a,b) => a.start.localeCompare(b.start)).filter(pause => {
          if (pause.start<previousEnd) return false;
          previousEnd=pause.end;
          return true;
        });
    }
    const requirements=requirementsFromPasses({...pattern,shifts:pattern.shifts.filter(validRange)},old?.requirements || []);
    return {...clone(old || {}),id,title:$("actTitle").value.trim() || "Ny aktivitet",placeId:$("actPlace").value || null,
      notes:$("actNotes").value.trim(),dayNotes:readInstructionDays(),requirements,staffingPattern:pattern};
  }
  if (!pattern.shifts.length) return {...clone(old || {}),id,title:$("actTitle").value.trim() || "Ny aktivitet",placeId:$("actPlace").value || null,
    notes:$("actNotes").value.trim(),dayNotes:readInstructionDays(),requirements:[],staffingPattern:pattern,recommendedPeoplePerDay:0};
  for (const shift of pattern.shifts) {
    const person={label:patternPersonLabel({staffingPattern:pattern},shift.day,shift.participantId)};
    if (!validRange(shift)) throw Error("Välj giltiga start- och sluttider för "+person.label+" på "+dayLower(shift.day)+".");
    for (const pause of shift.breaks) {
      if (!validRange(pause) || pause.start<shift.start || pause.end>shift.end) throw Error("Pausen för "+person.label+" ska ligga inom arbetets tider.");
      if (shift.breaks.some(other => other!==pause && overlaps(other,pause))) throw Error("Pauserna för "+person.label+" överlappar.");
    }
    shift.breaks.sort((a,b) => a.start.localeCompare(b.start));
  }
  const requirements=requirementsFromPasses(pattern,old?.requirements || []);
  for (const shift of pattern.shifts) shift.requirementId=requirements.find(range => range.day===shift.day && range.start<=shift.start && range.end>shift.start)?.id;
  const pauses=pattern.shifts.flatMap(shift => shift.breaks.map(pause => ({...pause,participantId:shift.participantId,day:shift.day})));
  const relievers=pattern.shifts.filter(shift => shift.kind==="relief"),preferred=new Map();
  for (const shift of pattern.shifts) {
    for (const period of shift.reliefPeriods || []) preferred.set(period.breakId,shift.id);
    delete shift.reliefPeriods;
  }
  // Fördela pauser mellan avlösningspassen utan att dubbelboka en avlösare.
  // Otäckta pauser får finnas i planeringen och visas som luckor i Bemanning.
  for (const pause of pauses.sort((a,b) => a.day-b.day || a.start.localeCompare(b.start))) {
    const candidates=relievers.filter(shift => shift.day===pause.day && shift.participantId!==pause.participantId &&
      pause.start>=shift.start && pause.end<=shift.end && !(shift.reliefPeriods || []).some(period => overlaps(period,pause)));
    const shift=candidates.find(item => item.id===preferred.get(pause.id)) || candidates[0];
    if (shift) (shift.reliefPeriods ||= []).push({breakId:pause.id,participantId:pause.participantId,start:pause.start,end:pause.end});
  }
  pattern.layout="linked-shifts";
  const activity={...clone(old || {}),id,title:$("actTitle").value.trim() || "Ny aktivitet",placeId:$("actPlace").value || null,
    notes:$("actNotes").value===$("actNotes").defaultValue?(old?.notes || ""):$("actNotes").value.trim(),dayNotes:readInstructionDays(),requirements,
    staffingPattern:pattern,recommendedPeoplePerDay:Math.max(0,...dailyStaffingCounts({staffingPattern:pattern}).map(day => day.total))};
  validateStaffingPattern(activity);
  return activity;
}

const INSTRUCTION_TIP_LINES=12,INSTRUCTION_TIP_CHARS=600;

// Förhandsvisning i tooltipen: långa instruktioner kortas så att rutan ryms på skärmen.
function instructionTipText(text) {
  const lines=text.trim().split(/\r?\n/);
  let preview=lines.slice(0,INSTRUCTION_TIP_LINES).join("\n");
  const cut=lines.length>INSTRUCTION_TIP_LINES || preview.length>INSTRUCTION_TIP_CHARS;
  if (preview.length>INSTRUCTION_TIP_CHARS) preview=preview.slice(0,INSTRUCTION_TIP_CHARS).trimEnd();
  return cut?preview+"…":preview;
}

function editActivity(id, preferredDay=null) {
  const old=plan.activities.find(activity => activity.id===id),draftId=old?.id || uid(),editor=createActivityPassEditor(old);
  // Behåll aktiv dag när redigeringen öppnas från bemanningsmodalen.

  showDialog(old ? "Redigera " + old.title : "Ny aktivitet", activityDialogSubtitle(old),
    `<div class="formgrid activity-form">

    async () => {
      const activity=readActivityDraft(old,draftId);activity.title=$("actTitle").value.trim();
      if (!activity.requirements.length) throw Error("Lägg till minst ett arbete.");
      if (!await reviewPauseRelief(activity)) return;
      const preview=clone(plan);rebasePassChoices(editor,activity,preview);
      await commit(data => {
        mapEditorAssignments(editor,data);synchronizePatternAssignments(data,activity);
        if (old) data.activities[data.activities.findIndex(item => item.id===old.id)]=activity;
        else data.activities.push(activity);
      },"Aktiviteten är sparad.");

      else closeDialog();
    });
  if (old) {
    const closeButton=modal.querySelector(".dialog-head .closebtn");
    closeButton.insertAdjacentHTML("beforebegin",
      `<span class="staff-activity-control" title=""><button type="button" class="btn small" data-action="staff-activity" data-id="${esc(old.id)}">Bemanna aktivitet</button></span>`);
    bindActivityStaffingShortcut();

  syncActivityInstruction();
  bindPassEditor(editor);
  bindActivityGanttPreview(() => {
    const activity=readActivityDraft(old,draftId,{preview:true}),data=clone(plan);
    // Förhandsvisningen följer formulärets pass. Namn hämtas separat så att
    // ändrade tider eller äldre personbyten inte stoppar själva ritningen.
    mapEditorAssignments(editor,data);
    const choices=createPersonDayDraft(editor.original,data.assignments,data.people);
    const previous=createTimelineDraft(editor.original,data.assignments,data.people);
    const rows=patternTimelineRows(editor.original);
    return {activity,data,choiceForRow:row => {
      const value=choices.get(personDayKey(row));
      if (!value?.mixed) return value?.text || "";
      const source=rows.find(item => item.id===row.id) || rows.find(item =>
        item.participantId===row.participantId && item.day===row.day && item.kind===row.kind && overlaps(item,row));
      return source?timelineChoiceValue(previous,source).text:"";
    }};
  });
}

function staffingCoverage(activityId,day,data=plan) {
  let required=0,covered=0;
  for (const segment of coverage(activityId,day,data)) {
    const length=duration(segment.start,segment.end);
    required+=segment.need*length;
    covered+=Math.min(segment.staff,segment.need)*length;
  }
  const missing=required-covered;
  const state=missing===0 ? "full" : covered===0 ? "empty" : "partial";
  const percent=required ? covered/required*100 : state==="full" ? 100 : 0;
  return {required,covered,missing,state,percent,
    label:String(Math.round(percent))};
}

    const names=plan.assignments.filter(s => s.activityId===activity.id).map(s => personName(s.personId));
    return days.length>0 && (!ui.onlyGaps || days.some(day => gaps(activity.id,day).length)) &&

function staffingDay(activity,day) {
  const summary=staffingCoverage(activity.id,day);
  const status=summary.state==="full"?"Fullt bemannad":summary.state==="empty"?"Obemannad":"Delvis bemannad, "+summary.label+" procent";

    if(exact && !reasonFor(exact.id)){select(exact.id);return;}

  });
  input.addEventListener('keydown',event=>{
    if(event.key==='Escape'){event.preventDefault();event.stopPropagation();hideBox();}
    if(event.key==='ArrowDown'){event.preventDefault();suggestions();box.querySelector('[data-person]:not(:disabled)')?.focus();}
    if(event.key==='Enter' && !storedPersonId){event.preventDefault();suggestions();}
  });

    const buttons=[...box.querySelectorAll('[data-person]:not(:disabled)')];
    if(['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();const index=buttons.indexOf(document.activeElement);buttons[(index+(event.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus();}
    if(event.key==='Escape'){event.preventDefault();input.focus();hideBox();}

  let pointerInBox=false;
  box.addEventListener('mousedown',event=>{
    pointerInBox=true;

  });

    if(pointerInBox)return;

  },0));
  clear.onclick=()=>{select('');if(onInput)onInput('','');input.focus();};
}

  return preview.assignments.filter(shift=>shift.activityId===activity.id && shift.day===group.day && shift.patternParticipantId===group.participantId)
    .map(shift=>personReason(preview,personId,shift.day,shift.start,shift.end,shift.id)).find(Boolean) || "";

function legacyCandidateReason(containerId,personId,activity,requirements) {
  const containers=[...modal.querySelectorAll('.staff-select-container')],used=new Set();
  const assignments=plan.assignments.filter(shift=>!containers.some(container=>container.dataset.shiftId===shift.id));
  let target;
  for(const container of containers){
    const old=plan.assignments.find(shift=>shift.id===container.dataset.shiftId);
    if(old && used.has(old.id))continue;if(old)used.add(old.id);
    const req=requirements.find(range=>range.id===container.dataset.requirementId);
    const id=container.id===containerId?personId:slotPerson(container);if(!id)continue;
    const shift={...clone(old || {}),id:old?.id || container.id,activityId:activity.id,day:req.day,personId:id,start:old?.start || req.start,end:old?.end || req.end,kind:old?.kind || 'ordinary',breaks:clone(old?.breaks || [])};
    assignments.push(shift);if(container.id===containerId)target=shift;
  }
  return target?personReason({...plan,assignments},personId,target.day,target.start,target.end,target.id):"";
}

function sortPeople(people,order=ui.peopleSort,day=ui.peopleDay) {
  const compareNames=(a,b)=>a.name.localeCompare(b.name,"sv-SE") || a.id.localeCompare(b.id);
  const bound=(person,field)=>{
    const ranges=person.availability.filter(range=>day===null || range.day===day);
    const values=ranges.map(range=>range[field]).filter(Boolean).sort();
    return values.length?(field==="end"?values.at(-1):values[0]):null;
  };
  return people.slice().sort((a,b)=>{
    if (order==="az") return compareNames(a,b);
    if (order==="za") return -compareNames(a,b);
    const field=order==="end"?"end":"start",left=bound(a,field),right=bound(b,field);
    if (left===null || right===null) return left===right?compareNames(a,b):left===null?1:-1;
    return (field==="end"?right.localeCompare(left):left.localeCompare(right)) || compareNames(a,b);
  });
}

/* ---------- Personalens Gantt-schema: arbetstid och tilldelade aktiviteter ---------- */
// En liten, tydlig palett återanvänds på varje persons rad.
// Återkommande pass på samma aktivitet behåller färgen inom raden.
function peopleActivityColors(shifts) {
  const palette=["#bea15e","#6486a2","#b5766d","#73967e","#9580a5","#ac885d"];
  const colors=new Map();
  for (const shift of shifts) {
    if (colors.has(shift.activityId)) continue;
    const usedByNeighbours=new Set();
    for (let index=0;index<shifts.length;index++) {
      if (shifts[index].activityId!==shift.activityId) continue;
      for (const other of [shifts[index-1],shifts[index+1]]) {
        if (other && other.activityId!==shift.activityId && colors.has(other.activityId)) usedByNeighbours.add(colors.get(other.activityId));
      }
    }
    const unused=palette.find(color=>![...colors.values()].includes(color));
    colors.set(shift.activityId,unused || palette.find(color=>!usedByNeighbours.has(color)) || palette[colors.size%palette.length]);
  }
  return colors;
}
function peopleGantt(people,day) {
  if (!people.length) return peopleEmpty();
  const start=7*60,end=22*60,span=end-start;
  const assignments=plan.assignments.filter(shift=>shift.day===day && people.some(person=>person.id===shift.personId));
  const allRanges=people.flatMap(person=>person.availability.filter(range=>range.day===day)).concat(assignments);
  const outside=allRanges.some(range=>minute(range.start)<start || minute(range.end)>end);
  const clip=range=>({start:Math.max(start,minute(range.start)),end:Math.min(end,minute(range.end))});
  const position=range=>`left:${(range.start-start)/span*100}%;width:${(range.end-range.start)/span*100}%;`;
  const tip=(event,heading,name,start,end,details="")=>`data-people-gantt-tip data-gantt-kind="work"
    data-gantt-event="${esc(event)}" data-gantt-person="${esc(heading)}" data-gantt-name="${esc(name)}"
    data-gantt-start="${esc(start)}" data-gantt-end="${esc(end)}" data-gantt-day="${esc(DAYS[day])}" data-gantt-details="${esc(details)}"`;
  const ticks=[];for(let value=start;value<=end;value+=60) ticks.push(value);
  return `<section class="overview-gantt people-gantt" aria-labelledby="peopleGanttTitle">
    <div class="overview-heading"><h2 id="peopleGanttTitle">${esc(DAYS[day])} ${esc(dateLabel(day))}</h2>${outside?'<p class="gantt-outside-note" role="note">Tider före 07:00 eller efter 22:00 visas inte fullt ut i schemat.</p>':""}</div>
    <div class="overview-scroll" role="region" aria-label="Gantt-schema för dagens personal">
      <div class="overview-chart" style="--overview-hour-width:${60/span*100}%">
        <div class="overview-row overview-axis-row"><div class="overview-label">Personal</div><div class="overview-plot"><div class="overview-axis">${ticks.map((value,index)=>{
          const edge=index===0 || index===ticks.length-1;
          const visibleAt=step=>edge || (value%step===0 && value-start>=step && end-value>=step);
          return `<span class="overview-tick" data-edge="${edge}" data-medium="${visibleAt(120)}" data-narrow="${visibleAt(240)}" style="left:${(value-start)/span*100}%"><span>${time(value)}</span></span>`;
        }).join("")}</div></div></div>
        ${people.map(person=>{
          const working=person.availability.filter(range=>range.day===day).sort((a,b)=>a.start.localeCompare(b.start));
          const shifts=assignments.filter(shift=>shift.personId===person.id).sort((a,b)=>a.start.localeCompare(b.start) || a.end.localeCompare(b.end) || a.id.localeCompare(b.id));
          const colors=peopleActivityColors(shifts);
          const boundaryBooked=value=>shifts.some(shift=>shift.start===value || shift.end===value);
          const lines=working.map(range=>{
            const clipped=clip(range);if(clipped.end<=clipped.start) return "";
            const label=`${person.name}: arbetstid ${range.start}–${range.end}`;
            const endpoints=[range.start,range.end].filter(value=>minute(value)>=start && minute(value)<=end && !boundaryBooked(value));
            return `<span class="people-worktime" role="img" ${tip("Arbetstid",person.name,"",range.start,range.end)} aria-label="${esc(label)}" style="${position(clipped)}"></span>`+
              endpoints.map(value=>`<span class="people-worktime-end" data-time="${esc(value)}" ${tip("Arbetstid",person.name,"",range.start,range.end)} aria-hidden="true" style="left:${(minute(value)-start)/span*100}%"></span>`).join("");
          }).join("");
          const blocks=shifts.map(shift=>{
            const clipped=clip(shift);if(clipped.end<=clipped.start) return "";
            const name=activityName(shift.activityId),color=colors.get(shift.activityId) || "#888888";
            const label=`${person.name}: ${name}${shift.kind==="relief"?", avlösning":""}, ${shift.start}–${shift.end}`;
            const pauses=(shift.breaks || []).map(pause=>{
              const segment={start:Math.max(clipped.start,minute(pause.start)),end:Math.min(clipped.end,minute(pause.end))};
              if(segment.end<=segment.start) return "";
              const description=`${person.name}: ${pause.type || "Paus"} ${pause.start}–${pause.end} (${name})`;
              return `<span class="people-booking-pause" role="img" ${tip(pause.type || "Paus",name,person.name,pause.start,pause.end)} aria-label="${esc(description)}" style="left:${(segment.start-clipped.start)/(clipped.end-clipped.start)*100}%;width:${(segment.end-segment.start)/(clipped.end-clipped.start)*100}%"></span>`;
            }).join("");
            return `<button type="button" class="people-activity-block" data-action="shift" data-id="${esc(shift.id)}" data-activity-id="${esc(shift.activityId)}"
              ${tip(shift.kind==="relief"?"Avlösning":"Arbete",name,person.name,shift.start,shift.end)} aria-label="${esc(label)}" style="${position(clipped)}--people-activity-color:${color};">${pauses}</button>`;
          }).join("");
          return `<div class="overview-row" data-person-gantt="${esc(person.id)}"><div class="overview-label overview-activity-label"><button type="button" class="overview-activity-name" data-action="person-schedule" data-id="${esc(person.id)}">${esc(person.name)}</button></div>
            <div class="overview-plot"><div class="overview-track" aria-label="${esc(person.name+", "+DAYS[day])}">${lines}${blocks}</div></div></div>`;
        }).join("")}
      </div>
    </div>
  </section>`;
}

function placeCards() {
  const normalize=value=>String(value || "").toLocaleLowerCase("sv-SE").replace(/\s+/g," ").trim();

  return plan.places.filter(isListedPlace).sort((a,b)=>a.name.localeCompare(b.name,"sv")).map(place=>{
    const registered=placeDirectory.find(item=>item.id===place.id) || {};
    const description=registered.description || place.description || PLACE_DESCRIPTIONS[place.name] || "";
    const activities=plan.activities.filter(activity=>activity.placeId===place.id);
    const ids=new Set(activities.map(activity=>activity.id));
    const shifts=plan.assignments.filter(shift=>ids.has(shift.activityId));
    const people=plan.people.filter(person=>shifts.some(shift=>shift.personId===person.id));
    const activityText=activity=>[activity.title,activity.notes,...Object.values(activity.dayNotes || {})].join(" ");
    const haystack=normalize([place.name,description,registered.mapsUrl || place.mapsUrl,...activities.map(activityText),...people.flatMap(person=>[person.name,person.phone]),...shifts.flatMap(shift=>[shift.note,shift.start,shift.end,DAYS[shift.day]])].join(" "));
    if (!terms.every(term=>haystack.includes(term))) return "";
    const matches=terms.length?[...activities.filter(activity=>terms.some(term=>normalize(activityText(activity)).includes(term))).map(activity=>activity.title),...people.filter(person=>terms.some(term=>normalize(person.name+" "+person.phone).includes(term))).map(person=>person.name)]:[];
    const mapsUrl=normalizeGoogleMapsLink(registered.mapsUrl || place.mapsUrl || "");

      ${description?`<p class="place-description">${esc(description)}</p>`:""}
      <p>${activities.length} ${activities.length===1?"aktivitet":"aktiviteter"} under hela Julstöket</p>
      ${matches.length?`<p class="place-search-match">Träff: ${esc([...new Set(matches)].slice(0,4).join(" · "))}</p>`:""}
      ${mapsUrl?`<a class="place-maps-link" href="${esc(mapsUrl)}" target="_blank" rel="noopener noreferrer">Google Maps ↗</a>`:""}

    <div class="dialog-foot">${footer || button("Stäng","close","","primary")}</div>
  </form>`;

  $("modalForm").onsubmit=async event => {
    event.preventDefault();
    if (!onSubmit) return;

    const submitButtons=[...modal.querySelectorAll('button[type="submit"]')];
    submitButtons.forEach(b => b.disabled=true);
    try {
      const incomplete=[...modal.querySelectorAll(".clock-value:not(:disabled)")]
        .find(input => !(input._timeChoices || CLOCK_CHOICES).includes(input.value));
      if (incomplete) {
        openClockPicker(incomplete);
        if (incomplete.classList.contains("av-start") || incomplete.classList.contains("av-end")) {
          throw Error("Välj arbetstider mellan 07:00 och 21:00. Sluttiden måste vara efter starttiden.");
        }
        throw Error("Välj timme och minuter för alla tider innan du sparar.");
      }
      await onSubmit();
    } catch (error) {
      showError(error);
    } finally {
      submitButtons.forEach(b => b.disabled=false);
    }
  };

  if (!modal.open) modal.showModal();
  $("modalTitle").focus({preventScroll:true});
}

/* ---------- Bemanningsfunktioner ---------- */

function levenshtein(a, b) {
  a = a.toLowerCase();
  b = b.toLowerCase();
  if (a.length === 0) return b.length;
  if (b.length === 0) return a.length;
  const matrix = [];
  for (let i = 0; i <= b.length; i++) matrix[i] = [i];
  for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      if (b.charAt(i - 1) === a.charAt(j - 1)) {
        matrix[i][j] = matrix[i - 1][j - 1];
      } else {
        matrix[i][j] = Math.min(
          matrix[i - 1][j - 1] + 1,
          matrix[i][j - 1] + 1,
          matrix[i - 1][j] + 1
        );
      }
    }
  }
  return matrix[b.length][a.length];
}

function findMatchingPeople(inputVal) {
  if (!inputVal || !inputVal.trim()) return [];
  const query = inputVal.trim().toLowerCase();
  const queryTokens = query.split(/\s+/).filter(Boolean);
  if (!queryTokens.length) return [];

  const scored = [];
  for (const person of plan.people) {
    const nameLower = person.name.toLowerCase();
    const nameTokens = nameLower.split(/\s+/).filter(Boolean);

    let totalScore = 0;
    const matchedAll = queryTokens.every(q => {
      let best = Infinity;
      for (const n of nameTokens) {
        if (n.startsWith(q)) { best = 0; break; }
        if (n.includes(q) && q.length >= 3) { if (1 < best) best = 1; continue; }
        const limit = Math.max(1, Math.floor(Math.max(q.length, n.length) / 4));
        const d = levenshtein(q, n);
        if (d <= limit && d < best) best = d;
      }
      totalScore += best;
      return best !== Infinity;
    });

    if (matchedAll) scored.push({ person, score: totalScore });
  }

  scored.sort((a, b) => a.score - b.score || a.person.name.localeCompare(b.person.name, "sv"));
  return scored.map(s => s.person);
}

function assignActivity(activityId, day) {
  const activity = plan.activities.find(a => a.id === activityId);
  if (!activity) return;
  if (activity.staffingPattern) return assignPatternActivity(activity, day);

  const requirements = (activity.requirements || []).slice().sort((a, b) => {
    if (a.day !== b.day) return a.day - b.day;
    if (a.start !== b.start) return a.start.localeCompare(b.start);
    return a.end.localeCompare(b.end);
  });
  const activeDays = DAYS.map((name, day) => ({
    name, day,
    reqs: requirements.filter(r => r.day === day)
  })).filter(group => group.reqs.length);
  const missingDays = DAYS.map((_, d) => d).filter(d => !activeDays.some(group => group.day === d));

  showDialog("Bemanna " + activity.title, activityDialogSubtitle(activity),
    `${activityGanttPreview()}<div class="day-scope-bar"><p class="hint">Aktivitetens samtliga dagar och nuvarande bemanning.</p></div>
     <div class="days-grid staff-days-grid">
       ${missingDays.map(d => `<section class="req-day-group day-tone-${d} staff-day-missing" data-scope-day="${d}" aria-label="${DAYS[d]}" data-testid="staff-day-missing-${d}">
         <p>${esc(activity.title)} har inga pass på ${dayLower(d)}.</p>
       </section>`).join("")}
       ${activeDays.map(group => {
         const multipleOnDay = group.reqs.length > 1;
         return `<section class="req-day-group day-tone-${group.day}" data-scope-day="${group.day}" aria-label="${group.name}">
           <div class="req-day-heading"><h4>${group.name}</h4>${multipleOnDay ? `<span class="req-day-count">${group.reqs.length} tidsperioder</span>` : ""}</div>
           <div class="staff-pass-list">
             ${group.reqs.map((req, index) => {
               const shifts = plan.assignments.filter(s =>
                 s.activityId === activityId && s.day === req.day &&
                 overlaps(s, { start: req.start, end: req.end })
               );
               const needText = `Normalt ${req.count} pass`;

function timePickerWindows(ranges,excluded=[]) {
  let windows=[];
  for (const range of [...ranges].sort((a,b) => a.start.localeCompare(b.start))) {
    const start=minute(range.start),end=minute(range.end),previous=windows.at(-1);
    if (previous && previous.end>=start) previous.end=Math.max(previous.end,end);
    else windows.push({start,end});
  }
  for (const excludedRange of excluded) {
    const start=minute(excludedRange.start),end=minute(excludedRange.end);
    windows=windows.flatMap(range => start>=range.end || end<=range.start ? [range] : [
      {start:range.start,end:Math.max(range.start,start)},
      {start:Math.min(range.end,end),end:range.end}
    ].filter(r => r.start<r.end));
  }
  return windows.map(r => ({start:Math.ceil(r.start/5)*5,end:Math.floor(r.end/5)*5}))
    .filter(r => r.end-r.start>=5);
}

function bindTimeRange(startId,endId,ranges,startValue,endValue,onChange=()=>{},mustCover=[]) {
  const startSelect=$(startId),endSelect=$(endId);
  const firstRequired=mustCover.length ? Math.min(...mustCover.map(r => minute(r.start))) : Infinity;
  const lastRequired=mustCover.length ? Math.max(...mustCover.map(r => minute(r.end))) : -Infinity;
  const windows=ranges.filter(r => !mustCover.length || r.start<=firstRequired && r.end>=lastRequired);
  const values=(start,end) => {
    const result=[];
    for (let value=Math.ceil(start/5)*5;value<=end;value+=5) result.push(value);
    return result;
  };
  const allStarts=windows.flatMap(r => values(r.start,Math.min(r.end-5,firstRequired)));
  if (!allStarts.length) return false;
  const nearest=(choices,wanted) => choices.reduce((best,value) =>
    Math.abs(value-wanted)<Math.abs(best-wanted) ? value : best);
  const options=(input,choices,selected) => setClockChoices(input,choices.map(time),time(selected));
  function refresh(notify=false) {
    const wantedStart=minute(startSelect.value || startValue);
    const start=nearest(allStarts,wantedStart);
    const window=windows.find(r => r.start<=start && start<r.end);
    const ends=values(Math.max(start+5,lastRequired),window.end);
    const end=nearest(ends,minute(endSelect.value || endValue));
    const starts=allStarts.filter(value => value<window.start || value>=window.end || value<end);
    options(startSelect,starts,start);
    options(endSelect,ends,end);
    if (notify) onChange();
  }
  startSelect.onchange=()=>refresh(true);
  endSelect.onchange=()=>refresh(true);
  refresh();
  return true;
}
