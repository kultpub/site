<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registrera dag</title>
<style>
/* ── 1. BAS & TYPOGRAFI ── */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #f8f9fa;
  --surface: #ffffff;
  --surface2: #f1f3f5;
  --text: #1a1a1a;
  --muted: #6c757d;
  --border: #e9ecef;
  --border2: #dee2e6;
  --accent: #7c4b2a;
  --accent-dark: #5d3820;
  --accent-light: #fdf1e8;
  --success: #2b8a3e;
  --danger: #c92a2a;
  --radius: 16px;
  --radius-md: 12px;
  --radius-sm: 6px;
  --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scrollbar-gutter: stable;
}

body {
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 15px;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

main {
  width: min(1100px, 94vw);
  margin: 0 auto;
  padding: 40px 0 80px;
  display: grid;
  gap: 20px;
}

/* ── 2. HEADER-CARD (Överst på sidan) ── */
.header-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 30px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: flex-end;     /* Sätter rubrik och bubblor på samma snygga baslinje */
  justify-content: space-between;
  gap: 24px;
  flex-wrap: nowrap;         /* Garanterar att de stannar på samma radhöjd */
}

.header-left .kicker {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
}

.header-left h1 {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.03em;
  margin-bottom: 4px;
}

.header-left .dateline {
  font-size: 13px;
  color: var(--muted);
}

/* ── 3. STATISTIK-RAD (I headern) ── */
.stats-row {
  display: flex;
  gap: 12px;                  /* Luftigt och fint avstånd mellan bubblorna */
  flex: 0 0 auto;             /* Låter raden ta precis den plats bubblorna kräver */
  justify-content: flex-end;  /* Trycker bubblorna mot högerkanten */
}

.stat-box {
  background: var(--surface2);
  border-radius: var(--radius-md);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 115px;         /* Din önskade fasta bredd */
  height: 85px;         /* En fast höjd som ger bra proportioner till 32px ikoner */
  flex: 0 0 115px;      /* Förbjuder flexbox att stretcha eller trycka ihop bredden (0 0) */
  flex-shrink: 0;       /* Extra livrem för att garantera att höjden inte kollapsar */
}

/* Vi behöver inte klassen .wide längre eftersom alla nu har en enhetlig, trygg bredd */
.stat-box.wide {
  flex: 0 0 100px;
}

.stat-box .venue-icon {
  width: 32px;                /* Stor och skarp ikonstorlek */
  height: 32px;
  object-fit: contain;
}

#statBox_daily .venue-icon {
  transform: translateY(3px) scale(0.85);
}

.stat-num {
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 16px;            /* Tydlig sifferstorlek */
  font-weight: 700;
  color: var(--text);
  line-height: 1;
  white-space: nowrap; 
}

.stat-checkbox {
  width: 18px;
  height: 18px;
  border: 2px solid var(--muted);
  border-radius: 4px;
  background: var(--surface);
  position: relative;
  transition: all 0.2s ease;
}

/* När rapporten finns aktiverar vi den här klassen via JavaScript */
.stat-checkbox.checked {
  background: var(--success);
  border-color: var(--success);
}

/* Ritar ut en snygg, skarp bock inuti rutan */
.stat-checkbox.checked::after {
  content: '';
  position: absolute;
  left: 4.5px;
  top: -1px;
  width: 5px;
  height: 10px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

/* ── 4. PANELER & ACTION GRID (Mitten på sidan) ── */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  box-shadow: var(--shadow);
}

.panel-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 20px;
}

.entries-panel-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}

.entries-panel-heading .panel-label { margin-bottom: 0; }

.entry-sort-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.entry-sort-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}

.entry-sort-button {
  border: 1px solid var(--border2);
  border-radius: 20px;
  background: var(--surface);
  color: var(--muted);
  padding: 7px 12px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}

.entry-sort-button:hover,
.entry-sort-button.active {
  border-color: var(--accent);
  background: var(--surface2);
  color: var(--accent-dark);
}

@media (max-width: 600px) {
  .entries-panel-heading { align-items: flex-start; flex-direction: column; }
  .entry-sort-controls { flex-wrap: wrap; }
}

.action-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.action-btn {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 22px 24px;         /* Justerat för att matcha förra filens luftighet */
  display: flex;              /* AKTIVERAR FLEXBOX */
  flex-direction: row;        /* Lägger ikon och text sida vid sida */
  align-items: center;        /* Centrerar ikon och text perfekt vertikalt */
  gap: 20px;                  /* Skapar exakt avstånd mellan ikon och text */
  text-align: left;
  cursor: pointer;
  color: var(--text);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  height: 140px;
}

.icon-wrap {
  flex: 0 0 54px;            /* Förhindrar flexbox från att någonsin krympa ikonen */
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: visible;          /* Livsviktigt för att skalan på 1.5 inte ska klippas bort */
}

.action-btn:hover {
  border-color: var(--accent);
  background: var(--accent-light);
  transform: translateY(-2px);
  box-shadow: 0 10px 15px -3px rgba(124, 75, 42, 0.1);
}

.action-btn .btn-title {
  font-size: 16px;
  font-weight: 600;
  display: block;
  margin-bottom: 6px;
}

.action-btn .btn-desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
}

/* ── 5. ENTRIES-LISTA (Nedre panelen) ── */
.entries-list { display: grid; gap: 10px; }

.entry-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  transition: all 0.2s ease;
  cursor: pointer;
  animation: slideIn .2s ease;
}

.entry-row:hover {
  border-color: var(--accent);
  background: var(--surface2);
  transform: translateX(4px);
}

.entry-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 20px;
  white-space: nowrap;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 150px;
  min-height: 32px;
  justify-content: flex-start;
}

.entry-badge:not(.badge-other) {
  width: 130px;
  margin-right: 20px;
  background: #e9ecef;
  color: #111;
}

.badge-other   { background: #e6fcf5; color: #087f5b; }

.entry-body { flex: 1; min-width: 0; }

.entry-title { 
  font-size: 15px; 
  font-weight: 600; 
  margin-bottom: 4px; 
  white-space: nowrap;
}

.entry-title.truncate {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 500px;
}

.entry-meta  { font-size: 13px; color: var(--muted); }

.entry-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  text-align: right;
  line-height: 1.4;
  align-self: flex-start;
  padding-top: 1px;
}

.entry-time span {
  display: block;
  white-space: nowrap;
}

.entry-time strong {
  display: block;
  font-size: 12px;
  color: var(--text);
  font-weight: 500;
}

/* ── 6. MODALER & OVERLAYS ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 100;
  backdrop-filter: blur(4px);
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border-radius: var(--radius);
  width: min(700px, 96vw);
  overflow-y: visible;
  padding: 32px;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  animation: modalIn .18s ease;
}

.modal.narrow { width: min(440px, 96vw); }
.modal.narrow .btn-primary { white-space: nowrap; }

.modal.daily-viewings-modal {
  max-height: calc(100vh - 32px);
  overflow-y: auto;
}

.group-count-warning-overlay { z-index: 300; }

.group-count-warning-message {
  color: var(--text);
  font-size: 15px;
  line-height: 1.55;
  margin-bottom: 24px;
}

.modal-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
}

.modal-top h2 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.modal-close {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.modal-close::before, .modal-close::after {
  content: '';
  position: absolute;
  width: 18px;
  height: 2px;
  background-color: var(--text);
  border-radius: 2px;
}
.modal-close::before { transform: rotate(45deg); }
.modal-close::after { transform: rotate(-45deg); }

.modal-close:hover {
  background-color: var(--danger);
  border-color: var(--danger);
  transform: rotate(90deg);
}
.modal-close:hover::before, .modal-close:hover::after {
  background-color: #fff;
}

/* Specifika färger för ikonerna i knapparna */
.action-btn[data-modal="school"] .fa-icon  { fill: #1971c2; } /* Blå */
.action-btn[data-modal="group"] .fa-icon   { fill: #2f9e44; } /* Grön */
.action-btn[data-modal="daily"] .fa-icon   { fill: #7048e8; } /* Lila */
.action-btn[data-modal="tickets"] .fa-icon { fill: #d6336c; } /* Rosa */
.action-btn[data-modal="sales"] .fa-icon   { fill: #495057; } /* Grå/Svart */
.action-btn[data-modal="cafe"] .fa-icon    { fill: #f08c00; } /* Orange */

/* Behåll hover-effekten men se till att den inte skriver över färgerna tråkigt */
.action-btn:hover .fa-icon { 
    transform: scale(1.1); 
    filter: brightness(0.9); /* Gör färgen aningen mörkare vid hover */
}

/* ── 7. FORMULÄR, INPUTS & SELECTS ── */
.field-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
  margin-top: 16px;
  display: block;
}

.field-label:first-child { margin-top: 0; }

select, input, textarea {
  width: 100%;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 12px;
  font-family: inherit;
  font-size: 15px;
  transition: all 0.2s;
}

select:focus, input:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}

textarea { min-height: 120px; resize: vertical; }

#fReport { min-height: 145px; }

input::placeholder, textarea::placeholder {
  color: var(--muted);
  opacity: 0.6;
  font-style: italic;
}

/* Datum-input specifikt */
.date-input-container {
  position: relative;
  width: 220px;
  display: flex;
  align-items: center;
}

.date-display-field {
  width: 100% !important;
  cursor: pointer;
  background: #fff !important;
  padding-right: 40px !important;
}

.date-icon {
  position: absolute;
  right: 12px;
  width: 18px;
  height: 18px;
  fill: var(--muted);
  pointer-events: auto;
  cursor: pointer;
  transition: fill 0.2s;
}

.date-input-container:hover .date-icon {
  fill: var(--accent);
}

input[type="date"] {
  width: 200px;
  min-width: 150px; 
}

/* Custom-select komponenter */
.custom-select-wrapper { position: relative; width: 100%; user-select: none; }

.custom-select-trigger {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px; border: 1px solid var(--border2);
  border-radius: var(--radius-sm); background: var(--surface);
  cursor: pointer; font-size: 15px; color: var(--text);
  transition: border-color 0.2s;
}

.custom-select-trigger:hover,
.custom-select-wrapper.open .custom-select-trigger {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}

.chevron {
  width: 16px; height: 16px; fill: var(--muted);
  transition: transform 0.2s; flex-shrink: 0;
}

.custom-select-wrapper.open .chevron { transform: rotate(180deg); }

.custom-select-dropdown {
  display: none; position: absolute; top: calc(100% + 4px); left: 0;
  min-width: 500px;
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: var(--radius-sm); z-index: 200;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}

.custom-select-wrapper.open .custom-select-dropdown { display: block; }

.dropdown-cols { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-flow: column; grid-template-rows: repeat(9, auto); padding: 8px; gap: 2px; }
.dropdown-cols-2 { display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-flow: column; grid-template-rows: repeat(7, auto); padding: 8px; gap: 2px; }
.dropdown-cols-2-r5 { 
  display: grid; 
  grid-template-columns: repeat(2, 1fr); 
  grid-auto-flow: column; 
  grid-template-rows: repeat(5, auto); /* Ändrat från repeat(4, auto) */
  padding: 8px; 
  gap: 2px; 
}

#groupTypeWrapper .custom-select-dropdown {
  width: 100%;
  min-width: 0;
}

#groupTypeDropdownCols .dropdown-option {
  white-space: normal;
  line-height: 1.35;
  overflow: visible;
}

.group-option-danger { color: var(--danger); }
.group-option-success { color: var(--success); }

.group-info {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 17px;
  height: 17px;
  margin-left: 5px;
  border: 1px solid var(--muted);
  border-radius: 50%;
  color: var(--muted);
  background: var(--surface);
  font-size: 11px;
  font-style: normal;
  font-weight: 700;
  line-height: 1;
  vertical-align: middle;
  cursor: help;
}

.group-info-tooltip {
  position: absolute;
  left: 50%;
  bottom: calc(100% + 7px);
  z-index: 300;
  width: max-content;
  max-width: 260px;
  padding: 7px 9px;
  border-radius: 5px;
  background: var(--text);
  color: var(--surface);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.35;
  text-align: left;
  white-space: normal;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translate(-50%, 3px);
  transition: opacity .15s, transform .15s, visibility .15s;
}

.group-info:hover .group-info-tooltip,
.group-info:focus .group-info-tooltip {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0);
}

.dropdown-option {
  padding: 7px 10px; border-radius: 4px; cursor: pointer;
  font-size: 14px; color: var(--text); transition: background 0.1s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.dropdown-option:hover { background: var(--accent-light); color: var(--accent); }
.dropdown-option.selected { background: var(--accent-light); color: var(--accent); font-weight: 600; }

/* Belopps-wrapper */
.amount-wrapper { position: relative; }

.amount-prefix {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-family: 'Inter', sans-serif; 
  font-weight: 500;
  pointer-events: none;
}

.amount-wrapper input { 
  padding-left: 36px; 
  font-family: 'Inter', sans-serif;
  font-variant-numeric: tabular-nums; 
}

/* ── 8. FORM-LAYOUT & KNAPPAR ── */
.form-row {
  display: flex;
  gap: 12px;
  margin-top: 16px;
}

.field-group {
  display: flex;
  flex-direction: column;
}

.main-field { flex: 0 0 80%; }
.side-field { flex: 1; }

.form-row .field-label { margin-top: 0; }

.group-type-field { margin-top: 16px; }

.group-count-fields {
  display: grid;
  gap: 10px;
  margin-top: 16px;
}

.group-count-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 110px;
  align-items: center;
  gap: 16px;
  padding: 10px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}

.group-count-label {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
}

.group-count-input { text-align: right; }
.group-count-input::placeholder { font-style: normal; }

.group-payment-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px 16px;
  margin-top: 16px;
  padding: 12px 16px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
}

.group-payment-question {
  flex: 1 1 360px;
  font-size: 14px;
  font-weight: 600;
}

.group-payment-choice {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: 14px;
}

.group-payment-choice input {
  width: auto;
  cursor: pointer;
}

.group-choice-section {
  margin-top: 16px;
  padding: 14px 16px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: space-between; /* Trycker frågan till vänster och knapparna till höger */
  gap: 16px;
  flex-wrap: wrap; /* Säkerställer responsivitet på mindre skärmar */
}

.group-choice-question {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.35;
  flex: 1; /* Låter texten ta så mycket plats som möjligt */
  min-width: 200px;
}

.group-choice-buttons {
  display: flex;
  gap: 10px;
  flex-shrink: 0; /* Förhindrar att knapparna trycks ihop för mycket */
}

.group-choice-button {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 34px;        /* Sänkt från 42px för ett mer kompakt intryck */
  padding: 6px 16px;       /* Justerad padding (från 10px 20px) för att spara vertikalt utrymme */
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.25;
  text-align: center;
  cursor: pointer;
  transition: all .18s;
  white-space: nowrap;     /* Förhindrar radbrytning inuti knappen */
}

.group-choice-button:hover {
  border-color: var(--accent);
  background: var(--accent-light);
}

.group-choice-button input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.group-choice-button:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}

.daily-viewings-section {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.daily-viewings-title {
  margin-bottom: 12px;
  font-size: 16px;
  font-weight: 700;
}

.daily-viewings-rows {
  display: grid;
  gap: 10px;
}

.daily-viewing-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 100px 36px;
  align-items: center;
  gap: 10px;
}

.daily-viewing-count { text-align: right; }
.daily-viewing-count::placeholder { font-style: normal; }

.daily-viewing-remove,
.daily-viewing-add {
  width: 36px;
  height: 36px;
  border: 1px solid var(--border2);
  border-radius: 50%;
  background: var(--surface);
  color: var(--muted);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  transition: all .2s;
}

.fa-icon {

  height: 50px;
  object-fit: contain;

// --- HJÄLPFUNKTIONER ---
function getDayName(dateStr) {
  const date = new Date(dateStr);
  return date.toLocaleDateString('sv-SE', { weekday: 'long' });
}

function updateDateDisplay(newDate) {
  const displayField = document.getElementById('fDateDisplay');
  if (displayField) {
    displayField.value = `${newDate} ${getDayName(newDate)}`;
  }
}

// Formaterar heltal till "# ###"
function fmtInt(n) {
  return Math.round(n).toLocaleString("sv-SE").replace(/\,/g, " ");
}

// Formaterar belopp till "# ###,##"
function fmtMoney(n) {
  return n.toLocaleString("sv-SE", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function swDate() {
  const now = new Date();
  const iso = new Intl.DateTimeFormat("sv-SE",{year:"numeric",month:"2-digit",day:"2-digit"}).format(now);
  return { iso };
}
const TODAY = swDate();
selectedDate = TODAY.iso < FIREBASE_START_DATE ? FIREBASE_START_DATE : TODAY.iso;

function esc(v) { return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function renderTimeInfo(e) {
  const createdTs = e.logTs || e._createdTs || "";
  const logDate = createdTs ? createdTs.split('T')[0] : "";
  const logTime = createdTs ? new Date(createdTs).toLocaleTimeString("sv-SE", {hour:"2-digit", minute:"2-digit"}) : "";
  const updatedTs = e._updatedTs || "";
  const updatedDate = updatedTs ? updatedTs.split('T')[0] : "";
  const isRevised = createdTs && updatedTs && updatedDate !== logDate;
  const revisedDate = isRevised ? updatedDate : "";
  const revisedTime = isRevised ? new Date(updatedTs).toLocaleTimeString("sv-SE", {hour:"2-digit", minute:"2-digit"}) : "";
  if (!createdTs) return "";
  return `<span>Registrerad ${logDate} kl. ${logTime}</span>${isRevised ? `<span>Reviderad ${revisedDate} kl. ${revisedTime}</span>` : ""}`;
}

function updateStats() {
  const getSum = (type) => entries.filter(e => e.type === type).reduce((s, e) => s + (e.count || 0), 0);
  const getRev = (type) => entries.filter(e => e.type === type).reduce((s, e) => s + (e.amount || 0), 0);

  // Antal besökare
  document.getElementById("statSchool").textContent = fmtInt(getSum("school"));
  document.getElementById("statGroup").textContent  = fmtInt(getSum("group"));
  
  // Separata intäkter
  document.getElementById("statTickets").textContent = fmtMoney(getRev("tickets"));
  document.getElementById("statSales").textContent   = fmtMoney(getRev("sales"));
  document.getElementById("statCafe").textContent    = fmtMoney(getRev("cafe"));

  // Kontrollera om dagsrapport är skriven
  const hasDaily = entries.some(e => e.type === "daily");
  const dailyBox = document.getElementById("statDaily");
  if (dailyBox) {
    dailyBox.classList.toggle("checked", hasDaily);
  }
}

function renderEntries() {
  const list = document.getElementById("entriesList");
  const empty = document.getElementById("emptyState");
  list.querySelectorAll(".entry-row").forEach(r=>r.remove());
  if (!entries.length) { empty.style.display="block"; updateStats(); return; }
  empty.style.display = "none";
  const sorted = [...entries].sort((a, b) => {
    if (entrySortKey === "type") {
      const aLabel = TYPE_LABELS[a.type] || a.type || "";
      const bLabel = TYPE_LABELS[b.type] || b.type || "";
      const typeComparison = aLabel.localeCompare(bLabel, "sv-SE");
      if (typeComparison !== 0) {
        return entrySortDirection === "asc" ? typeComparison : -typeComparison;
      }
      const aTypeTime = new Date(a.logTs || a._createdTs || 0).getTime() || 0;
      const bTypeTime = new Date(b.logTs || b._createdTs || 0).getTime() || 0;
      return aTypeTime - bTypeTime;
    }
    const aTime = new Date(a.logTs || a._createdTs || 0).getTime() || 0;
    const bTime = new Date(b.logTs || b._createdTs || 0).getTime() || 0;
    const comparison = aTime - bTime;
    return entrySortDirection === "asc" ? comparison : -comparison;
  });
  sorted.forEach(e => {
    const row = document.createElement("div");
    row.className = "entry-row";
    row.innerHTML = entryHtml(e);
    row.onclick = () => openEditModal(e);
    list.appendChild(row);
  });
  updateStats();
}

function updateEntrySortButtons() {
  document.querySelectorAll("[data-entry-sort]").forEach(button => {
    const isActive = button.dataset.entrySort === entrySortKey;
    button.classList.toggle("active", isActive);
    button.setAttribute("aria-pressed", String(isActive));
    const label = button.dataset.entrySort === "type" ? "Typ" : "Registreringstid";
    button.textContent = isActive ? `${label} ${entrySortDirection === "asc" ? "↑" : "↓"}` : label;
  });
}

document.querySelectorAll("[data-entry-sort]").forEach(button => {
  button.addEventListener("click", () => {
    const requestedKey = button.dataset.entrySort;
    if (entrySortKey === requestedKey) {
      entrySortDirection = entrySortDirection === "asc" ? "desc" : "asc";
    } else {
      entrySortKey = requestedKey;
      entrySortDirection = "asc";
    }
    updateEntrySortButtons();
    renderEntries();
  });
});

function entryHtml(e) {
  const timeInfo = renderTimeInfo(e);
  const icon = ICONS[e.type] || '';
  const label = TYPE_LABELS[e.type] || e.type;
  const badgeLabel = BADGE_LABELS[e.type] || label;

  let content = "";

  if (e.type === "school") {
    const noteRaw = e.school || ""; 
    const noteTruncated = noteRaw.length > 50 ? noteRaw.substring(0, 50) + "..." : noteRaw;
    
    // 1. Börja med den obligatoriska delen
    let titleString = `${esc(e.place)} – ${esc(e.level)}`;
    
    // 2. Lägg bara till bindestreck och notering om det faktiskt finns en notering
    if (noteTruncated) {
      titleString += ` – ${esc(noteTruncated)}`;
    }

    content = `
      <div class="entry-title">${titleString}</div>
      <div class="entry-meta">${fmtInt(e.count)} pers</div>`;
  } 
	else if (e.type === "group") {
		const paidBadge = e.paid ? ` · <span style="color:${e.paid === 'Ja' ? 'var(--success)' : 'var(--danger)'}; font-weight:600;">Betald: ${e.paid}</span>` : "";
		content = `
		  <div class="entry-title">${esc(e.groupType)}</div>
		  <div class="entry-meta">${fmtInt(e.count)} pers${paidBadge}${e.note ? " · " + esc(e.note) : ""}</div>`;
	  }
	else if (["tickets", "sales", "cafe"].includes(e.type)) {
		content = `
	      <div class="entry-title">${fmtMoney(e.amount)} kr</div>
		  <div class="entry-meta">${label}</div>`;
	  } 
  else if (e.type === "daily") {
    content = `
      <div class="entry-title truncate" style="font-weight:400;" title="${esc(e.report)}">${esc(e.report)}</div>
      <div class="entry-meta">Dagsrapport</div>`;
  }
  else if (e.type === "other") {
    const countsText = OTHER_COUNT_FIELDS
      .map(field => ({ label: field.label, value: Number(e.counts?.[field.key] || 0) }))
      .filter(item => item.value > 0)
      .map(item => `${item.label}: ${fmtInt(item.value)}`)
      .join(" · ");
    content = `
      <div class="entry-title">${esc(e.purpose || "Övrig data")}</div>
      <div class="entry-meta">${fmtInt(e.count || 0)} pers${countsText ? " · " + esc(countsText) : ""}</div>`;
  }
  
  return `<span class="entry-badge badge-${e.type}">${icon} ${badgeLabel}</span><div class="entry-body">${content}</div><div class="entry-time">${timeInfo}</div>`;
}

    : key === "other"
      ? (entry ? "Redigera övrig data" : "Registrera övrig data")
      : (entry ? "Redigera " : "Registrera ") + label;
  const modalBody = document.getElementById("modalBody");
  modalBody.innerHTML = builders[key](entry);

  // Stäng av webbläsarens autocomplete i alla textfält i registreringsmodalerna.
  // Inloggningsformuläret påverkas inte.
  modalBody.querySelectorAll('input[type="text"], input:not([type]), textarea').forEach(field => {
    field.setAttribute("autocomplete", "off");
  });

  document.getElementById("overlay").classList.add("open");
  const modalEl = document.querySelector(".modal");
  if (["tickets", "sales", "cafe"].includes(key)) {
    modalEl.classList.add("narrow");
  } else {
    modalEl.classList.remove("narrow");
  }
  modalEl.classList.toggle("daily-viewings-modal", key === "daily");
if (activeModal === "school") {

}
if (activeModal === "group") {

}
  document.getElementById("saveBtn").addEventListener("click", saveEntry);

paymentContainer.innerHTML = "";

function getGroupCountRangeMessage(input, field) {
  const rawValue = input.value.trim();
  if (!rawValue || !field?.rangeMessage) return "";

  const value = Number(rawValue);
  if (!Number.isFinite(value)) return "";
  if (field.max !== undefined && value > field.max) return field.rangeMessage;
  if (field.min !== undefined && value < field.min) return field.rangeMessage;
  return "";
}

function monthShortForDate(dateStr) {
  const monthIndex = Number(dateStr.slice(5, 7)) - 1;
  return MONTHS_SHORT[monthIndex].toLowerCase();
}

function makeRecordTimestamp(dateStr, existingTimestamp = null) {
  if (existingTimestamp) {
    const d = new Date(existingTimestamp);
    if (!Number.isNaN(d.getTime())) {
      const localDate = new Intl.DateTimeFormat("sv-SE", {year:"numeric", month:"2-digit", day:"2-digit"}).format(d);
      if (localDate === dateStr) return existingTimestamp;
    }
  }
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const ss = String(now.getSeconds()).padStart(2, "0");
  return new Date(`${dateStr}T${hh}:${mm}:${ss}`).toISOString();
}

function canonicalTypeForUiType(type) {
  return ({ school:"school", group:"group", tickets:"tickets", sales:"shop", cafe:"cafe", daily:"dailyReport", other:"other" })[type] || type;
}

function uiTypeForCanonicalType(type) {
  return ({ school:"school", group:"group", tickets:"tickets", shop:"sales", cafe:"cafe", dailyReport:"daily", other:"other" })[type] || type;
}

function buildFirebaseRecord(entry, dateStr, docId) {
  const nowIso = new Date().toISOString();
  const canonicalType = canonicalTypeForUiType(entry.type);
  const record = {
    id: String(docId),
    type: canonicalType,
    category: canonicalType === "group" ? entry.groupType : ({
      school: "Skolbesök",
      tickets: "Entréintäkter",
      shop: "Butiksförsäljning",
      cafe: "Kaféförsäljning",
      dailyReport: "Dagsrapport",
      other: "Övrig data"
    })[canonicalType],
    date: dateStr,
    timestamp: makeRecordTimestamp(dateStr, entry._timestamp),
    year: Number(dateStr.slice(0, 4)),
    month: Number(dateStr.slice(5, 7)),
    monthShort: monthShortForDate(dateStr),
    venue: VENUE,
    metadata: {
      createdTs: entry._createdTs || nowIso,
      updatedTs: nowIso,
      schemaVersion: 1
    }
  };

  if (canonicalType === "school") {
    record.details = {
      municipality: entry.place,
      level: entry.level
    };
    record.metrics = { totalCount: entry.count };
    if (entry.school) record.note = entry.school;
  }

  if (canonicalType === "group") {
    const counts = {};
    Object.entries(entry.counts || {}).forEach(([key, value]) => {
      const n = Number(value || 0);
      if (!n) return;
      const canonicalKey = key === "discount" ? "discountAdults" : key;
      counts[canonicalKey] = n;
    });
    record.metrics = { totalCount: entry.count };
    if (Object.keys(counts).length) record.metrics.counts = counts;

    const payments = {};
    if (entry.eventPayment) payments.eventPayment = entry.eventPayment;
    if (entry.entrancePayment) payments.entrancePayment = entry.entrancePayment;
    if (entry.bookedViewing === "Ja" || entry.bookedViewing === "Nej") {
      payments.bookedViewing = entry.bookedViewing === "Ja";
    }
    if (entry.viewingPayment) payments.viewingPayment = entry.viewingPayment;

    const paymentMethods = [entry.eventPayment, entry.entrancePayment, entry.viewingPayment].filter(Boolean);
    if (paymentMethods.length) {
      payments.isPaid = paymentMethods.every(method => method === "direct");
      payments.flags = {
        paymentCategory: Boolean(entry.eventPayment || entry.entrancePayment),
        entranceInvoice: entry.eventPayment === "invoice" || entry.entrancePayment === "invoice",
        viewingInvoice: entry.viewingPayment === "invoice"
      };
    }
    if (Object.keys(payments).length) record.payments = payments;
    if (entry.note) record.note = entry.note;
  }

  if (["tickets", "shop", "cafe"].includes(canonicalType)) {
    record.metrics = {
      amount: Number(entry.amount),
      currency: "SEK"
    };
  }

  if (canonicalType === "dailyReport") {
    record.details = {
      report: entry.report,
      viewings: entry.viewings || []
    };
  }

  if (canonicalType === "other") {
    const counts = {};
    Object.entries(entry.counts || {}).forEach(([key, value]) => {
      const n = Number(value || 0);
      if (n > 0) counts[key] = n;
    });
    record.details = { purpose: entry.purpose };
    record.metrics = {
      totalCount: Number(entry.count || 0),
      counts
    };
  }

  return record;
}

// Bygger en avskalad publik statistikpost från den interna dailyData-posten.
// Endast school, group och other får en motsvarighet i visitStats.
const VISIT_STATS_ADULT_SCHOOL_LEVELS = new Set([
  "Vuxenutbildning",
  "Högskola",
  "Högskola, universitet",
  "Lunds universitet",
  "Campus Helsingborg",
  "Malmö universitet",
  "Högskolan Kristianstad",
  "SLU"
]);

function addVisitStatCount(target, category, value) {
  const n = Number(value || 0);
  if (!n) return;
  target[category] = (target[category] || 0) + n;
}

function buildVisitStatsRecord(record) {
  if (!["school", "group", "other"].includes(record.type)) return null;

  const counts = {};
  let details = null;

  if (record.type === "school") {
    const level = String(record.details?.level || "").trim();
    const schoolCategory = VISIT_STATS_ADULT_SCHOOL_LEVELS.has(level)
      ? "skola-vuxen"
      : "skola-barn";
    addVisitStatCount(counts, schoolCategory, record.metrics?.totalCount);

    // Behövs av den publika skolbesökssidan. Ingen skolnotering följer med.
    details = {
      municipality: record.details?.municipality || "",
      level
    };
  }

  if (record.type === "group") {
    const sourceCounts = record.metrics?.counts || {};

    // Konferens lagras i inmatningssidan som freeAdults, men ska statistikföras som konferens.
    if (record.category === "Konferens och möte") {
      addVisitStatCount(counts, "konferens", sourceCounts.freeAdults);
    } else {
      addVisitStatCount(counts, "vuxen", sourceCounts.adults);
      addVisitStatCount(counts, "barn", sourceCounts.children);
      addVisitStatCount(counts, "fri-vuxen", sourceCounts.freeAdults);
      addVisitStatCount(counts, "rabatt", sourceCounts.discountAdults);
    }
  }

  if (record.type === "other") {
    const sourceCounts = record.metrics?.counts || {};
    addVisitStatCount(counts, "vuxen", sourceCounts.adults);
    addVisitStatCount(counts, "pensionär", sourceCounts.pensioners);
    addVisitStatCount(counts, "student", sourceCounts.students);
    addVisitStatCount(counts, "fri-vuxen", sourceCounts.freeAdults);
    addVisitStatCount(counts, "barn", sourceCounts.children);
    addVisitStatCount(counts, "medlem", sourceCounts.members);
  }

  const normalizedTotal = Object.values(counts).reduce((sum, value) => sum + Number(value || 0), 0);
  const sourceTotal = Number(record.metrics?.totalCount || 0);

  // Stoppa skrivningen om en framtida ändring i registreringsschemat annars skulle tappa besök.
  if (normalizedTotal !== sourceTotal) {
    throw new Error(
      `visitStats stämmer inte med dailyData för ${record.type}/${record.category || ""}: ` +
      `${normalizedTotal} av ${sourceTotal} besök har mappats.`
    );
  }

  const publicRecord = {
    sourceType: record.type,
    date: record.date,
    year: record.year,
    month: record.month,
    monthShort: record.monthShort,
    venue: record.venue,
    metrics: {
      totalCount: sourceTotal,
      counts
    },
    metadata: {
      updatedTs: record.metadata?.updatedTs || new Date().toISOString(),
      schemaVersion: 1
    }
  };

  if (details) publicRecord.details = details;
  return publicRecord;
}

// Bygger den publika dagsrapportpost som dagsrapportsidan får läsa.
// Endast dagsrapporter får en motsvarighet i dailyReports.
function buildDailyReportPublicRecord(record) {
  if (record.type !== "dailyReport") return null;

  const report = String(record.details?.report || "").trim();
  if (!report) {
    throw new Error("Dagsrapporten saknar rapporttext och kan inte publiceras.");
  }

  const viewings = Array.isArray(record.details?.viewings)
    ? record.details.viewings
        .map(viewing => ({
          name: String(viewing?.name || "").trim(),
          participants: Number(viewing?.participants || 0)
        }))
        .filter(viewing => viewing.name && Number.isInteger(viewing.participants) && viewing.participants > 0)
    : [];

  return {
    sourceType: "dailyReport",
    date: record.date,
    year: record.year,
    month: record.month,
    monthShort: record.monthShort,
    venue: record.venue,
    details: {
      report,
      viewings
    },
    metadata: {
      updatedTs: record.metadata?.updatedTs || new Date().toISOString(),
      schemaVersion: 1
    }
  };
}

function firebaseRecordToEntry(doc) {
  const record = doc.data();
  const uiType = uiTypeForCanonicalType(record.type);
  const date = record.date || "";
  const entry = {
    id: doc.id,
    type: uiType,
    date,
    ts: `${date}T12:00:00`,
    logTs: record.metadata?.createdTs || record.timestamp || "",
    _timestamp: record.timestamp || null,
    _createdTs: record.metadata?.createdTs || null,
    _updatedTs: record.metadata?.updatedTs || null
  };

  if (uiType === "school") {
    entry.place = record.details?.municipality || "Lund";
    entry.level = record.details?.level || "";
    entry.count = Number(record.metrics?.totalCount || 0);
    entry.school = record.note || "";
  }

  if (uiType === "group") {
    entry.groupType = record.category || "";
    entry.count = Number(record.metrics?.totalCount || 0);
    entry.counts = {};
    Object.entries(record.metrics?.counts || {}).forEach(([key, value]) => {
      const uiKey = key === "discountAdults" ? "discount" : key;
      entry.counts[uiKey] = Number(value || 0);
    });
    entry.note = record.note || "";
    entry.eventPayment = record.payments?.eventPayment || "";
    entry.entrancePayment = record.payments?.entrancePayment || "";
    entry.viewingPayment = record.payments?.viewingPayment || "";
    if (typeof record.payments?.bookedViewing === "boolean") {
      entry.bookedViewing = record.payments.bookedViewing ? "Ja" : "Nej";
    }
    if (typeof record.payments?.isPaid === "boolean") {
      entry.paid = record.payments.isPaid ? "Ja" : "Nej";
    }
  }

  if (["tickets", "sales", "cafe"].includes(uiType)) {
    entry.amount = Number(record.metrics?.amount || 0);
  }

  if (uiType === "daily") {
    entry.report = record.details?.report || "";
    entry.viewings = Array.isArray(record.details?.viewings) ? record.details.viewings : [];
  }

  if (uiType === "other") {
    entry.purpose = record.details?.purpose || "";
    entry.count = Number(record.metrics?.totalCount || 0);
    entry.counts = {};
    Object.entries(record.metrics?.counts || {}).forEach(([key, value]) => {
      entry.counts[key] = Number(value || 0);
    });
  }

  return entry;
}

function updateHeaderDate(dateStr) {
  const label = document.getElementById("dateline");
  const picker = document.getElementById("headerDatePicker");
  if (label) label.textContent = `${dateStr} ${getDayName(dateStr)}`;
  if (picker) picker.value = dateStr;
}

function openHeaderDatePicker() {
  const picker = document.getElementById("headerDatePicker");
  if (!picker) return;
  if (typeof picker.showPicker === "function") picker.showPicker();
  else picker.focus();
}

function subscribeToDate(dateStr) {
  if (dateStr < FIREBASE_START_DATE) dateStr = FIREBASE_START_DATE;
  if (dateStr > TODAY.iso) dateStr = TODAY.iso;

  selectedDate = dateStr;
  updateHeaderDate(dateStr);
  if (unsubscribeDay) unsubscribeDay();

  const empty = document.getElementById("emptyState");
  if (!db) {
    entries = [];
    renderEntries();
    if (empty) {
      empty.style.display = "block";
      empty.textContent = "Firebase för Kulturens dagsdata är ännu inte konfigurerat.";
    }
    return;
  }
  if (!auth?.currentUser) {
    entries = [];
    renderEntries();
    if (empty) {
      empty.style.display = "block";
      empty.textContent = "Logga in för att hämta dagsdata.";
    }
    return;
  }
  if (empty) {
    empty.style.display = "block";
    empty.textContent = "Hämtar dagens registreringar…";
  }

  unsubscribeDay = db.collection(FIREBASE_COLLECTION)
    .where("date", "==", dateStr)
    .where("venue", "==", VENUE)
    .onSnapshot(snapshot => {
      entries = snapshot.docs.map(firebaseRecordToEntry);
      if (empty) empty.textContent = "Inga händelser registrerade än.";
      renderEntries();
    }, error => {
      console.error("Kunde inte hämta Firebase-data:", error);
      entries = [];
      renderEntries();
      if (empty) {
        empty.style.display = "block";
        empty.textContent = "Kunde inte hämta data från Firebase.";
      }
    });
}

function setStatus(msg, cls) { const el = document.getElementById("formStatus"); if (el) { el.textContent = msg; el.className = "status-msg " + (cls||""); } }

async function saveEntry() {
  if (!db) {
    setStatus("Firebase är ännu inte konfigurerat för Kulturens dagsdata.", "error");
    return;
  }
  if (!auth?.currentUser) {
    closeModal();
    showLoginModal();
    return;
  }
  const selectedEntryDate = document.getElementById("fDate").value || selectedDate;
  const now = new Date();
  const existingDayEntry = (["cafe", "tickets", "sales", "daily"].includes(activeModal))
    ? entries.find(e => e.type === activeModal && (e.date || e.ts?.split('T')[0]) === selectedEntryDate)
    : null;

  const sourceEntry = editingId ? entries.find(e => e.id === editingId) : existingDayEntry;
  const id = sourceEntry?.id || null;
  let entry = {
    id,
    type: activeModal,
    _timestamp: sourceEntry?._timestamp || null,
    _createdTs: sourceEntry?._createdTs || null
  };

  const resetStyle = (el) => {
    if (el) {
      el.style.borderColor = "";
      el.style.boxShadow = "";
    }
  };
  document.querySelectorAll('input, textarea, .custom-select-trigger, .group-choice-section').forEach(resetStyle);
  setStatus("", "");

  if (activeModal === "school") {
    entry.place = document.getElementById("fPlace").value;
    entry.school = document.getElementById("fSchool").value.trim();
    entry.level = document.getElementById("fLevel").value;
    entry.count = parseInt(document.getElementById("fCount").value) || 0;

    const levelTrigger = document.getElementById("levelSelectWrapper").querySelector(".custom-select-trigger");
    const countInput = document.getElementById("fCount");

    if (!entry.level && !entry.count) {
      levelTrigger.style.borderColor = "var(--danger)";
      levelTrigger.style.boxShadow = "0 0 0 3px rgba(201,42,42,0.15)";
      countInput.style.borderColor = "var(--danger)";
      countInput.style.boxShadow = "0 0 0 3px rgba(201,42,42,0.15)";
      setStatus("Välj skolnivå och ange antal elever.", "error");
      return;
    }
    if (!entry.level) {
      levelTrigger.style.borderColor = "var(--danger)";
      levelTrigger.style.boxShadow = "0 0 0 3px rgba(201,42,42,0.15)";
      setStatus("Välj en skolnivå.", "error");
      return;
    }
    if (!entry.count) {
      countInput.style.borderColor = "var(--danger)";
      countInput.style.boxShadow = "0 0 0 3px rgba(201,42,42,0.15)";
      setStatus("Ange antal elever.", "error");
      return;
    }

  } else if (activeModal === "group") {
    entry.groupType = document.getElementById("fGroupType").value;
    const groupTrigger = document.getElementById("groupTypeWrapper").querySelector(".custom-select-trigger");

    if (!entry.groupType) {
      groupTrigger.style.borderColor = "var(--danger)";
      groupTrigger.style.boxShadow = "0 0 0 3px rgba(201,42,42,0.15)";
      setStatus("Välj typ av grupp.", "error");
      return;
    }

    const groupType = GROUP_TYPES.find(type => type.value === entry.groupType);
    const countInputs = [...document.querySelectorAll(".group-count-input")];
    const hasInvalidCount = countInputs.some(input => {
      const value = Number(input.value || 0);
      return !Number.isInteger(value) || value < 0;
    });

    if (hasInvalidCount) {
      countInputs.forEach(input => {
        const value = Number(input.value || 0);
        if (!Number.isInteger(value) || value < 0) {
          input.style.borderColor = "var(--danger)";
          input.style.boxShadow = "0 0 0 3px rgba(201,42,42,0.15)";
        }
      });
      setStatus("Antal måste anges med heltal, noll eller större.", "error");
      return;
    }

    const rangeError = countInputs.map(input => {
      const field = groupType.countFields.find(item => item.key === input.dataset.countKey);
      return { input, message: getGroupCountRangeMessage(input, field) };
    }).find(result => result.message);

    if (rangeError) {
      markGroupCountInvalid(rangeError.input);
      openGroupCountWarning(rangeError.message, rangeError.input);
      return;
    }

    const missingRequiredCount = countInputs.map(input => {
      const field = groupType.countFields.find(item => item.key === input.dataset.countKey);
      return { input, field, value: Number(input.value || 0) };
    }).find(result => result.field?.required && result.value <= 0);

    if (missingRequiredCount) {
      missingRequiredCount.input.style.borderColor = "var(--danger)";
      missingRequiredCount.input.style.boxShadow = "0 0 0 3px rgba(201,42,42,0.15)";
      setStatus(`Ange ${missingRequiredCount.field.label.toLowerCase()}.`, "error");
      return;
    }

    entry.counts = Object.fromEntries(countInputs.map(input => [
      input.dataset.countKey,
      Number(input.value || 0)
    ]));
    entry.count = Object.values(entry.counts).reduce((sum, count) => sum + count, 0);

    if (entry.count === 0) {
      countInputs.forEach(input => {
        input.style.borderColor = "var(--danger)";
        input.style.boxShadow = "0 0 0 3px rgba(201,42,42,0.15)";
      });
      setStatus("Ange antal personer i minst en kategori.", "error");
      return;
    }

    if (groupType?.eventPaymentQuestion) {
      const eventPaymentRadio = document.querySelector('input[name="fEventPayment"]:checked');
      if (!eventPaymentRadio) {
        markGroupChoiceInvalid("eventPaymentRow");
        setStatus("Ange hur evenemanget betalas.", "error");
        return;
      }
      entry.eventPayment = eventPaymentRadio.value;
    }

    if (groupType?.entrancePaymentQuestion) {
      const entrancePaymentRadio = document.querySelector('input[name="fEntrancePayment"]:checked');
      if (!entrancePaymentRadio) {
        markGroupChoiceInvalid("entrancePaymentRow");
        setStatus("Ange hur entréavgiften betalas.", "error");
        return;
      }
      entry.entrancePayment = entrancePaymentRadio.value;
    }

    if (groupType?.viewingQuestion) {
      const bookedViewingRadio = document.querySelector('input[name="fBookedViewing"]:checked');
      if (!bookedViewingRadio) {
        markGroupChoiceInvalid("bookedViewingRow");
        setStatus("Ange om gruppen har bokat en visning.", "error");
        return;
      }
      entry.bookedViewing = bookedViewingRadio.value;

      if (entry.bookedViewing === "Ja") {
        const viewingPaymentRadio = document.querySelector('input[name="fViewingPayment"]:checked');
        if (!viewingPaymentRadio) {
          markGroupChoiceInvalid("viewingPaymentChoiceRow");
          setStatus("Ange hur visningen betalas.", "error");
          return;
        }
        entry.viewingPayment = viewingPaymentRadio.value;
      }
    }

    entry.note = document.getElementById("fNote").value.trim();

  } else if (activeModal === "other") {
    const purposeInput = document.getElementById("fOtherPurpose");
    entry.purpose = purposeInput.value.trim();
    if (!entry.purpose) {
      purposeInput.style.borderColor = "var(--danger)";
      purposeInput.style.boxShadow = "0 0 0 3px rgba(201,42,42,0.15)";
      setStatus("Ange vad besöken avser.", "error");
      return;
    }

    const countInputs = [...document.querySelectorAll(".other-count-input")];
    let invalid = false;
    entry.counts = {};
    countInputs.forEach(input => {
      const raw = input.value.trim();
      const value = raw === "" ? 0 : Number(raw);
      if (!Number.isInteger(value) || value < 0) {
        input.style.borderColor = "var(--danger)";
        input.style.boxShadow = "0 0 0 3px rgba(201,42,42,0.15)";
        invalid = true;
      } else {
        entry.counts[input.dataset.otherCountKey] = value;
      }
    });
    if (invalid) {
      setStatus("Antal måste anges med heltal, noll eller större.", "error");
      return;
    }
    entry.count = Object.values(entry.counts).reduce((sum, value) => sum + value, 0);
    if (entry.count === 0) {
      countInputs.forEach(input => {
        input.style.borderColor = "var(--danger)";
        input.style.boxShadow = "0 0 0 3px rgba(201,42,42,0.15)";
      });
      setStatus("Ange antal besökare i minst en kategori.", "error");
      return;
    }

  } else if (["cafe", "tickets", "sales"].includes(activeModal)) {
    const amountInput = document.getElementById("fTotalAmount");
    const totalVal = parseFloat(amountInput.value);
    if (isNaN(totalVal) || totalVal <= 0) {
      amountInput.style.borderColor = "var(--danger)";
      amountInput.style.boxShadow = "0 0 0 3px rgba(201,42,42,0.15)";
      setStatus("Ange ett giltigt belopp.", "error");
      return;
    }
    entry.amount = totalVal;

  } else if (activeModal === "daily") {
    const reportInput = document.getElementById("fReport");
    entry.report = reportInput.value.trim();
    if (!entry.report) {
      reportInput.style.borderColor = "var(--danger)";
      reportInput.style.boxShadow = "0 0 0 3px rgba(201,42,42,0.15)";
      setStatus("Rapporten kan inte vara tom.", "error");
      return;
    }

    const viewingRows = [...document.querySelectorAll("[data-viewing-row]")];
    const viewings = [];
    let hasInvalidViewing = false;
    viewingRows.forEach(row => {
      const nameInput = row.querySelector(".daily-viewing-name");
      const countInput = row.querySelector(".daily-viewing-count");
      const name = nameInput.value.trim();
      const rawCount = countInput.value.trim();
      if (!name && !rawCount) return;
      const participants = Number(rawCount);
      if (!name) {
        nameInput.style.borderColor = "var(--danger)";
        nameInput.style.boxShadow = "0 0 0 3px rgba(201,42,42,0.15)";
        hasInvalidViewing = true;
      }
      if (!rawCount || !Number.isInteger(participants) || participants < 1) {
        countInput.style.borderColor = "var(--danger)";
        countInput.style.boxShadow = "0 0 0 3px rgba(201,42,42,0.15)";
        hasInvalidViewing = true;
      }
      if (name && rawCount && Number.isInteger(participants) && participants >= 1) {
        viewings.push({ name, participants });
      }
    });
    if (hasInvalidViewing) {
      setStatus("Fyll i både visning och ett giltigt antal deltagare.", "error");
      return;
    }
    entry.viewings = viewings;
  }

  const saveButton = document.getElementById("saveBtn");
  if (saveButton) {
    saveButton.disabled = true;
    saveButton.textContent = "Sparar…";
  }

  try {
    const docRef = id
      ? db.collection(FIREBASE_COLLECTION).doc(String(id))
      : db.collection(FIREBASE_COLLECTION).doc();
    const statsRef = db.collection(VISIT_STATS_COLLECTION).doc(docRef.id);
    const reportRef = db.collection(DAILY_REPORTS_COLLECTION).doc(docRef.id);
    const record = buildFirebaseRecord(entry, selectedEntryDate, docRef.id);
    const visitStatsRecord = buildVisitStatsRecord(record);
    const dailyReportPublicRecord = buildDailyReportPublicRecord(record);

    // Samma batch håller intern rådata och respektive publika samling i synk.
    const batch = db.batch();
    batch.set(docRef, record);
    if (visitStatsRecord) {
      batch.set(statsRef, visitStatsRecord);
    } else {
      // Säkerhetsstädning: intäkter/dagsrapport ska aldrig ligga i visitStats.
      batch.delete(statsRef);
    }
    if (dailyReportPublicRecord) {
      batch.set(reportRef, dailyReportPublicRecord);
    } else {
      // Säkerhetsstädning: endast dagsrapporter ska ligga i dailyReports.
      batch.delete(reportRef);
    }
    await batch.commit();

    closeModal();
    if (selectedEntryDate !== selectedDate) subscribeToDate(selectedEntryDate);
  } catch (error) {
    console.error("Kunde inte spara Firebase-posten:", error);
    setStatus("Kunde inte spara. Kontrollera nätverk eller Firebase-behörighet.", "error");
    if (saveButton) {
      saveButton.disabled = false;
      saveButton.textContent = editingId ? "Spara ändringar" : "Spara";
    }
  }
}


function showLoginModal(message = "") {
  const overlay = document.getElementById("authLoginOverlay");
  const status = document.getElementById("authLoginStatus");
  if (status) status.textContent = message;
  if (overlay) overlay.classList.add("open");
  setTimeout(() => document.getElementById("authEmail")?.focus(), 0);
}

function hideLoginModal() {
  document.getElementById("authLoginOverlay")?.classList.remove("open");
  const status = document.getElementById("authLoginStatus");
  if (status) status.textContent = "";
  const password = document.getElementById("authPassword");
  if (password) password.value = "";
}

function setSignedInUser(user) {
  const logoutButton = document.getElementById("authLogoutButton");
  if (logoutButton) logoutButton.style.display = user ? "flex" : "none";
}

function friendlyAuthError(error) {
  const code = error?.code || "";
  if (["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found", "auth/invalid-email"].includes(code)) {
    return "Fel e-postadress eller lösenord.";
  }
  if (code === "auth/too-many-requests") return "För många inloggningsförsök. Försök igen senare.";
  if (code === "auth/network-request-failed") return "Nätverksfel. Kontrollera anslutningen och försök igen.";
  return "Inloggningen misslyckades.";
}

async function loginWithEmailPassword(event) {
  event.preventDefault();
  if (!auth) return;
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const button = document.getElementById("authLoginButton");
  const status = document.getElementById("authLoginStatus");
  if (status) status.textContent = "";
  button.disabled = true;
  button.textContent = "Loggar in…";
  try {
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    await auth.signInWithEmailAndPassword(email, password);
  } catch (error) {
    console.error("Firebase-inloggning misslyckades:", error);
    if (status) status.textContent = friendlyAuthError(error);
  } finally {
    button.disabled = false;
    button.textContent = "Logga in";
  }
}

async function logoutFirebaseUser() {
  if (!auth) return;
  try {
    await auth.signOut();
  } catch (error) {
    console.error("Kunde inte logga ut:", error);
  }
}

document.querySelectorAll(".action-btn[data-modal], .btn-other-data[data-modal]").forEach(btn => {
  btn.addEventListener("click", () => openModal(btn.dataset.modal));
});
document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });
document.addEventListener("click", () => {
  document.querySelectorAll(".custom-select-wrapper.open")
    .forEach(w => w.classList.remove("open"));
});
document.getElementById("deleteOverlay").addEventListener("click", e => {
  if (e.target.id === "deleteOverlay") closeDeleteModal();
});
document.getElementById("groupCountWarningOverlay").addEventListener("click", e => {
  if (e.target.id === "groupCountWarningOverlay") closeGroupCountWarning();
});

const headerDatePicker = document.getElementById("headerDatePicker");
headerDatePicker.min = FIREBASE_START_DATE;
headerDatePicker.max = TODAY.iso;
headerDatePicker.value = selectedDate;
headerDatePicker.addEventListener("change", event => subscribeToDate(event.target.value));

document.getElementById("authLoginForm").addEventListener("submit", loginWithEmailPassword);
document.getElementById("authLogoutButton").addEventListener("click", logoutFirebaseUser);

if (auth) {
  auth.onAuthStateChanged(user => {
    setSignedInUser(user);
    if (user) {
      hideLoginModal();
      subscribeToDate(selectedDate);
    } else {
      if (unsubscribeDay) {
        unsubscribeDay();
        unsubscribeDay = null;
      }
      entries = [];
      renderEntries();
      showLoginModal();
    }
  });
} else {
  showLoginModal("Firebase Authentication är inte konfigurerat.");
}
</script>
</body>
