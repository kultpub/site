const comparison = { active: false, values: [] };
const comparisonMonths = ['Januari','Februari','Mars','April','Maj','Juni','Juli','Augusti','September','Oktober','November','December'];
function bindComparisonCell(cell, value, year, month) {
    if (!Number.isFinite(value)) return;
    const data = { value, year, month, periodType: month === null ? 'total' : 'månad',
        visitType: 'Kaféförsäljning', venue: 'Kulturen i Lund', categories: [],
        months: month === null ? [...selectedMonths].sort((a,b) => a-b) : [month] };
    cell.comparisonData = data;
    cell.classList.add('comparison-value');
    paintComparisonCell(cell);
}
function comparisonKey(data) { return JSON.stringify(data); }
function comparisonAllowed(a, b) {
    return a.visitType === b.visitType && (a.periodType === b.periodType || a.year === b.year);
}
function paintComparisonCell(cell) {
    const index = comparison.values.findIndex(v => comparisonKey(v) === comparisonKey(cell.comparisonData));
    cell.classList.toggle('comparison-selected', index >= 0);
    if (index >= 0) cell.dataset.comparisonNumber = index + 1;
    else delete cell.dataset.comparisonNumber;
    if (comparison.active) cell.tabIndex = 0;
    else cell.removeAttribute('tabindex');
}
function comparisonPeriod(v) {
    if (v.month !== null) return `${comparisonMonths[v.month]} ${v.year}`;
    return v.months.length === 12 ? `Årsutfallet ${v.year}` : `Totalt ${v.year} (${v.months.map(m => monthNamesShort[m]).join(', ') || 'inga månader'})`;
}
function comparisonDescription(v, lowercaseMonth = false) {
    if (v.month === null) {
        if (v.months.length === 12) return `årsresultat ${v.year}`;
        return `total ${v.year} (${v.months.map(m => monthNamesShort[m].toLowerCase()).join(', ')})`;
    }
    const monthName = comparisonMonths[v.month];
    const formattedMonth = lowercaseMonth ? monthName.toLocaleLowerCase('sv-SE') : monthName;
    return `${formattedMonth} ${v.year}`;
}
function renderComparisonResult(content) {
    const [a,b] = comparison.values; // a = tidigaste/månad, b = senaste/total
    const visitLabel = a.visitType.toLocaleLowerCase('sv-SE');
    const element = (tag, className, text, parent = content) => {
        const node = document.createElement(tag);
        node.className = className;
        if (text !== undefined) node.textContent = text;
        parent.appendChild(node);
        return node;
    };
    const pct = n => n.toLocaleString('sv-SE', {minimumFractionDigits:1, maximumFractionDigits:1});
    const cards = element('div', 'comparison-grid');
    
    [a,b].forEach((v,i) => {
        const card = element('div', 'comparison-card', undefined, cards);
        element('h4', 'comparison-label', comparisonDescription(v), card);
        element('strong', 'comparison-number', `${formatSEK(v.value)} kr`, card);
        element('span', 'comparison-caption', visitLabel, card);
    });
    
    const month = a.month !== null ? a : b;
    const total = a.month === null ? a : b;
    const partOfWhole = a.periodType !== b.periodType && a.year === b.year && a.visitType === b.visitType && a.venue === b.venue && JSON.stringify(a.categories) === JSON.stringify(b.categories) && total.months.includes(month.month);
    
    if (partOfWhole) {
        const result = element('div', 'comparison-result');
        element('span', 'comparison-caption', 'Andel av totalen', result);
        element('strong', 'comparison-number', total.value === 0 ? 'Kan inte beräknas' : `${pct(month.value / total.value * 100)} %`, result);
        element('div', '', `${comparisonDescription(month)} av ${comparisonDescription(total)}`, result);
        if (total.value === 0) element('div', 'comparison-caption', `Totalen är 0 kr.`, result);
    } else {
        const results = element('div', 'comparison-grid');
        [[a,b],[b,a]].forEach(([x,y]) => {
            const result = element('div', 'comparison-result', undefined, results);
            const comparisonTitleText = `${comparisonDescription(x, false)} jämfört med ${comparisonDescription(y, true)}`;
            element('span', 'comparison-caption', comparisonTitleText, result);
            
            // Beräkna procent utan tecken, men sätt rätt färgklass
            let percentageText = '0,0 %';
            let colorClass = '';
            
            if (x.value !== y.value && y.value === 0) {
                percentageText = '—';
            } else if (x.value !== y.value) {
                const percentageValue = pct(Math.abs(x.value - y.value) / Math.abs(y.value) * 100);
                percentageText = `${percentageValue} %`;
                if (x.value > y.value) {
                    colorClass = 'positive'; // Grön för fler
                } else {
                    colorClass = 'negative'; // Röd för färre
                }
            }

            const numberEl = element('strong', `comparison-number ${colorClass}`, percentageText, result);
            
            element('div', '', x.value === y.value ? `lika stor ${visitLabel}` : y.value === 0 ? 'Kan inte beräknas: jämförelsevärdet är 0.' : `${x.value < y.value ? 'lägre' : 'högre'} ${visitLabel}`, result);
        });
        element('div', 'comparison-difference', `Skillnad i kronor: ${formatSEK(Math.abs(a.value-b.value))} kr`);
    }
}
function refreshComparison() {
    document.getElementById('statsTable').classList.toggle('comparison-active', comparison.active);
    document.querySelectorAll('#statsTable .comparison-value').forEach(paintComparisonCell);
    
    const status = document.getElementById('comparisonStatus');
    const hasState = comparison.active || comparison.values.length > 0;
    status.style.display = hasState ? 'block' : 'none';
    status.hidden = !hasState;
    
    const textEl = document.getElementById('comparisonStatusText');
    const text = comparison.active ?
        (comparison.values.length ? 'Välj värde 2.' : 'Välj två värden.') : 'Två värden valda.';
    
    textEl.textContent = text;

    // Sätt på pulseringen så länge vi väntar på val 1 eller val 2
    status.classList.remove('status-blink');
    if (text === 'Välj två värden.' || text === 'Välj värde 2.') {
        status.classList.add('status-blink');
    }
}
function resetComparison() { comparison.active = false; comparison.values = []; refreshComparison(); }
const comparisonDialog = document.getElementById('comparisonDialog');
let comparisonInstruction = false;
let comparisonReturnFocus;
function openComparisonDialog(instruction) {
    comparisonInstruction = instruction;
    comparisonReturnFocus = document.activeElement;
    document.getElementById('comparisonTitle').textContent = instruction ? 'Jämför två värden' : 'Din jämförelse';
    
    // NYTT: Sätt unik bredd beroende på vilken modal som öppnas

function closeComparisonDialog() {

        resetComparison();
    }

document.getElementById('startComparison').onclick = () => { resetComparison(); openComparisonDialog(true); };

document.getElementById('comparisonContinue').onclick = () => {
    if (comparisonInstruction) { comparison.active = true; refreshComparison(); }
    closeComparisonDialog();
};
document.getElementById('comparisonClose').onclick = closeComparisonDialog;
comparisonDialog.addEventListener('cancel', e => { e.preventDefault(); closeComparisonDialog(); });
comparisonDialog.addEventListener('click', e => { if (e.target === comparisonDialog) { const r = comparisonDialog.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closeComparisonDialog(); } });
function selectComparisonCell(event) {
    if (!comparison.active) return;
    const cell = event.target.closest('td.comparison-value');
    if (!cell || !cell.comparisonData) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    if (comparison.values.some(v => comparisonKey(v) === comparisonKey(cell.comparisonData))) return;
    if (comparison.values.length && !comparisonAllowed(comparison.values[0], cell.comparisonData)) {
        refreshComparison();
        const reason = 'Månad mot total kräver samma år.';
        
        const modal = document.getElementById("dataModal");
        const modalContent = modal.querySelector(".modal-content");
        modalContent.className = "modal-content";
        modalContent.style.width = "420px";
        modal.querySelector("h3").textContent = "Går ej att jämföra";
        document.getElementById("modalMessage").innerHTML = `
            <div style="text-align: left; line-height: 1.5; font-size: 16px; margin-top: 10px;">
                ${reason}<br><br>
                Första valet (${comparisonDescription(comparison.values[0])}) finns kvar. Välj ett giltigt andra värde.
            </div>
        `;
        modal.style.display = "flex";
        return;
    }
    
    comparison.values.push(JSON.parse(JSON.stringify(cell.comparisonData)));
    
    if (comparison.values.length === 2) {
        comparison.active = false;

        comparison.values.sort((a, b) => {
            if (a.periodType !== b.periodType) {
                return a.periodType === 'månad' ? -1 : 1;
            }
            const timeA = a.year * 12 + (a.month !== null ? a.month : 0);
            const timeB = b.year * 12 + (b.month !== null ? b.month : 0);
            return timeA - timeB;
        });

        refreshComparison();
        
        // FÖRDRÖJNING: Vänta 350 ms så att användaren hinner se att den andra cellen markeras
        setTimeout(() => {
            if (comparison.values.length === 2) openComparisonDialog(false);
        }, 350);
        return;
    }

    refreshComparison();
}

        copyBtn.style.cssText = 'width: auto; padding: 8px 16px; margin: 10px 0 20px 0;';
        copyBtn.textContent = 'Kopiera länk till sidan';
        copyBtn.onclick = () => {
            navigator.clipboard.writeText(window.location.protocol === "file:" ? "https://kultpub.github.io/site/kafeforsaljning.html" : window.location.href).then(() => {
                copyBtn.textContent = 'Länken kopierad!';
                setTimeout(() => { copyBtn.textContent = 'Kopiera länk till sidan'; }, 2000);
            }).catch(() => { copyBtn.textContent = 'Kopiera adressen från webbläsarens adressfält'; });

document.getElementById('aiClose').onclick = () => aiModal.close();
document.getElementById('aiCloseBtn').onclick = () => aiModal.close();
aiModal.addEventListener('cancel', e => { e.preventDefault(); aiModal.close(); });
aiModal.addEventListener('click', e => {
    if (e.target === aiModal) {
        const r = aiModal.getBoundingClientRect();
        if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) aiModal.close();
    }
});

// Gemensamt för entré-, butiks- och kafésidan. Samma appnamn delar sessionen
// mellan dessa sidor på samma domän, separat från registreringssidans standardapp.
// Tilldela nya ekonomikonton i Firebase Authentication. Behörighet ges serverledes
// via economyAccess/{uid} med active: true. Saknad behörighet ger alltid avslag.
const ECONOMY_APP_NAME = "kulturen-ekonomi";
const ECONOMY_ACCESS_COLLECTION = "economyAccess";
let economyApp = null;
let economyAuth = null;
let economyAuthorized = false;
let economySessionVersion = 0;
let unsubscribeEconomyAccess = null;
let historicalRequestVersion = 0;
let historicalAbortController = null;
let economyAuthMessage = "";

function setEconomyContentLocked(locked) {
    document.body.classList.toggle("economy-locked", locked);
    document.querySelectorAll(".economy-protected").forEach(element => {
        element.inert = locked;
        if (locked) element.setAttribute("aria-hidden", "true");
        else element.removeAttribute("aria-hidden");
    });
    document.getElementById("authLogoutButton").hidden = locked;
}

function showLoginModal(message = "") {
    const overlay = document.getElementById("authLoginOverlay");
    document.getElementById("authLoginStatus").textContent = message;
    overlay.classList.add("open");
    setEconomyContentLocked(true);
    setTimeout(() => {
        if (!economyAuthorized) document.getElementById("authEmail").focus();
    }, 0);
}

function hideLoginModal() {
    document.getElementById("authLoginOverlay").classList.remove("open");
    document.getElementById("authLoginStatus").textContent = "";
    document.getElementById("authPassword").value = "";
    setEconomyContentLocked(false);
    document.getElementById("btnTable").focus();
}

function clearEconomyData() {
    economyAuthorized = false;
    ++revenueSubscriptionVersion;
    if (unsubscribeRevenue) unsubscribeRevenue();
    unsubscribeRevenue = null;
    ++historicalRequestVersion;
    if (historicalAbortController) historicalAbortController.abort();
    historicalAbortController = null;
    historicalRevenueRows = [];
    firebaseRevenueRows = [];
    revenueRows = [];
    availableYears = [];
    lastFilteredData = [];
    weeklyRowsCache = monthlyRowsCache = quickDataFactsCache = null;
    historicalReady = firebaseReady = revenueUiInitialized = false;
    historicalError = firebaseError = null;
    firebaseInvalidCount = 0;
    startYear = startMonth = endYear = endMonth = undefined;
    selectedMonths = new Set([...Array(12).keys()]);
    resetDataSort();
    resetComparison();
    const table = document.getElementById("statsTable");
    table.querySelector("thead").replaceChildren();
    table.querySelector("tbody").replaceChildren();
    ["dataTableHead", "dataTableBody", "quickDataFacts", "tableInfoFacts",
        "comparisonContent", "aiModalContent", "modalMessage",
        "fromYearCols", "toYearCols", "fromMonthCols", "toMonthCols"].forEach(id => {
        document.getElementById(id).replaceChildren();
    });
    ["fromYearLabel", "toYearLabel"].forEach(id => document.getElementById(id).textContent = "År");
    ["fromMonthLabel", "toMonthLabel"].forEach(id => document.getElementById(id).textContent = "Månad");
    ["tableHeaderDisplay", "chartHeaderDisplay", "dataHeaderDisplay"].forEach(id => {
        document.getElementById(id).textContent = "";
    });
    ["comparisonDialog", "aiModal"].forEach(id => {
        const dialog = document.getElementById(id);
        if (dialog.open) dialog.close();
    });
    document.getElementById("dataModal").style.display = "none";
    if (myChart) myChart.destroy();
    myChart = null;
    updateDataSourceStatus();
    setEconomyContentLocked(true);
}

function friendlyAuthError(error) {
    const code = error?.code || "";
    if (["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found", "auth/invalid-email", "auth/user-disabled"].includes(code)) {
        return "Fel e-postadress eller lösenord, eller kontot är avstängt.";
    }
    if (code === "auth/too-many-requests") return "För många inloggningsförsök. Försök igen senare.";
    if (code === "auth/network-request-failed") return "Nätverksfel. Kontrollera anslutningen och försök igen.";
    return "Inloggningen misslyckades. Försök igen.";
}

function setEconomyLoginBusy(busy) {
    const button = document.getElementById("authLoginButton");
    button.disabled = busy || !economyAuth;
    button.textContent = busy ? "Loggar in…" : "Logga in";
}

async function loginWithEmailPassword(event) {
    event.preventDefault();
    if (!economyAuth || document.getElementById("authLoginButton").disabled) return;
    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value;
    economyAuthMessage = "";
    document.getElementById("authLoginStatus").textContent = "";
    setEconomyLoginBusy(true);
    try {
        await economyAuth.signInWithEmailAndPassword(email, password);
        // onAuthStateChanged kontrollerar ekonomibehörigheten innan data hämtas.
    } catch (error) {
        showLoginModal(friendlyAuthError(error));
        setEconomyLoginBusy(false);
    } finally {
        document.getElementById("authPassword").value = "";
    }
}

async function rejectEconomyAccess(message, version) {
    if (version !== economySessionVersion) return;
    if (unsubscribeEconomyAccess) unsubscribeEconomyAccess();
    unsubscribeEconomyAccess = null;
    clearEconomyData();
    economyAuthMessage = message;
    showLoginModal(message);
    try {
        await economyAuth.signOut();
    } catch (error) {
        // Sidan förblir låst även om utloggningen misslyckas.
        if (version === economySessionVersion) showLoginModal(message);
    }
    if (version === economySessionVersion) setEconomyLoginBusy(false);
}

function handleEconomyAuthState(user) {
    const version = ++economySessionVersion;
    if (unsubscribeEconomyAccess) unsubscribeEconomyAccess();
    unsubscribeEconomyAccess = null;
    clearEconomyData();
    if (!user) {
        showLoginModal(economyAuthMessage);
        setEconomyLoginBusy(false);
        return;
    }
    showLoginModal("Kontrollerar behörighet…");
    setEconomyLoginBusy(true);
    try {
        unsubscribeEconomyAccess = db.collection(ECONOMY_ACCESS_COLLECTION).doc(user.uid)
            .onSnapshot({ includeMetadataChanges: true }, snapshot => {
                if (version !== economySessionVersion || economyAuth.currentUser?.uid !== user.uid) return;
                // En gammal offlinebehörighet får aldrig öppna ekonomisidorna.
                if (snapshot.metadata.fromCache) return;
                if (!snapshot.exists || snapshot.data()?.active !== true) {
                    rejectEconomyAccess("Kontot saknar behörighet till ekonomisidorna. Kontakta administratören.", version);
                    return;
                }
                if (economyAuthorized) return;
                economyAuthorized = true;
                economyAuthMessage = "";
                setEconomyLoginBusy(false);
                hideLoginModal();
                initializeRevenueFirebase();
                loadHistoricalRevenueData();
            }, error => {
                rejectEconomyAccess(error?.code === "permission-denied"
                    ? "Kontot saknar behörighet till ekonomisidorna. Kontakta administratören."
                    : "Behörigheten kunde inte kontrolleras. Kontrollera anslutningen och försök igen.", version);
            });
    } catch (error) {
        rejectEconomyAccess("Behörigheten kunde inte kontrolleras. Försök igen.", version);
    }
}

async function logoutFirebaseUser() {
    if (!economyAuth) return;
    ++economySessionVersion;
    if (unsubscribeEconomyAccess) unsubscribeEconomyAccess();
    unsubscribeEconomyAccess = null;
    economyAuthMessage = "";
    clearEconomyData();
    showLoginModal();
    setEconomyLoginBusy(true);
    try {
        await economyAuth.signOut();
    } catch (error) {
        showLoginModal("Utloggningen kunde inte slutföras. Sidan är låst; ladda om och försök igen.");
    } finally {
        setEconomyLoginBusy(false);
    }
}

async function initializeEconomyLogin() {
    showLoginModal("Kontrollerar inloggning…");
    setEconomyLoginBusy(true);
    try {
        economyApp = firebase.apps.find(app => app.name === ECONOMY_APP_NAME)
            || firebase.initializeApp(firebaseConfig, ECONOMY_APP_NAME);
        economyAuth = economyApp.auth();
        db = economyApp.firestore();
        await economyAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
        economyAuth.onAuthStateChanged(handleEconomyAuthState, () => {
            ++economySessionVersion;
            if (unsubscribeEconomyAccess) unsubscribeEconomyAccess();
            unsubscribeEconomyAccess = null;
            clearEconomyData();
            showLoginModal("Inloggningen kunde inte kontrolleras. Ladda om sidan och försök igen.");
            setEconomyLoginBusy(false);
        });
    } catch (error) {
        economyAuth = null;
        clearEconomyData();
        showLoginModal("Inloggningen är inte tillgänglig. Ladda om sidan och försök igen.");
        setEconomyLoginBusy(false);
    }
}

document.getElementById("authLoginForm").addEventListener("submit", loginWithEmailPassword);
document.getElementById("authLogoutButton").addEventListener("click", logoutFirebaseUser);
document.getElementById("authLoginOverlay").addEventListener("keydown", event => {
    if (event.key === "Escape") event.preventDefault();
    if (event.key !== "Tab") return;
    const fields = ["authEmail", "authPassword", "authLoginButton"]
        .map(id => document.getElementById(id)).filter(element => !element.disabled);
    const first = fields[0], last = fields[fields.length - 1];
    if (event.shiftKey && (document.activeElement === first || !fields.includes(document.activeElement))) {
        event.preventDefault();
        last.focus();
    } else if (!event.shiftKey && (document.activeElement === last || !fields.includes(document.activeElement))) {
        event.preventDefault();
        first.focus();
    }
});


updateRevenueToolVisibility();

initializeEconomyLogin();

</script>
