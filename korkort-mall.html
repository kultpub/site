<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skapa lärarkörkort</title>
  <style>
    :root {
      --ink: #242424;
      --soft-ink: #5a5a5a;
      --paper: #ffffff;
      --panel: #f4f6f8;
      --control: #1f2933;
      --ring: #6d8fb3;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #e8eaed;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 18px;
    }

    .page-title {
      width: min(100%, 960px);
      margin: 0;
      color: #111827;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 800;
    }

    .toolbar {
      width: min(100%, 960px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px;
      background: var(--paper);
      border: 1px solid #d8dde3;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(25, 31, 39, 0.08);
    }

    .field {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .text-field {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .text-input-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .text-input {
      width: 100%;
      min-height: 40px;
      padding: 0 34px 0 12px;
      color: #111827;
      background: #fff;
      border: 1px solid #b8c2cc;
      border-radius: 6px;
      font: 400 15px/1 Arial, Helvetica, sans-serif;
    }

    .text-input:focus {
      outline: 3px solid color-mix(in srgb, var(--ring), transparent 55%);
      outline-offset: 2px;
    }

    .clear-input {
      position: absolute;
      right: 7px;
      width: 22px;
      height: 22px;
      min-height: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: #475569;
      background: transparent;
      border: 0;
      border-radius: 50%;
      font-size: 18px;
      line-height: 1;
    }

    .clear-input:hover {
      color: #111827;
      background: #e8edf3;
    }

    .text-input-wrap.has-value .clear-input {
      display: inline-flex;
    }

    .select-wrap {
      position: relative;
      display: inline-block;
      min-width: 220px;
    }

    .select-wrap::after {
      content: "";
      position: absolute;
      right: 15px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid #111827;
      border-bottom: 2px solid #111827;
      pointer-events: none;
      transform: translateY(-65%) rotate(45deg);
      transition: transform 140ms ease;
    }

    .select-wrap.is-open::after {
      transform: translateY(-30%) rotate(225deg);
    }

    .select-button {
      width: 100%;
      min-width: 220px;
      padding: 0 36px 0 12px;
      justify-content: flex-start;
      color: #111827;
      background: #fff;
      border: 1px solid #b8c2cc;
      font-weight: 700;
      text-align: left;
    }

    .select-button:hover {
      background: #fff;
    }

    .period-options {
      position: absolute;
      z-index: 20;
      left: 0;
      right: 0;
      top: calc(100% + 5px);
      display: none;
      max-height: 260px;
      margin: 0;
      padding: 4px;
      overflow: auto;
      list-style: none;
      background: #fff;
      border: 1px solid #b8c2cc;
      border-radius: 6px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
    }

    .select-wrap.is-open .period-options {
      display: block;
    }

    .period-option {
      padding: 9px 10px;
      border-radius: 4px;
      color: #111827;
      font: 700 14px/1 Arial, Helvetica, sans-serif;
      cursor: pointer;
    }

    .period-option:hover,
    .period-option[aria-selected="true"] {
      background: #eef3f8;
    }

    label {
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      color: #334155;
    }

    button {
      min-height: 40px;
      border-radius: 6px;
      font: 700 15px/1 Arial, Helvetica, sans-serif;
    }

    select {
      min-width: 220px;
      padding: 0 36px 0 12px;
      color: #111827;
      background: #fff;
      border: 1px solid #b8c2cc;
      appearance: none;
      -webkit-appearance: none;
    }

    .select-button:focus,
    button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--ring), transparent 55%);
      outline-offset: 2px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 16px;
      color: #fff;
      background: var(--control);
      border: 1px solid var(--control);
      cursor: pointer;
    }

    button:hover {
      background: #111827;
    }

    .toolbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .details-panel {
      width: min(100%, 960px);
      padding: 12px;
      background: var(--paper);
      border: 1px solid #d8dde3;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(25, 31, 39, 0.08);
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 12px;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      padding: 8px;
      background: #f8fafc;
      border: 1px solid #e1e7ee;
      border-radius: 6px;
    }

    .detail-card-number {
      color: #334155;
      font: 800 13px/1 Arial, Helvetica, sans-serif;
      white-space: nowrap;
    }

    .detail-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .detail-field label {
      font-size: 11px;
    }

    .button-icon {
      width: 18px;
      height: 18px;
      display: inline-block;
    }

    .sheet-wrap {
      width: min(100%, 960px);
      overflow: hidden;
      padding: 0;
    }

    .sheet {
      --sheet-pad-x: 4.7mm;
      --sheet-pad-top: 4.62mm;
      --sheet-pad-bottom: 5.03mm;
      --card-width: 95.5mm;
      --card-height: 65.65mm;
      --column-gap: 9.5mm;
      --row-gap: 8.2mm;
      --cut-x: 104.95mm;
      --cut-y-1: 74.37mm;
      --cut-y-2: 148.22mm;
      --cut-y-3: 222.07mm;
      width: 210mm;
      height: 297mm;
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, var(--card-width));
      grid-template-rows: repeat(4, var(--card-height));
      column-gap: var(--column-gap);
      row-gap: var(--row-gap);
      padding: var(--sheet-pad-top) var(--sheet-pad-x) var(--sheet-pad-bottom) var(--sheet-pad-x);
      background: var(--paper);
      box-shadow: 0 10px 32px rgba(15, 23, 42, 0.16);
      transform-origin: top left;
      overflow: hidden;
    }

    .card {
      position: relative;
      z-index: 1;
      width: var(--card-width);
      height: var(--card-height);
      color: var(--ink);
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .cut-line {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      border-color: rgba(36, 36, 36, 0.42);
    }

    .cut-line.vertical {
      left: var(--cut-x);
      top: var(--sheet-pad-top);
      bottom: var(--sheet-pad-bottom);
      border-left: 0.22mm dashed currentColor;
      color: rgba(36, 36, 36, 0.42);
    }

    .cut-line.horizontal {
      left: var(--sheet-pad-x);
      right: var(--sheet-pad-x);
      border-top: 0.22mm dashed currentColor;
      color: rgba(36, 36, 36, 0.42);
    }

    .cut-line.row-1 {
      top: var(--cut-y-1);
    }

    .cut-line.row-2 {
      top: var(--cut-y-2);
    }

    .cut-line.row-3 {
      top: var(--cut-y-3);
    }

    .logo {
      width: 95.5mm;
      height: 18.25mm;
      display: block;
      object-fit: contain;
      object-position: left top;
      user-select: none;
      -webkit-user-drag: none;
    }

    .main-copy {
      margin-left: 7.18mm;
      padding-top: 7.35mm;
    }

    .title {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 4.75mm;
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .period {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 4.45mm;
      font-stretch: normal;
      font-weight: 400;
    }

    .body-text {
      margin: 2.45mm 0 0;
      font-size: 3.35mm;
      line-height: 1.2;
      font-style: italic;
      color: var(--soft-ink);
      white-space: nowrap;
    }

    .form-lines {
      margin-top: 5.3mm;
      display: grid;
      gap: 3.6mm;
      font-size: 4.05mm;
      line-height: 1;
      font-weight: 800;
    }

    .form-lines > div {
      display: grid;
      grid-template-columns: 15.3mm minmax(0, 1fr);
      align-items: baseline;
    }

    .form-value {
      font-weight: 600;
    }

    .footer {
      position: absolute;
      left: 0;
      right: 0;
      top: 58.1mm;
      border-top: 0.35mm solid var(--ink);
      padding-top: 1.95mm;
    }

    .association {
      margin: 0;
      font-family: "Arial Narrow", Arial, Helvetica, sans-serif;
      font-size: 2.85mm;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .contact {
      margin: 1.05mm 0 0;
      font-size: 2.75mm;
      line-height: 1;
      color: var(--soft-ink);
      white-space: nowrap;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html,
      body {
        width: 210mm;
        height: 297mm;
        background: #fff;
        overflow: hidden;
      }

      body {
        display: block;
        padding: 0;
        min-height: 0;
      }

      .toolbar {
        display: none !important;
      }

      .page-title,
      .details-panel {
        display: none !important;
      }

      .sheet-wrap {
        width: 210mm;
        height: 297mm !important;
        overflow: hidden;
        break-after: avoid;
        page-break-after: avoid;
      }

      .sheet {
        width: 210mm;
        height: 297mm;
        box-shadow: none;
        transform: none !important;
        break-after: avoid;
        page-break-after: avoid;
      }
    }

    @media (max-width: 760px) {
      body {
        align-items: stretch;
        padding: 10px;
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .field {
        justify-content: space-between;
        width: 100%;
      }

      .text-field {
        justify-content: space-between;
        width: 100%;
      }

      .select-button,
      .text-input,
      button {
        width: 100%;
      }

      .text-input-wrap {
        width: 100%;
      }

      .details-grid {
        grid-template-columns: 1fr;
      }

      .detail-row {
        grid-template-columns: 1fr;
      }

      .toolbar-actions {
        flex-direction: column;
        width: 100%;
      }

      .select-wrap {
        width: 100%;
      }

      .sheet-wrap {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1 class="page-title">Skapa lärarkörkort</h1>

  <div class="toolbar" aria-label="Exportinställningar">
    <div class="field">
      <label for="periodSelect">Giltighetsperiod</label>
      <span class="select-wrap">
        <button type="button" class="select-button" id="periodSelect" aria-label="Välj giltighetsperiod" aria-haspopup="listbox" aria-expanded="false"></button>
        <ul class="period-options" id="periodOptions" role="listbox" aria-label="Giltighetsperioder"></ul>
      </span>
    </div>
    <div class="toolbar-actions">
      <button type="button" id="downloadButton">
        <svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <path d="M7 10l5 5 5-5"></path>
          <path d="M12 15V3"></path>
        </svg>
        Ladda ner PDF
      </button>
    </div>
  </div>

  <section class="details-panel" aria-label="Uppgifter per körkort">
    <div class="details-grid" id="detailsGrid"></div>
  </section>

  <main class="sheet-wrap" aria-label="A4-ark med åtta körkort">
    <section class="sheet" id="sheet"></section>
  </main>

      <div class="main-copy">
        <h2 class="title">Körkort för lärare <span class="period"></span></h2>
        <p class="body-text">Gäller som entré för en person till Kulturens besöksmål.</p>
        <div class="form-lines">
          <div>Namn:<span class="form-value name-value"></span></div>
          <div>Skola:<span class="form-value school-value"></span></div>
        </div>
      </div>
      <footer class="footer">
        <p class="association">KULTURHISTORISKA FÖRENINGEN FÖR SÖDRA SVERIGE</p>
        <p class="contact">Tegnérsplatsen i Lund | www.kulturen.com | 046-35 04 00</p>
      </footer>
    </article>
  </template>

  <script>
    const periodSelect = document.getElementById('periodSelect');
    const downloadButton = document.getElementById('downloadButton');
    const detailsGrid = document.getElementById('detailsGrid');
    const sheet = document.getElementById('sheet');
    const template = document.getElementById('cardTemplate');
    const selectWrap = periodSelect.closest('.select-wrap');
    const periodOptions = document.getElementById('periodOptions');

    const periods = [];
    for (let year = 2026; year <= 2035; year += 1) {
      periods.push(`ht${year}–ht${year + 1}`);
      if (year < 2035) {
        periods.push(`vt${year + 1}–vt${year + 2}`);
      }
    }
    let selectedPeriod = periods[0];

    function buildCards() {
      const fragment = document.createDocumentFragment();
      for (let index = 0; index < 8; index += 1) {
        const card = template.content.firstElementChild.cloneNode(true);
        card.dataset.cardIndex = String(index);
        fragment.appendChild(card);
      }
      ['vertical', 'horizontal row-1', 'horizontal row-2', 'horizontal row-3'].forEach((className) => {
        const line = document.createElement('div');
        line.className = `cut-line ${className}`;
        line.setAttribute('aria-hidden', 'true');
        fragment.appendChild(line);
      });
      sheet.replaceChildren(fragment);
    }

    function buildDetailsInputs() {
      const fragment = document.createDocumentFragment();

      for (let index = 0; index < 8; index += 1) {
        const row = document.createElement('div');
        const nameId = `cardName${index}`;
        const schoolId = `cardSchool${index}`;
        row.className = 'detail-row';
        row.innerHTML = `
          <span class="detail-card-number">Kort ${index + 1}</span>
          <span class="detail-field">
            <label for="${nameId}">Namn</label>
            <span class="text-input-wrap">
              <input class="text-input detail-input" id="${nameId}" type="text" autocomplete="off" data-card-index="${index}" data-field="name" aria-label="Namn kort ${index + 1}">
              <button class="clear-input" type="button" data-clear="${nameId}" aria-label="Radera namn på kort ${index + 1}">×</button>
            </span>
          </span>
          <span class="detail-field">
            <label for="${schoolId}">Skola</label>
            <span class="text-input-wrap">
              <input class="text-input detail-input" id="${schoolId}" type="text" autocomplete="off" data-card-index="${index}" data-field="school" aria-label="Skola kort ${index + 1}">
              <button class="clear-input" type="button" data-clear="${schoolId}" aria-label="Radera skola på kort ${index + 1}">×</button>
            </span>
          </span>
        `;
        fragment.appendChild(row);
      }

      detailsGrid.replaceChildren(fragment);
    }

    function updatePeriod() {
      periodSelect.textContent = selectedPeriod;
      document.querySelectorAll('.period').forEach((target) => {
        target.textContent = selectedPeriod;
      });
    }

    function cleanValue(value) {
      return value.trim().replace(/\s+/g, ' ');
    }

    function updateTextFieldState(input) {
      input.closest('.text-input-wrap').classList.toggle('has-value', input.value.length > 0);
    }

    function getCardDetails(index) {
      const nameInput = document.getElementById(`cardName${index}`);
      const schoolInput = document.getElementById(`cardSchool${index}`);

      return {
        name: nameInput ? cleanValue(nameInput.value) : '',
        school: schoolInput ? cleanValue(schoolInput.value) : ''
      };
    }

    function updatePersonalDetails() {
      document.querySelectorAll('.card').forEach((card) => {
        const details = getCardDetails(Number(card.dataset.cardIndex));
        card.querySelector('.name-value').textContent = details.name;
        card.querySelector('.school-value').textContent = details.school;
      });

      document.querySelectorAll('.detail-input').forEach(updateTextFieldState);
    }

    function setSelectOpen(isOpen) {
      selectWrap.classList.toggle('is-open', isOpen);
      periodSelect.setAttribute('aria-expanded', String(isOpen));
    }

    function scalePreview() {
      const isPrint = window.matchMedia('print').matches;
      if (isPrint) {
        sheet.style.transform = '';
        sheet.parentElement.style.height = '';
        return;
      }

      const wrapper = sheet.parentElement;
      const scale = wrapper.clientWidth / sheet.offsetWidth;
      sheet.style.transform = `scale(${scale})`;
      wrapper.style.height = `${sheet.offsetHeight * scale}px`;
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    function readUint32(bytes, offset) {
      return ((bytes[offset] << 24) | (bytes[offset + 1] << 16) | (bytes[offset + 2] << 8) | bytes[offset + 3]) >>> 0;
    }

    function parsePngForPdf(dataUri) {
      const bytes = base64ToBytes(dataUri.split(',')[1]);
      const idatParts = [];
      let width = 0;
      let height = 0;
      let bitDepth = 8;
      let colorType = 2;
      let offset = 8;

      while (offset < bytes.length) {
        const length = readUint32(bytes, offset);
        const type = String.fromCharCode(bytes[offset + 4], bytes[offset + 5], bytes[offset + 6], bytes[offset + 7]);
        const dataStart = offset + 8;

        if (type === 'IHDR') {
          width = readUint32(bytes, dataStart);
          height = readUint32(bytes, dataStart + 4);
          bitDepth = bytes[dataStart + 8];
          colorType = bytes[dataStart + 9];
        }

        if (type === 'IDAT') {
          idatParts.push(bytes.slice(dataStart, dataStart + length));
        }

        offset = dataStart + length + 4;
      }

      const idatLength = idatParts.reduce((sum, part) => sum + part.length, 0);
      const idat = new Uint8Array(idatLength);
      let cursor = 0;
      idatParts.forEach((part) => {
        idat.set(part, cursor);
        cursor += part.length;
      });

      return { width, height, bitDepth, colorType, idat };
    }

    function joinBytes(parts) {
      const totalLength = parts.reduce((sum, part) => sum + part.length, 0);
      const result = new Uint8Array(totalLength);
      let offset = 0;
      parts.forEach((part) => {
        result.set(part, offset);
        offset += part.length;
      });
      return result;
    }

    function winAnsiHex(value) {
      const special = new Map([[0x2013, 0x96]]);
      return [...value].map((character) => {
        const code = character.codePointAt(0);
        const byte = special.get(code) ?? (code <= 255 ? code : 63);
        return byte.toString(16).padStart(2, '0').toUpperCase();
      }).join('');
    }

    function textLine(font, size, xMm, yMm, value, shade = 0) {
      const mmToPt = 72 / 25.4;
      const pageHeight = 297 * mmToPt;
      return `BT ${shade} g /${font} ${size.toFixed(2)} Tf 1 0 0 1 ${(xMm * mmToPt).toFixed(2)} ${(pageHeight - (yMm * mmToPt)).toFixed(2)} Tm <${winAnsiHex(value)}> Tj ET\n`;
    }

    function titleLine(xMm, yMm, period) {
      const mmToPt = 72 / 25.4;
      const pageHeight = 297 * mmToPt;
      return `BT 0 g /F1 13.46 Tf 1 0 0 1 ${(xMm * mmToPt).toFixed(2)} ${(pageHeight - (yMm * mmToPt)).toFixed(2)} Tm <${winAnsiHex('Körkort för lärare ')}> Tj /F2 12.61 Tf <${winAnsiHex(period)}> Tj ET\n`;
    }

    function createPdfBytes() {
      const encoder = new TextEncoder();
      const mmToPt = 72 / 25.4;
      const pageWidth = 210 * mmToPt;
      const pageHeight = 297 * mmToPt;
      const logo = parsePngForPdf(document.querySelector('.logo').src);
      const logoColors = logo.colorType === 2 ? 3 : 1;
      const content = [];

      const sheetPadX = 4.7;
      const sheetPadTop = 4.62;
      const sheetPadBottom = 5.03;
      const cardWidth = 95.5;
      const cardHeight = 65.65;
      const columnGap = 9.5;
      const rowGap = 8.2;
      const logoHeight = 18.25;
      const textLeft = 7.18;

      function pdfY(topMm, heightMm = 0) {
        return pageHeight - ((topMm + heightMm) * mmToPt);
      }

      function drawLogo(xMm, yMm) {
        content.push(`q ${(cardWidth * mmToPt).toFixed(2)} 0 0 ${(logoHeight * mmToPt).toFixed(2)} ${(xMm * mmToPt).toFixed(2)} ${pdfY(yMm, logoHeight).toFixed(2)} cm /Logo Do Q\n`);
      }

      function drawCard(xMm, yMm, cardIndex) {
        const { name: nameValue, school: schoolValue } = getCardDetails(cardIndex);

        drawLogo(xMm, yMm);
        content.push(titleLine(xMm + textLeft, yMm + 31.0, selectedPeriod));
        content.push(textLine('F3', 9.50, xMm + textLeft, yMm + 38.0, 'Gäller som entré för en person till Kulturens besöksmål.', 0.35));
        content.push(textLine('F1', 11.48, xMm + textLeft, yMm + 47.1, 'Namn:', 0));
        if (nameValue) {
          content.push(textLine('F2', 11.10, xMm + textLeft + 15.3, yMm + 47.1, nameValue, 0));
        }
        content.push(textLine('F1', 11.48, xMm + textLeft, yMm + 53.5, 'Skola:', 0));
        if (schoolValue) {
          content.push(textLine('F2', 11.10, xMm + textLeft + 15.1, yMm + 53.5, schoolValue, 0));
        }

        const lineY = yMm + 58.1;
        content.push(`0 g 0.99 w ${(xMm * mmToPt).toFixed(2)} ${pdfY(lineY).toFixed(2)} m ${((xMm + cardWidth) * mmToPt).toFixed(2)} ${pdfY(lineY).toFixed(2)} l S\n`);
        content.push(textLine('F1', 8.08, xMm, yMm + 62.2, 'KULTURHISTORISKA FÖRENINGEN FÖR SÖDRA SVERIGE', 0));
        content.push(textLine('F2', 7.80, xMm, yMm + 65.0, 'Tegnérsplatsen i Lund | www.kulturen.com | 046-35 04 00', 0.35));
      }

      for (let row = 0; row < 4; row += 1) {
        for (let column = 0; column < 2; column += 1) {
          drawCard(
            sheetPadX + column * (cardWidth + columnGap),
            sheetPadTop + row * (cardHeight + rowGap),
            row * 2 + column
          );
        }
      }

      content.push('0.42 g 0.62 w [2 2] 0 d\n');
      const cutX = 104.95;
      content.push(`${(cutX * mmToPt).toFixed(2)} ${pdfY(sheetPadTop).toFixed(2)} m ${(cutX * mmToPt).toFixed(2)} ${pdfY(297 - sheetPadBottom).toFixed(2)} l S\n`);
      [74.37, 148.22, 222.07].forEach((cutY) => {
        content.push(`${(sheetPadX * mmToPt).toFixed(2)} ${pdfY(cutY).toFixed(2)} m ${((210 - sheetPadX) * mmToPt).toFixed(2)} ${pdfY(cutY).toFixed(2)} l S\n`);
      });

      const objects = [];
      const addObject = (bytes) => {
        objects.push(bytes);
        return objects.length;
      };
      const objectText = (text) => encoder.encode(text);

      const catalogId = addObject(objectText('<< /Type /Catalog /Pages 2 0 R >>'));
      const pagesId = addObject(objectText('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
      const pageId = addObject(objectText(''));
      const boldFontId = addObject(objectText('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'));
      const regularFontId = addObject(objectText('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'));
      const italicFontId = addObject(objectText('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>'));
      const imageId = addObject(joinBytes([
        objectText(`<< /Type /XObject /Subtype /Image /Width ${logo.width} /Height ${logo.height} /ColorSpace /${logo.colorType === 2 ? 'DeviceRGB' : 'DeviceGray'} /BitsPerComponent ${logo.bitDepth} /Filter /FlateDecode /DecodeParms << /Predictor 15 /Colors ${logoColors} /BitsPerComponent ${logo.bitDepth} /Columns ${logo.width} >> /Length ${logo.idat.length} >>\nstream\n`),
        logo.idat,
        objectText('\nendstream')
      ]));
      const contentBytes = encoder.encode(content.join(''));
      const contentId = addObject(joinBytes([
        objectText(`<< /Length ${contentBytes.length} >>\nstream\n`),
        contentBytes,
        objectText('\nendstream')
      ]));

      objects[pageId - 1] = objectText(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${pageWidth.toFixed(2)} ${pageHeight.toFixed(2)}] /Resources << /Font << /F1 ${boldFontId} 0 R /F2 ${regularFontId} 0 R /F3 ${italicFontId} 0 R >> /XObject << /Logo ${imageId} 0 R >> >> /Contents ${contentId} 0 R >>`);

      const pdfParts = [objectText('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n')];
      const offsets = [0];
      let byteOffset = pdfParts[0].length;

      objects.forEach((objectBytes, index) => {
        offsets.push(byteOffset);
        const prefix = objectText(`${index + 1} 0 obj\n`);
        const suffix = objectText('\nendobj\n');
        pdfParts.push(prefix, objectBytes, suffix);
        byteOffset += prefix.length + objectBytes.length + suffix.length;
      });

      const xrefOffset = byteOffset;
      const xref = [
        'xref',
        `0 ${objects.length + 1}`,
        '0000000000 65535 f ',
        ...offsets.slice(1).map((offset) => `${String(offset).padStart(10, '0')} 00000 n `),
        'trailer',
        `<< /Size ${objects.length + 1} /Root ${catalogId} 0 R >>`,
        'startxref',
        String(xrefOffset),
        '%%EOF'
      ].join('\n');
      pdfParts.push(objectText(xref));

      return joinBytes(pdfParts);
    }

    function downloadPdf() {
      updatePeriod();
      const pdfBytes = createPdfBytes();
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.href = url;
      link.download = `korkort-${selectedPeriod.replace('–', '-')}.pdf`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    window.__createKorkortPdfBytes = createPdfBytes;

    periods.forEach((period) => {
      const option = document.createElement('li');
      option.className = 'period-option';
      option.id = `period-${period}`;
      option.setAttribute('role', 'option');
      option.setAttribute('aria-selected', String(period === selectedPeriod));
      option.tabIndex = -1;
      option.dataset.value = period;
      option.textContent = period;
      periodOptions.appendChild(option);
    });

    buildCards();
    buildDetailsInputs();
    updatePeriod();
    updatePersonalDetails();
    scalePreview();

    periodSelect.addEventListener('click', () => setSelectOpen(!selectWrap.classList.contains('is-open')));
    periodSelect.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        setSelectOpen(false);
      }

      if (event.key === ' ' || event.key === 'Enter' || event.key === 'ArrowDown' || (event.altKey && event.key === 'ArrowDown')) {
        event.preventDefault();
        setSelectOpen(true);
      }
    });
    periodOptions.addEventListener('click', (event) => {
      const option = event.target.closest('.period-option');
      if (!option) {
        return;
      }

      selectedPeriod = option.dataset.value;
      periodOptions.querySelectorAll('.period-option').forEach((item) => {
        item.setAttribute('aria-selected', String(item === option));
      });
      updatePeriod();
      setSelectOpen(false);
      periodSelect.focus();
    });
    document.addEventListener('pointerdown', (event) => {
      if (!selectWrap.contains(event.target)) {
        setSelectOpen(false);
      }
    });
    detailsGrid.addEventListener('input', (event) => {
      if (event.target.classList.contains('detail-input')) {
        updatePersonalDetails();
      }
    });
    detailsGrid.addEventListener('click', (event) => {
      const button = event.target.closest('.clear-input');
      if (!button) {
        return;
      }

      const input = document.getElementById(button.dataset.clear);
      input.value = '';
      input.focus();
      updatePersonalDetails();
    });
    window.addEventListener('resize', scalePreview);
    downloadButton.addEventListener('click', downloadPdf);
  </script>
</body>
</html>
